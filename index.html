<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Запрошення Софії</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 245, 207, 0.95), transparent 28%),
        radial-gradient(circle at 20% 75%, rgba(255, 212, 126, 0.45), transparent 32%),
        linear-gradient(180deg, #f8e7c7 0%, #dfb979 48%, #9b6635 100%);
      color: #fff;
    }

    .start-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .background-glow {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 248, 214, 0.52), transparent 34%),
        radial-gradient(circle at 72% 20%, rgba(255, 230, 151, 0.38), transparent 20%),
        radial-gradient(circle at 20% 28%, rgba(255, 236, 178, 0.32), transparent 24%);
      animation: glowBreath 6s ease-in-out infinite;
    }

    @keyframes glowBreath {
      0%, 100% {
        opacity: 0.65;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    .top-buttons {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      gap: 12px;
    }

    .music-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background:
        radial-gradient(circle at 30% 25%, #fff7c9, #e8b95e 45%, #8b4f1f 100%);
      color: #fff;
      font-size: 25px;
      font-weight: bold;
      box-shadow:
        0 0 16px rgba(255, 238, 160, 0.95),
        0 0 34px rgba(255, 191, 71, 0.75),
        inset 0 0 12px rgba(255, 255, 255, 0.35);
      cursor: pointer;
      animation: buttonPulse 1.8s infinite ease-in-out;
    }

    .music-btn.active {
      background:
        radial-gradient(circle at 30% 25%, #fff8d5, #ffd25f 42%, #a55a1b 100%);
      box-shadow:
        0 0 20px rgba(255, 250, 190, 1),
        0 0 48px rgba(255, 209, 82, 0.95),
        0 0 75px rgba(255, 177, 27, 0.65),
        inset 0 0 14px rgba(255, 255, 255, 0.45);
    }

    @keyframes buttonPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    .start-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 430px;
      min-height: 520px;
      padding: 34px 24px 30px;
      border-radius: 36px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 246, 196, 0.26), transparent 35%),
        linear-gradient(180deg, rgba(124, 72, 29, 0.72), rgba(78, 40, 15, 0.76));
      border: 1px solid rgba(255, 235, 175, 0.82);
      box-shadow:
        0 0 28px rgba(255, 221, 128, 0.72),
        0 0 80px rgba(255, 162, 32, 0.36),
        inset 0 0 24px rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .start-card::before {
      content: "";
      position: absolute;
      top: -90px;
      left: 50%;
      width: 220px;
      height: 220px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 241, 173, 0.78), transparent 66%);
      pointer-events: none;
    }

    .small-title {
      position: relative;
      z-index: 2;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff1bd;
      margin-bottom: 12px;
      text-shadow: 0 2px 7px rgba(50, 20, 0, 0.8);
    }

    h1 {
      position: relative;
      z-index: 2;
      font-size: 35px;
      line-height: 1.1;
      color: #fff5cf;
      margin-bottom: 16px;
      text-shadow:
        0 3px 10px rgba(55, 23, 0, 0.9),
        0 0 20px rgba(255, 220, 120, 0.8);
    }

    .main-text {
      position: relative;
      z-index: 2;
      font-size: 18px;
      line-height: 1.45;
      color: #fff9e9;
      margin-bottom: 26px;
      text-shadow: 0 2px 6px rgba(47, 19, 0, 0.75);
    }

    .date-box {
      position: relative;
      z-index: 2;
      width: 150px;
      height: 150px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 25%, #fffbe0 0%, #ffd86d 35%, #d9892f 78%, #7b3f16 100%);
      border: 2px solid rgba(255, 248, 220, 0.95);
      box-shadow:
        0 0 24px rgba(255, 228, 135, 0.9),
        0 0 60px rgba(255, 172, 41, 0.62),
        inset 0 0 18px rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: datePulse 2.4s ease-in-out infinite;
    }

    @keyframes datePulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    .date-number {
      font-size: 54px;
      font-weight: bold;
      line-height: 1;
      color: #fff8d9;
      text-shadow:
        0 3px 8px rgba(79, 35, 0, 0.8),
        0 0 16px rgba(255, 232, 145, 0.9);
    }

    .date-month {
      font-size: 17px;
      color: #fff8dc;
      text-shadow: 0 2px 5px rgba(60, 25, 0, 0.8);
    }

    .start-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 58px;
      border: 1px solid rgba(255, 248, 214, 0.95);
      border-radius: 999px;
      background:
        linear-gradient(180deg, #fff0a8 0%, #e4a340 52%, #9d561f 100%);
      color: #5d300d;
      font-size: 19px;
      font-weight: bold;
      font-family: Georgia, "Times New Roman", serif;
      cursor: pointer;
      box-shadow:
        0 0 18px rgba(255, 232, 140, 0.9),
        0 0 42px rgba(255, 160, 28, 0.52),
        inset 0 0 12px rgba(255, 255, 255, 0.34);
      animation: startBtnPulse 2s ease-in-out infinite;
    }

    @keyframes startBtnPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .sparkle-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff8c9;
      box-shadow:
        0 0 8px #fff8c9,
        0 0 18px #ffd35c,
        0 0 34px rgba(255, 173, 40, 0.9);
      animation: sparkleFloat linear infinite;
    }

    @keyframes sparkleFloat {
      0% {
        transform: translateY(40px) scale(0.4);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      60% {
        opacity: 0.95;
      }

      100% {
        transform: translateY(-140px) scale(1.15);
        opacity: 0;
      }
    }

    .screen-flash {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 235, 0.95), transparent 65%);
      opacity: 0;
    }

    .screen-flash.active {
      animation: screenFlash 0.7s ease forwards;
    }

    @keyframes screenFlash {
      0% {
        opacity: 0;
      }

      25% {
        opacity: 0.95;
      }

      100% {
        opacity: 0;
      }
    }

    @media (max-width: 430px) {
      .start-card {
        min-height: 500px;
        padding: 30px 22px 28px;
      }

      h1 {
        font-size: 31px;
      }

      .main-text {
        font-size: 17px;
      }

      .date-box {
        width: 138px;
        height: 138px;
      }

      .date-number {
        font-size: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="start-screen">

    <audio id="bgMusic" src="assets/music.mp3" loop></audio>

    <div class="background-glow"></div>

    <div class="top-buttons">
      <button class="music-btn" id="musicBtn" aria-label="Музика">♪</button>
    </div>

    <div class="sparkle-layer" id="sparkleLayer"></div>

    <div class="start-card">

      <div class="small-title">Запрошення</div>

      <h1>Казкова подорож Софії</h1>

      <p class="main-text">
        Ми запрошуємо тебе у маленьку чарівну історію,
        де кожна локація відкриває частинку свята.
      </p>

      <div class="date-box">
        <div class="date-number">27</div>
        <div class="date-month">червня</div>
      </div>

      <button class="start-btn" id="startBtn">
        Почати подорож
      </button>

    </div>

    <div class="screen-flash" id="screenFlash"></div>

  </div>

  <script>
    const musicBtn = document.getElementById("musicBtn");
    const bgMusic = document.getElementById("bgMusic");
    const startBtn = document.getElementById("startBtn");
    const sparkleLayer = document.getElementById("sparkleLayer");
    const screenFlash = document.getElementById("screenFlash");

    let musicPlaying = false;

    musicBtn.addEventListener("click", async () => {
      try {
        if (!musicPlaying) {
          await bgMusic.play();
          musicPlaying = true;
          musicBtn.classList.add("active");
          musicBtn.textContent = "♫";
          makeFlash();
        } else {
          bgMusic.pause();
          musicPlaying = false;
          musicBtn.classList.remove("active");
          musicBtn.textContent = "♪";
        }
      } catch (error) {
        console.log("Музика не запустилась:", error);
      }
    });

    startBtn.addEventListener("click", () => {
      makeFlash();

      setTimeout(() => {
        alert("Тут далі відкриємо мапу Софії");
      }, 350);
    });

    function makeFlash() {
      screenFlash.classList.remove("active");
      void screenFlash.offsetWidth;
      screenFlash.classList.add("active");
    }

    function createSparkles() {
      const sparkleCount = 48;

      for (let i = 0; i < sparkleCount; i++) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";

        const size = Math.random() * 5 + 3;
        const left = Math.random() * 100;
        const top = Math.random() * 100;
        const duration = Math.random() * 3 + 3;
        const delay = Math.random() * 4;

        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;
        sparkle.style.left = `${left}%`;
        sparkle.style.top = `${top}%`;
        sparkle.style.animationDuration = `${duration}s`;
        sparkle.style.animationDelay = `${delay}s`;

        sparkleLayer.appendChild(sparkle);
      }
    }

    createSparkles();
  </script>

</body>
</html>
