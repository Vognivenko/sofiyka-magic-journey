<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подорож Софійки</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@500;600;700;800&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html, body{
      width:100%;
      height:100%;
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      overflow:hidden;
      background:url("file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
      font-family:'Montserrat',sans-serif;
    }

    .screen{
      position:relative;
      width:100%;
      height:100vh;
      height:100dvh;
      overflow:hidden;
    }

    .screen::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:44%;
      background:linear-gradient(
        to bottom,
        rgba(255,220,245,0) 0%,
        rgba(255,225,245,0.18) 35%,
        rgba(70,25,80,0.34) 100%
      );
      z-index:1;
      pointer-events:none;
    }

    .content{
      position:absolute;
      left:50%;
      bottom:28px;
      transform:translateX(-50%);
      width:92%;
      max-width:430px;
      z-index:3;
      text-align:center;
    }

    .titles-card{
      width:100%;
      padding:20px 18px 22px;
      border-radius:28px;
      background:linear-gradient(
        180deg,
        rgba(255,248,255,0.68) 0%,
        rgba(255,228,245,0.50) 100%
      );
      box-shadow:
        0 0 18px rgba(255,210,245,0.42),
        inset 0 0 14px rgba(255,255,255,0.40);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
      margin-bottom:12px;
    }

    .hello{
      font-family:'Marck Script',cursive;
      font-size:40px;
      line-height:1;
      color:#ea67ac;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.8),
        0 0 12px rgba(255,255,255,0.95);
      margin-bottom:8px;
    }

    .name{
      font-family:'Cormorant Garamond',serif;
      font-size:28px;
      font-weight:700;
      color:#5b3275;
      line-height:1.05;
      text-shadow:0 0 10px rgba(255,255,255,0.9);
      margin-bottom:10px;
    }

    .ornament{
      width:76%;
      height:18px;
      margin:0 auto 12px;
      position:relative;
    }

    .ornament::before{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:8px;
      height:2px;
      background:linear-gradient(
        to right,
        transparent,
        #d9a43d,
        #ffeaa0,
        #d9a43d,
        transparent
      );
      box-shadow:0 0 8px rgba(255,224,120,0.95);
    }

    .ornament::after{
      content:"💛";
      position:absolute;
      left:50%;
      top:-3px;
      transform:translateX(-50%);
      font-size:18px;
    }

    .text,
    .small-text{
      font-family:'Cormorant Garamond',serif;
      font-size:24px;
      font-weight:600;
      line-height:1.06;
      color:#5b3275;
      text-shadow:0 0 10px rgba(255,255,255,0.95);
    }

    .text{
      margin-bottom:12px;
    }

    .small-text{
      font-size:22px;
    }

    .title-anim{
      opacity:0;
      transform:translateY(18px) scale(0.98);
      animation:titleFade 0.9s ease forwards;
    }

    .a1{ animation-delay:0.2s; }
    .a2{ animation-delay:0.7s; }
    .a3{ animation-delay:1.15s; }
    .a4{ animation-delay:1.55s; }
    .a5{ animation-delay:2s; }

    @keyframes titleFade{
      0%{
        opacity:0;
        transform:translateY(18px) scale(0.98);
        filter:blur(4px);
      }
      60%{
        opacity:1;
        transform:translateY(-2px) scale(1.01);
        filter:blur(0);
      }
      100%{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
      }
    }

    .magic-btn{
      position:relative;
      width:100%;
      border:none;
      border-radius:42px;
      padding:15px 14px;
      background:linear-gradient(
        180deg,
        #ffb8e5 0%,
        #ff7dca 38%,
        #e84ba7 70%,
        #c93587 100%
      );
      color:#fff0a8;
      font-family:'Cormorant Garamond',serif;
      font-size:28px;
      font-weight:700;
      letter-spacing:.3px;
      text-shadow:
        0 2px 4px rgba(110,35,80,0.9),
        0 0 8px rgba(255,235,150,0.8);
      box-shadow:
        0 0 12px rgba(255,230,120,0.95),
        0 0 30px rgba(255,185,90,0.75),
        0 0 42px rgba(255,105,185,0.65),
        inset 0 4px 9px rgba(255,255,255,0.65),
        inset 0 -8px 14px rgba(105,20,75,0.35);
      animation:pulse 2.2s infinite;
      cursor:pointer;
    }

    .magic-btn::before{
      content:"";
      position:absolute;
      inset:-4px;
      border-radius:46px;
      border:3px solid #ffd76f;
      box-shadow:
        inset 0 0 8px rgba(255,255,255,0.8),
        0 0 16px rgba(255,220,110,0.95);
      pointer-events:none;
    }

    .magic-btn::after{
      content:"";
      position:absolute;
      top:8px;
      left:10%;
      right:10%;
      height:28%;
      border-radius:40px;
      background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.72),
        rgba(255,255,255,0.05)
      );
      pointer-events:none;
    }

    @keyframes pulse{
      0%{ transform:scale(1); }
      50%{ transform:scale(1.03); }
      100%{ transform:scale(1); }
    }

    @media (max-width:430px){
      .hello{ font-size:36px; }
      .name{ font-size:24px; }
      .text{ font-size:21px; }
      .small-text{ font-size:20px; }
      .magic-btn{
        font-size:24px;
        padding:14px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="screen">
    <div class="content">

      <div class="titles-card">
        <div class="hello title-anim a1">Привіт!</div>
        <div class="name title-anim a2">Я Софійка.</div>
        <div class="ornament title-anim a3"></div>

        <div class="text title-anim a4">
          Скоро у мене<br>
          особливий день.
        </div>

        <div class="small-text title-anim a5">
          Допоможеш знайти<br>
          чарівне запрошення?
        </div>
      </div>

      <button class="magic-btn" onclick="location.href='map.html'">
        ✨ Почати подорож ✨
      </button>

    </div>
  </div>

</body>
</html>
