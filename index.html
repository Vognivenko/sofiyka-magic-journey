<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подорож Софійки</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:wght@500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background:url("file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
  font-family:'Cormorant Garamond',serif;
}

.screen{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

.screen::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:36%;
  background:linear-gradient(
    to bottom,
    rgba(255,220,245,0) 0%,
    rgba(255,225,245,0.10) 35%,
    rgba(70,25,80,0.24) 100%
  );
  z-index:1;
  pointer-events:none;
}

.content{
  position:absolute;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  width:92%;
  max-width:430px;
  z-index:3;
  text-align:center;
}

.titles-card{
  width:82%;
  max-width:340px;
  margin:0 auto 14px;
  padding:12px 15px 14px;
  border-radius:24px;

  background:linear-gradient(
    180deg,
    rgba(255,250,255,0.50) 0%,
    rgba(255,228,246,0.30) 100%
  );

  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);

  box-shadow:
    0 6px 20px rgba(180,120,160,0.18),
    0 0 14px rgba(255,220,245,0.25),
    inset 0 0 14px rgba(255,255,255,0.28);
}

.hello{
  font-family:'Marck Script',cursive;
  font-size:31px;
  line-height:1;
  color:#ea67ac;
  margin-bottom:4px;
  text-shadow:
    0 2px 0 rgba(255,255,255,0.75),
    0 0 10px rgba(255,255,255,0.95);
}

.name{
  font-size:22px;
  font-weight:700;
  color:#5f347b;
  line-height:1.05;
  margin-bottom:6px;
  text-shadow:0 0 9px rgba(255,255,255,0.95);
}

.ornament{
  position:relative;
  width:76%;
  height:15px;
  margin:0 auto 8px;
}

.ornament::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:7px;
  height:2px;
  background:linear-gradient(
    to right,
    transparent,
    #d9a43d,
    #ffeaa0,
    #d9a43d,
    transparent
  );
  box-shadow:0 0 8px rgba(255,224,120,0.95);
}

.ornament::after{
  content:"💛";
  position:absolute;
  left:50%;
  top:-4px;
  transform:translateX(-50%);
  font-size:16px;
}

.text-main,
.text-sub{
  color:#5f347b;
  font-weight:600;
  line-height:1.12;
  text-shadow:0 0 8px rgba(255,255,255,0.8);
}

.text-main{
  font-size:18px;
  margin-bottom:7px;
}

.text-sub{
  font-size:17px;
}

.magic-btn{
  position:relative;
  width:100%;
  border:none;
  border-radius:42px;
  padding:15px 14px;

  background:linear-gradient(
    180deg,
    #ffb9e7 0%,
    #ff7dcb 40%,
    #ea4ba9 70%,
    #c83486 100%
  );

  color:#fff2a8;
  font-family:'Cormorant Garamond',serif;
  font-size:26px;
  font-weight:700;
  letter-spacing:.3px;

  text-shadow:
    0 2px 4px rgba(110,35,80,0.9),
    0 0 6px rgba(255,235,140,0.8);

  box-shadow:
    0 0 12px rgba(255,226,120,0.95),
    0 0 30px rgba(255,172,83,0.65),
    0 0 42px rgba(255,105,185,0.56),
    inset 0 4px 10px rgba(255,255,255,0.62),
    inset 0 -8px 14px rgba(110,25,80,0.32);

  cursor:pointer;
  animation:pulse 2.2s infinite;
}

.magic-btn::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:46px;
  border:3px solid #ffd76f;
  box-shadow:
    inset 0 0 8px rgba(255,255,255,0.8),
    0 0 14px rgba(255,220,110,0.95);
  pointer-events:none;
}

.magic-btn::after{
  content:"";
  position:absolute;
  top:8px;
  left:10%;
  right:10%;
  height:26%;
  border-radius:40px;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0.72),
    rgba(255,255,255,0.05)
  );
  pointer-events:none;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.025);}
  100%{transform:scale(1);}
}

@media(max-height:720px){
  .content{
    bottom:22px;
  }

  .titles-card{
    width:80%;
    padding:11px 14px 13px;
    margin-bottom:12px;
  }

  .hello{
    font-size:29px;
  }

  .name{
    font-size:20px;
  }

  .text-main{
    font-size:16px;
  }

  .text-sub{
    font-size:15px;
  }

  .magic-btn{
    font-size:23px;
    padding:13px 12px;
  }
}

@media(max-height:650px){
  .content{
    bottom:16px;
  }

  .titles-card{
    width:78%;
    padding:10px 13px 12px;
  }

  .hello{
    font-size:27px;
  }

  .name{
    font-size:19px;
  }

  .text-main{
    font-size:15px;
  }

  .text-sub{
    font-size:14px;
  }

  .magic-btn{
    font-size:21px;
    padding:12px 10px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="content">

    <div class="titles-card">
      <div class="hello">Привіт!</div>

      <div class="name">Я Софійка.</div>

      <div class="ornament"></div>

      <div class="text-main">
        Скоро у мене<br>
        особливий день.
      </div>

      <div class="text-sub">
        Допоможеш знайти<br>
        чарівне запрошення?
      </div>
    </div>

    <button class="magic-btn" onclick="location.href='map.html'">
      ✨ Почати подорож ✨
    </button>

  </div>

</div>

</body>
</html>
