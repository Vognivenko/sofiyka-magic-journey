<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подорож Софійки</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Playfair+Display:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
background:url("file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
font-family:'Playfair Display',serif;
}

.overlay{
height:100vh;
display:flex;
align-items:flex-end;
justify-content:center;
padding:0 24px 48px;
background:linear-gradient(
to bottom,
rgba(0,0,0,0) 45%,
rgba(65,25,80,0.25) 72%,
rgba(65,25,80,0.55) 100%
);
}

.panel{
width:100%;
max-width:430px;
text-align:center;
padding:22px 16px 0;
}

.hello{
font-family:'Marck Script',cursive;
font-size:58px;
line-height:1;
color:#f26aaa;
text-shadow:
0 2px 0 #fff0f8,
0 0 12px rgba(255,255,255,.8);
margin-bottom:8px;
}

.name{
font-size:27px;
color:#5b316f;
font-weight:700;
text-shadow:0 0 10px rgba(255,255,255,.9);
margin-bottom:12px;
}

.line{
color:#d9a33c;
font-size:18px;
margin-bottom:12px;
}

.text{
font-size:23px;
line-height:1.25;
color:#5b316f;
font-weight:700;
text-shadow:0 0 12px rgba(255,255,255,.95);
margin-bottom:14px;
}

button{
width:100%;
border:3px solid #ffd66f;
border-radius:34px;
padding:15px 18px;
background:linear-gradient(180deg,#ff95d0 0%,#ee5bad 55%,#c93a8d 100%);
color:#ffe98d;
font-family:'Playfair Display',serif;
font-size:25px;
font-weight:700;
text-shadow:0 2px 5px rgba(100,30,70,.85);
box-shadow:
0 0 14px rgba(255,220,120,.95),
0 0 34px rgba(255,100,185,.85),
inset 0 0 12px rgba(255,255,255,.55),
inset 0 -7px 14px rgba(110,20,75,.3);
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.035);}
100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="overlay">
  <div class="panel">
    <div class="hello">Привіт!</div>
    <div class="name">Я Софійка.</div>
    <div class="line">──── 💛 ────</div>

    <div class="text">
      Скоро у мене<br>
      особливий день.
    </div>

    <div class="text">
      Допоможеш знайти<br>
      чарівне запрошення?
    </div>

    <button onclick="location.href='map.html'">
      ✨ Розпочати подорож ✨
    </button>
  </div>
</div>

</body>
</html>
