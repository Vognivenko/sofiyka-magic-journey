<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Подорож Софійки</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:'Arial',sans-serif;
background:url('sofiyka.jpg') center center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.25);
backdrop-filter:blur(2px);
}

.content{
position:relative;
z-index:2;
width:90%;
max-width:500px;
text-align:center;
color:white;
animation:fadeIn 1.5s ease;
}

h1{
font-size:58px;
font-weight:900;
line-height:1;
margin-bottom:20px;
text-shadow:0 0 20px rgba(255,255,255,0.8);
}

p{
font-size:24px;
line-height:1.4;
margin-bottom:45px;
text-shadow:0 0 15px rgba(0,0,0,0.7);
}

button{
border:3px solid #ffd36a;
border-radius:50px;
padding:18px 40px;
background:linear-gradient(
180deg,
#ff9ed6 0%,
#f067b8 50%,
#d63f93 100%
);
color:#fff7c9;
font-size:28px;
font-weight:800;
cursor:pointer;
text-shadow:0 2px 5px rgba(0,0,0,0.35);
box-shadow:
0 0 15px rgba(255,220,120,.9),
0 0 35px rgba(255,120,200,.8),
inset 0 0 10px rgba(255,255,255,.6);
animation:pulse 2s infinite;
}

button:hover{
transform:scale(1.05);
}

@keyframes pulse{
0%{
transform:scale(1);
}
50%{
transform:scale(1.05);
}
100%{
transform:scale(1);
}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="content">

<h1>Подорож<br>Софійки</h1>

<p>
Ласкаво просимо до чарівної пригоди
</p>

<button onclick="location.href='map.html'">
✨ Розпочати подорож ✨
</button>

</div>

</body>
</html>
