<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Подорож Софійки</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #f4ddea url("./file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
      font-family: 'Cormorant Garamond', serif;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .screen::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 30%;
      background: linear-gradient(
        to bottom,
        rgba(40, 10, 55, 0) 0%,
        rgba(40, 10, 55, 0.10) 55%,
        rgba(40, 10, 55, 0.28) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .float-star {
      position: absolute;
      color: #fff0a8;
      font-size: 18px;
      text-shadow: 0 0 12px rgba(255, 230, 120, 1);
      z-index: 4;
      opacity: .85;
      animation: floatStar 3s ease-in-out infinite;
      pointer-events: none;
    }

    .star1 {
      top: 155px;
      left: 18%;
    }

    .star2 {
      top: 130px;
      right: 15%;
      animation-delay: .9s;
    }

    .star3 {
      top: 212px;
      right: 26%;
      animation-delay: 1.5s;
    }

    .message-area {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: min(108vw, 760px);
      z-index: 5;
      pointer-events: none;
    }

    .banner-wrap {
      position: relative;
      width: 100%;
    }

    .banner-png {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 14px rgba(255, 220, 100, 0.55));
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ТЕКСТОВА ЗОНА НИЖЧЕ КОРОНИ */
    .banner-text-zone {
      position: absolute;
      left: 13%;
      right: 13%;
      top: 47%;
      height: 34%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .animated-text {
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: translateY(8px) scale(.98);
      transition:
        opacity .62s ease,
        transform .62s ease,
        filter .62s ease;
      filter: blur(2px);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      color: #5b3471;
      letter-spacing: .2px;
      line-height: .92;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, .92),
        0 2px 2px rgba(255, 240, 210, .55),
        0 3px 5px rgba(80, 30, 90, .22);
      pointer-events: none;
    }

    .animated-text.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .animated-text.hello {
      font-size: clamp(50px, 8.4vw, 66px);
      line-height: .9;
    }

    .animated-text.name {
      font-size: clamp(36px, 6.2vw, 48px);
      line-height: .88;
    }

    .animated-text.day {
      font-size: clamp(33px, 5.6vw, 44px);
      line-height: .9;
    }

    .animated-text.question {
      line-height: .88;
    }

    .animated-text.question .q-top {
      display: block;
      font-size: clamp(28px, 4.6vw, 36px);
      white-space: nowrap;
    }

    .animated-text.question .q-bottom {
      display: block;
      margin-top: 2px;
      font-size: clamp(36px, 5.8vw, 48px);
      white-space: nowrap;
    }

    .button-wrap {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%) translateY(22px);
      width: 92%;
      max-width: 470px;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 1s ease,
        transform 1s ease;
    }

    .button-wrap.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .image-btn {
      position: relative;
      width: 100%;
      display: block;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      animation: pulse 2.2s infinite;
    }

    .btn-png {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(255, 220, 95, 0.72));
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .btn-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 74%;
      text-align: center;
      white-space: nowrap;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(24px, 5vw, 33px);
      font-weight: 700;
      letter-spacing: .2px;
      color: #fff2b3;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, .55),
        0 2px 0 rgba(244, 207, 108, .55),
        0 3px 5px rgba(108, 36, 82, .90),
        0 0 8px rgba(255, 235, 140, .92);
      pointer-events: none;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.022);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes floatStar {
      0% {
        opacity: .45;
        transform: translateY(0) scale(.9);
      }

      50% {
        opacity: 1;
        transform: translateY(-8px) scale(1.12);
      }

      100% {
        opacity: .45;
        transform: translateY(0) scale(.9);
      }
    }

    @media (max-height: 760px) {
      .message-area {
        top: 50px;
      }

      .banner-text-zone {
        top: 48%;
        height: 33%;
      }

      .animated-text.hello {
        font-size: clamp(46px, 7.8vw, 60px);
      }

      .animated-text.name {
        font-size: clamp(33px, 5.8vw, 44px);
      }

      .animated-text.day {
        font-size: clamp(30px, 5.2vw, 40px);
      }

      .animated-text.question .q-top {
        font-size: clamp(25px, 4.1vw, 32px);
      }

      .animated-text.question .q-bottom {
        font-size: clamp(32px, 5.1vw, 42px);
      }

      .button-wrap {
        bottom: 34px;
      }
    }

    @media (max-height: 680px) {
      .message-area {
        top: 42px;
      }

      .banner-text-zone {
        top: 49%;
        height: 32%;
      }

      .animated-text.hello {
        font-size: clamp(42px, 7.4vw, 54px);
      }

      .animated-text.name {
        font-size: clamp(30px, 5.3vw, 40px);
      }

      .animated-text.day {
        font-size: clamp(28px, 4.9vw, 36px);
      }

      .animated-text.question .q-top {
        font-size: clamp(22px, 3.8vw, 28px);
      }

      .animated-text.question .q-bottom {
        font-size: clamp(29px, 4.8vw, 38px);
      }

      .button-wrap {
        bottom: 24px;
        width: 90%;
      }

      .btn-text {
        font-size: clamp(22px, 4.8vw, 30px);
      }
    }
  </style>
</head>

<body class="notranslate">
  <div class="screen">

    <div class="float-star star1">✨</div>
    <div class="float-star star2">✨</div>
    <div class="float-star star3">✦</div>

    <div class="message-area">
      <div class="banner-wrap">
        <img src="./crown.png?v=32" alt="Казкова стрічка" class="banner-png">

        <div class="banner-text-zone">
          <div id="animatedText" class="animated-text hello show notranslate">
            Привіт!
          </div>
        </div>
      </div>
    </div>

    <div id="buttonWrap" class="button-wrap">
      <button class="image-btn" onclick="location.href='map.html'">
        <img src="./button.png?v=32" alt="Почати подорож" class="btn-png">
        <span class="btn-text">Почати подорож</span>
      </button>
    </div>

  </div>

  <script>
    const animatedText = document.getElementById("animatedText");
    const buttonWrap = document.getElementById("buttonWrap");

    const phrases = [
      {
        html: "Привіт!",
        className: "hello"
      },
      {
        html: "Мене звати<br>Софійка.",
        className: "name"
      },
      {
        html: "Скоро у мене<br>особливий день.",
        className: "day"
      },
      {
        html: '<span class="q-top">Допоможеш знайти</span><span class="q-bottom">чарівне запрошення?</span>',
        className: "question"
      }
    ];

    let index = 0;

    function setPhrase(i) {
      animatedText.classList.remove("show");

      setTimeout(() => {
        animatedText.innerHTML = phrases[i].html;
        animatedText.className = "animated-text notranslate " + phrases[i].className;

        requestAnimationFrame(() => {
          animatedText.classList.add("show");
        });
      }, 450);
    }

    function startTextAnimation() {
      setPhrase(0);

      const timer = setInterval(() => {
        index++;

        if (index < phrases.length) {
          setPhrase(index);
        } else {
          clearInterval(timer);

          setTimeout(() => {
            buttonWrap.classList.add("show");
          }, 900);
        }
      }, 2500);
    }

    window.addEventListener("load", startTextAnimation);
  </script>
</body>
</html>
