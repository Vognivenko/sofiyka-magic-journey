<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подорож Софійки</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background:url("file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
  font-family:'Cormorant Garamond',serif;
}

.screen{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

.screen::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:28%;
  background:linear-gradient(
    to bottom,
    rgba(40,10,55,0) 0%,
    rgba(40,10,55,0.18) 50%,
    rgba(40,10,55,0.38) 100%
  );
  z-index:1;
  pointer-events:none;
}

.button-wrap{
  position:absolute;
  left:50%;
  bottom:54px;
  transform:translateX(-50%);
  width:88%;
  max-width:430px;
  z-index:3;
}

.magic-btn{
  position:relative;
  width:100%;
  border:none;
  border-radius:46px;
  padding:16px 16px;

  background:linear-gradient(
    180deg,
    #ffb9e7 0%,
    #ff7dcb 38%,
    #ea4ba9 70%,
    #c83486 100%
  );

  color:#fff2a8;
  font-family:'Cormorant Garamond',serif;
  font-size:27px;
  font-weight:700;
  letter-spacing:.4px;

  text-shadow:
    0 2px 4px rgba(110,35,80,0.95),
    0 0 8px rgba(255,235,140,0.9);

  box-shadow:
    0 0 12px rgba(255,226,120,0.95),
    0 0 30px rgba(255,172,83,0.65),
    0 0 46px rgba(255,105,185,0.58),
    inset 0 5px 10px rgba(255,255,255,0.65),
    inset 0 -9px 15px rgba(110,25,80,0.34);

  cursor:pointer;
  animation:pulse 2.2s infinite;
}

.magic-btn::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50px;
  border:3px solid #ffd76f;
  box-shadow:
    inset 0 0 8px rgba(255,255,255,0.8),
    0 0 16px rgba(255,220,110,0.95);
  pointer-events:none;
}

.magic-btn::after{
  content:"";
  position:absolute;
  top:8px;
  left:10%;
  right:10%;
  height:27%;
  border-radius:40px;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0.75),
    rgba(255,255,255,0.05)
  );
  pointer-events:none;
}

.spark-left,
.spark-right{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:22px;
  color:#fff0a8;
  text-shadow:0 0 12px rgba(255,230,120,1);
  z-index:2;
  animation:twinkle 1.8s infinite;
}

.spark-left{
  left:18px;
}

.spark-right{
  right:18px;
  animation-delay:.5s;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.025);}
  100%{transform:scale(1);}
}

@keyframes twinkle{
  0%{opacity:.55; transform:translateY(-50%) scale(.9);}
  50%{opacity:1; transform:translateY(-50%) scale(1.18);}
  100%{opacity:.55; transform:translateY(-50%) scale(.9);}
}

@media(max-height:720px){
  .button-wrap{
    bottom:42px;
    width:86%;
  }

  .magic-btn{
    font-size:24px;
    padding:14px 14px;
  }
}

@media(max-height:650px){
  .button-wrap{
    bottom:28px;
    width:84%;
  }

  .magic-btn{
    font-size:22px;
    padding:13px 12px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="button-wrap">
    <button class="magic-btn" onclick="location.href='map.html'">
      <span class="spark-left">✨</span>
      Почати подорож
      <span class="spark-right">✨</span>
    </button>
  </div>

</div>

</body>
</html>
