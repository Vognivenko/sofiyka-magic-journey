<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подорож Софійки</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;
background:url("file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
}

.overlay{
height:100vh;
display:flex;
flex-direction:column;
justify-content:flex-end;
align-items:center;
padding:0 22px 55px;
background:linear-gradient(
to bottom,
rgba(0,0,0,0) 35%,
rgba(35,10,50,0.10) 58%,
rgba(35,10,50,0.42) 100%
);
}

.content{
width:100%;
text-align:center;
}

h1{
color:white;
font-size:34px;
line-height:1.05;
font-weight:900;
margin-bottom:10px;
text-shadow:0 3px 14px rgba(0,0,0,0.65);
}

p{
color:white;
font-size:18px;
line-height:1.25;
margin-bottom:18px;
text-shadow:0 2px 10px rgba(0,0,0,0.75);
}

button{
border:3px solid #ffd36a;
border-radius:40px;
padding:14px 28px;
background:linear-gradient(180deg,#ff91d0 0%,#f05aaa 55%,#d63f93 100%);
color:#fff6bd;
font-size:22px;
font-weight:800;
text-shadow:0 2px 5px rgba(100,30,70,0.8);
box-shadow:
0 0 12px rgba(255,220,120,0.9),
0 0 28px rgba(255,105,180,0.75),
inset 0 0 10px rgba(255,255,255,0.45);
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.04);}
100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="overlay">
  <div class="content">
    <h1>Чарівна подорож<br>Софійки</h1>
    <p>Допоможеш знайти чарівне запрошення?</p>

    <button onclick="location.href='map.html'">
      ✨ Розпочати ✨
    </button>
  </div>
</div>

</body>
</html>
