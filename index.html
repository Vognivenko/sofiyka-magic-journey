<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подорож Софійки</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:wght@500;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
background:url("file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
font-family:'Cormorant Garamond',serif;
}

.screen{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
}

.screen::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:45%;
background:linear-gradient(
to bottom,
rgba(255,220,245,0) 0%,
rgba(255,225,245,0.22) 38%,
rgba(70,25,80,0.38) 100%
);
z-index:1;
}

.content{
position:absolute;
left:50%;
bottom:26px;
transform:translateX(-50%);
width:92%;
max-width:430px;
z-index:3;
text-align:center;
animation:fadeUp 1s ease;
}

.card{
width:100%;
padding:14px 16px 16px;
border-radius:30px;
background:linear-gradient(
180deg,
rgba(255,248,255,0.72) 0%,
rgba(255,225,245,0.48) 100%
);
box-shadow:
0 0 22px rgba(255,210,245,0.55),
inset 0 0 16px rgba(255,255,255,0.55);
backdrop-filter:blur(1.5px);
margin-bottom:12px;
}

.hello{
font-family:'Marck Script',cursive;
font-size:44px;
line-height:1;
color:#e95aa5;
text-shadow:
0 2px 0 #fff2fb,
0 0 10px rgba(255,255,255,0.95);
margin-bottom:0;
}

.name{
font-size:24px;
font-weight:700;
color:#57306d;
text-shadow:0 0 9px rgba(255,255,255,0.95);
margin-bottom:4px;
}

.ornament{
width:78%;
height:16px;
margin:0 auto 6px;
position:relative;
}

.ornament::before{
content:"";
position:absolute;
left:0;
right:0;
top:8px;
height:2px;
background:linear-gradient(
to right,
transparent,
#dca83d,
#fff0a6,
#dca83d,
transparent
);
box-shadow:0 0 8px rgba(255,220,120,0.9);
}

.ornament::after{
content:"💛";
position:absolute;
left:50%;
top:-5px;
transform:translateX(-50%);
font-size:18px;
}

.text{
font-size:20px;
line-height:1.12;
font-weight:700;
color:#55306a;
text-shadow:0 0 8px rgba(255,255,255,0.95);
margin-bottom:6px;
}

.small-text{
font-size:19px;
line-height:1.12;
font-weight:700;
color:#55306a;
text-shadow:0 0 8px rgba(255,255,255,0.95);
}

.magic-btn{
position:relative;
width:100%;
border:none;
border-radius:42px;
padding:16px 16px;
background:linear-gradient(
180deg,
#ffb6e4 0%,
#ff7cca 42%,
#e849a5 72%,
#c83586 100%
);
color:#fff0a8;
font-family:'Cormorant Garamond',serif;
font-size:24px;
font-weight:700;
letter-spacing:.3px;
text-shadow:
0 2px 4px rgba(100,30,70,0.9),
0 0 8px rgba(255,230,150,0.8);
box-shadow:
0 0 12px rgba(255,230,120,0.95),
0 0 30px rgba(255,185,90,0.75),
0 0 42px rgba(255,105,185,0.65),
inset 0 4px 9px rgba(255,255,255,0.65),
inset 0 -8px 14px rgba(105,20,75,0.35);
animation:pulse 2.2s infinite;
}

.magic-btn::before{
content:"";
position:absolute;
inset:-4px;
border-radius:46px;
border:3px solid #ffd76f;
box-shadow:
inset 0 0 8px rgba(255,255,255,0.8),
0 0 16px rgba(255,220,110,0.95);
pointer-events:none;
}

.magic-btn::after{
content:"";
position:absolute;
top:7px;
left:12%;
right:12%;
height:32%;
border-radius:40px;
background:linear-gradient(
to bottom,
rgba(255,255,255,0.78),
rgba(255,255,255,0.04)
);
pointer-events:none;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.035);}
100%{transform:scale(1);}
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateX(-50%) translateY(20px);
}
to{
opacity:1;
transform:translateX(-50%) translateY(0);
}
}

@media(max-height:720px){
.content{
bottom:16px;
}

.card{
padding:12px 14px 13px;
margin-bottom:10px;
}

.hello{
font-size:38px;
}

.name{
font-size:22px;
}

.text{
font-size:18px;
}

.small-text{
font-size:17px;
}

.magic-btn{
font-size:22px;
padding:14px 12px;
}
}

</style>
</head>

<body>

<div class="screen">

  <div class="content">

    <div class="card">
      <div class="hello">Привіт!</div>

      <div class="name">Я Софійка.</div>

      <div class="ornament"></div>

      <div class="text">
        Скоро у мене<br>
        особливий день.
      </div>

      <div class="small-text">
        Допоможеш знайти<br>
        чарівне запрошення?
      </div>
    </div>

    <button class="magic-btn" onclick="location.href='map.html'">
      ✨ Розпочати подорож ✨
    </button>

  </div>

</div>

</body>
</html>
