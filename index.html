<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подорож Софійки</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Alice&family=Cormorant+Garamond:wght@500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background:#f4ddea url("/sofiyka-magic-journey/file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
  font-family:'Cormorant Garamond',serif;
}

.screen{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

.screen::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:30%;
  background:linear-gradient(
    to bottom,
    rgba(40,10,55,0) 0%,
    rgba(40,10,55,0.18) 55%,
    rgba(40,10,55,0.38) 100%
  );
  z-index:1;
  pointer-events:none;
}

/* PNG-стрічка з короною */
.message-area{
  position:absolute;
  top:68px;
  left:50%;
  transform:translateX(-50%);
  width:106%;
  max-width:620px;
  z-index:5;
}

.banner-wrap{
  position:relative;
  width:100%;
}

.banner-png{
  display:block;
  width:100%;
  height:auto;
  filter:drop-shadow(0 0 14px rgba(255,220,100,0.75));
  pointer-events:none;
}

/* Текст поверх PNG-стрічки */
.animated-text{
  position:absolute;
  left:50%;
  top:69%;
  transform:translate(-50%, -50%) scale(0.98);
  width:60%;
  text-align:center;
  opacity:0;
  transition:
    opacity .75s ease,
    transform .75s ease;
  color:#5d356d;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.95),
    0 0 8px rgba(255,255,255,0.75),
    0 2px 5px rgba(90,35,90,0.18);
}

.animated-text.show{
  opacity:1;
  transform:translate(-50%, -50%) scale(1);
}

.animated-text.script{
  font-family:'Great Vibes',cursive;
  font-size:50px;
  line-height:1;
  font-weight:400;
  color:#f06ab2;
  letter-spacing:0.5px;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.95),
    0 0 8px rgba(255,255,255,0.75),
    0 0 18px rgba(255,180,220,0.55),
    2px 3px 8px rgba(123,58,98,0.28);
}

.animated-text.normal{
  font-family:'Alice',serif;
  font-size:26px;
  line-height:1.03;
  font-weight:400;
}

.animated-text.small{
  font-family:'Alice',serif;
  font-size:23px;
  line-height:1.07;
  font-weight:400;
}

/* PNG-кнопка */
.button-wrap{
  position:absolute;
  left:50%;
  bottom:50px;
  transform:translateX(-50%) translateY(22px);
  width:92%;
  max-width:470px;
  z-index:6;
  opacity:0;
  pointer-events:none;
  transition:
    opacity 1s ease,
    transform 1s ease;
}

.button-wrap.show{
  opacity:1;
  pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}

.image-btn{
  position:relative;
  width:100%;
  border:none;
  background:none;
  padding:0;
  cursor:pointer;
  animation:pulse 2.2s infinite;
}

.btn-png{
  display:block;
  width:100%;
  height:auto;
  filter:drop-shadow(0 0 18px rgba(255,220,95,0.75));
}

.btn-text{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  width:82%;
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-size:30px;
  font-weight:700;
  letter-spacing:.4px;
  color:#fff2a8;
  text-shadow:
    0 2px 4px rgba(110,35,80,0.95),
    0 0 8px rgba(255,235,140,0.9);
  pointer-events:none;
  white-space:nowrap;
}

.spark-left,
.spark-right{
  color:#fff0a8;
  text-shadow:0 0 12px rgba(255,230,120,1);
  animation:twinkleText 1.8s infinite;
}

.spark-right{
  animation-delay:.5s;
}

/* Декор-зірочки */
.float-star{
  position:absolute;
  color:#fff0a8;
  font-size:18px;
  text-shadow:0 0 12px rgba(255,230,120,1);
  z-index:4;
  opacity:.8;
  animation:floatStar 3s ease-in-out infinite;
}

.star1{
  top:150px;
  left:18%;
}

.star2{
  top:126px;
  right:15%;
  animation-delay:.9s;
}

.star3{
  top:210px;
  right:26%;
  animation-delay:1.5s;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.025);}
  100%{transform:scale(1);}
}

@keyframes twinkleText{
  0%{opacity:.65;}
  50%{opacity:1;}
  100%{opacity:.65;}
}

@keyframes floatStar{
  0%{opacity:.45; transform:translateY(0) scale(.9);}
  50%{opacity:1; transform:translateY(-8px) scale(1.12);}
  100%{opacity:.45; transform:translateY(0) scale(.9);}
}

/* Адаптація під нижчі екрани */
@media(max-height:720px){
  .message-area{
    top:54px;
    width:108%;
  }

  .animated-text{
    top:68%;
    width:60%;
  }

  .animated-text.script{
    font-size:44px;
  }

  .animated-text.normal{
    font-size:23px;
  }

  .animated-text.small{
    font-size:20px;
  }

  .button-wrap{
    bottom:38px;
    width:90%;
  }

  .btn-text{
    font-size:27px;
  }
}

@media(max-height:650px){
  .message-area{
    top:42px;
    width:108%;
  }

  .animated-text{
    top:68%;
    width:60%;
  }

  .animated-text.script{
    font-size:38px;
  }

  .animated-text.normal{
    font-size:20px;
  }

  .animated-text.small{
    font-size:18px;
  }

  .button-wrap{
    bottom:24px;
    width:88%;
  }

  .btn-text{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="float-star star1">✨</div>
  <div class="float-star star2">✨</div>
  <div class="float-star star3">✦</div>

  <div class="message-area">
    <div class="banner-wrap">
      <img src="/sofiyka-magic-journey/crown.png?v=4" alt="Казкова стрічка" class="banner-png">

      <div id="animatedText" class="animated-text script show">
        Привіт!
      </div>
    </div>
  </div>

  <div id="buttonWrap" class="button-wrap">
    <button class="image-btn" onclick="location.href='map.html'">
      <img src="/sofiyka-magic-journey/button.png?v=4" alt="Почати подорож" class="btn-png">

      <span class="btn-text">
        <span class="spark-left">✨</span>
        Почати подорож
        <span class="spark-right">✨</span>
      </span>
    </button>
  </div>

</div>

<script>
const animatedText = document.getElementById("animatedText");
const buttonWrap = document.getElementById("buttonWrap");

const phrases = [
  {
    text: "Привіт!",
    className: "script"
  },
  {
    text: "Мене звати<br>Софійка.",
    className: "normal"
  },
  {
    text: "Скоро у мене<br>особливий день.",
    className: "small"
  },
  {
    text: "Допоможеш знайти<br>чарівне запрошення?",
    className: "small"
  }
];

let index = 0;

function setPhrase(i){
  animatedText.classList.remove("show");

  setTimeout(() => {
    animatedText.innerHTML = phrases[i].text;
    animatedText.className = "animated-text " + phrases[i].className;

    requestAnimationFrame(() => {
      animatedText.classList.add("show");
    });
  }, 550);
}

function startTextAnimation(){
  setPhrase(0);

  const timer = setInterval(() => {
    index++;

    if(index < phrases.length){
      setPhrase(index);
    }else{
      clearInterval(timer);

      setTimeout(() => {
        buttonWrap.classList.add("show");
      }, 900);
    }
  }, 2500);
}

window.addEventListener("load", startTextAnimation);
</script>

</body>
</html>
