<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подорож Софійки</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&family=Cormorant+Garamond:wght@500;600;700&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html, body{
      width:100%;
      height:100%;
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      overflow:hidden;
      background:#f4ddea url("/sofiyka-magic-journey/file_00000000f1f0720a96c83b0635f64e3b.png") center/cover no-repeat;
      font-family:'Cormorant Garamond', serif;
    }

    .screen{
      position:relative;
      width:100%;
      height:100vh;
      height:100dvh;
      overflow:hidden;
    }

    .screen::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:30%;
      background:linear-gradient(
        to bottom,
        rgba(40,10,55,0) 0%,
        rgba(40,10,55,0.18) 55%,
        rgba(40,10,55,0.38) 100%
      );
      z-index:1;
      pointer-events:none;
    }

    .message-area{
      position:absolute;
      top:68px;
      left:50%;
      transform:translateX(-50%);
      width:106%;
      max-width:640px;
      z-index:5;
    }

    .banner-wrap{
      position:relative;
      width:100%;
    }

    .banner-png{
      display:block;
      width:100%;
      height:auto;
      filter:drop-shadow(0 0 14px rgba(255,220,100,0.75));
      pointer-events:none;
    }

    .curved-text-svg{
      position:absolute;
      left:50%;
      top:62%;
      transform:translate(-50%, -50%) scale(0.98);
      width:86%;
      height:62%;
      overflow:visible;
      opacity:0;
      transition:
        opacity .75s ease,
        transform .75s ease;
      pointer-events:none;
    }

    .curved-text-svg.show{
      opacity:1;
      transform:translate(-50%, -50%) scale(1);
    }

    .curved-text-svg text{
      text-anchor:middle;
      dominant-baseline:middle;
      paint-order:stroke;
      font-family:'Lobster', cursive;
      stroke:rgba(255,250,245,0.96);
      stroke-width:2.7px;
      stroke-linejoin:round;
      fill:#5a246f;
      letter-spacing:0.2px;
      filter:
        drop-shadow(0 2px 3px rgba(75,20,90,0.25))
        drop-shadow(0 0 5px rgba(255,255,255,0.7));
    }

    .curved-text-svg.hello text{
      font-size:92px;
      font-weight:400;
      fill:#e94ea3;
      stroke-width:2.2px;
      filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.95))
        drop-shadow(0 3px 5px rgba(123,58,98,0.28));
    }

    .curved-text-svg.normal text{
      font-size:64px;
      font-weight:400;
      fill:#56266b;
    }

    .curved-text-svg.small text{
      font-size:55px;
      font-weight:400;
      fill:#56266b;
    }

    .curved-text-svg.question text{
      font-size:47px;
      font-weight:400;
      fill:#56266b;
      letter-spacing:0px;
    }

    .button-wrap{
      position:absolute;
      left:50%;
      bottom:50px;
      transform:translateX(-50%) translateY(22px);
      width:92%;
      max-width:470px;
      z-index:6;
      opacity:0;
      pointer-events:none;
      transition:
        opacity 1s ease,
        transform 1s ease;
    }

    .button-wrap.show{
      opacity:1;
      pointer-events:auto;
      transform:translateX(-50%) translateY(0);
    }

    .image-btn{
      position:relative;
      width:100%;
      border:none;
      background:none;
      padding:0;
      cursor:pointer;
      animation:pulse 2.2s infinite;
    }

    .btn-png{
      display:block;
      width:100%;
      height:auto;
      filter:drop-shadow(0 0 18px rgba(255,220,95,0.75));
    }

    .btn-text{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      width:72%;
      text-align:center;
      font-family:'Cormorant Garamond', serif;
      font-size:26px;
      font-weight:700;
      letter-spacing:.3px;
      color:#fff2a8;
      text-shadow:
        0 2px 4px rgba(110,35,80,0.95),
        0 0 8px rgba(255,235,140,0.9);
      pointer-events:none;
      white-space:nowrap;
    }

    .float-star{
      position:absolute;
      color:#fff0a8;
      font-size:18px;
      text-shadow:0 0 12px rgba(255,230,120,1);
      z-index:4;
      opacity:.8;
      animation:floatStar 3s ease-in-out infinite;
    }

    .star1{
      top:150px;
      left:18%;
    }

    .star2{
      top:126px;
      right:15%;
      animation-delay:.9s;
    }

    .star3{
      top:210px;
      right:26%;
      animation-delay:1.5s;
    }

    @keyframes pulse{
      0%{transform:scale(1);}
      50%{transform:scale(1.025);}
      100%{transform:scale(1);}
    }

    @keyframes floatStar{
      0%{opacity:.45; transform:translateY(0) scale(.9);}
      50%{opacity:1; transform:translateY(-8px) scale(1.12);}
      100%{opacity:.45; transform:translateY(0) scale(.9);}
    }

    @media(max-height:720px){
      .message-area{
        top:56px;
        width:108%;
      }

      .curved-text-svg{
        top:62%;
        width:88%;
        height:64%;
      }

      .curved-text-svg.hello text{
        font-size:78px;
      }

      .curved-text-svg.normal text{
        font-size:56px;
      }

      .curved-text-svg.small text{
        font-size:48px;
      }

      .curved-text-svg.question text{
        font-size:41px;
      }

      .button-wrap{
        bottom:38px;
        width:90%;
      }

      .btn-text{
        font-size:24px;
        width:70%;
      }
    }

    @media(max-height:650px){
      .message-area{
        top:44px;
        width:108%;
      }

      .curved-text-svg{
        top:63%;
        width:90%;
        height:66%;
      }

      .curved-text-svg.hello text{
        font-size:70px;
      }

      .curved-text-svg.normal text{
        font-size:49px;
      }

      .curved-text-svg.small text{
        font-size:42px;
      }

      .curved-text-svg.question text{
        font-size:36px;
      }

      .button-wrap{
        bottom:24px;
        width:88%;
      }

      .btn-text{
        font-size:22px;
        width:70%;
      }
    }
  </style>
</head>

<body>
  <div class="screen">

    <div class="float-star star1">✨</div>
    <div class="float-star star2">✨</div>
    <div class="float-star star3">✦</div>

    <div class="message-area">
      <div class="banner-wrap">
        <img src="/sofiyka-magic-journey/crown.png?v=14" alt="Казкова стрічка" class="banner-png">

        <svg id="animatedText" class="curved-text-svg hello show" viewBox="0 0 1000 250" preserveAspectRatio="xMidYMid meet">
          <defs>
            <path id="curveLineOne" d="M 165 92 C 345 135, 655 135, 835 92"></path>
            <path id="curveLineTwo" d="M 175 158 C 355 198, 645 198, 825 158"></path>
          </defs>

          <text>
            <textPath id="lineOne" href="#curveLineOne" startOffset="50%">
              Привіт!
            </textPath>
          </text>

          <text>
            <textPath id="lineTwo" href="#curveLineTwo" startOffset="50%"></textPath>
          </text>
        </svg>
      </div>
    </div>

    <div id="buttonWrap" class="button-wrap">
      <button class="image-btn" onclick="location.href='map.html'">
        <img src="/sofiyka-magic-journey/button.png?v=14" alt="Почати подорож" class="btn-png">
        <span class="btn-text">Почати подорож</span>
      </button>
    </div>

  </div>

  <script>
    const animatedText = document.getElementById("animatedText");
    const buttonWrap = document.getElementById("buttonWrap");
    const lineOne = document.getElementById("lineOne");
    const lineTwo = document.getElementById("lineTwo");

    const phrases = [
      {
        line1: "Привіт!",
        line2: "",
        className: "hello"
      },
      {
        line1: "Мене звати",
        line2: "Софійка.",
        className: "normal"
      },
      {
        line1: "Скоро у мене",
        line2: "особливий день.",
        className: "small"
      },
      {
        line1: "Допоможеш знайти",
        line2: "чарівне запрошення?",
        className: "question"
      }
    ];

    let index = 0;

    function setPhrase(i){
      animatedText.classList.remove("show");

      setTimeout(() => {
        lineOne.textContent = phrases[i].line1;
        lineTwo.textContent = phrases[i].line2;

        animatedText.setAttribute("class", "curved-text-svg " + phrases[i].className);

        requestAnimationFrame(() => {
          animatedText.classList.add("show");
        });
      }, 550);
    }

    function startTextAnimation(){
      setPhrase(0);

      const timer = setInterval(() => {
        index++;

        if(index < phrases.length){
          setPhrase(index);
        }else{
          clearInterval(timer);

          setTimeout(() => {
            buttonWrap.classList.add("show");
          }, 900);
        }
      }, 2500);
    }

    window.addEventListener("load", startTextAnimation);
  </script>
</body>
</html>
