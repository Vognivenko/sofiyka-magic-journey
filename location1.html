<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Локація 1 — Знайомство із Софійкою</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #f8d9ef;
      color: #6f2f8b;
    }

    body {
      min-height: 100vh;
      background-image: url("fon_loc1.png");
      background-size: 100% auto;
      background-position: top center;
      background-repeat: repeat-y;
      background-color: #f8d9ef;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 16px 0 40px;
    }

    .topbar {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 14px;
      padding: 4px 6px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .image-btn {
      width: 56px;
      height: 56px;
      border: none;
      background: transparent center / contain no-repeat;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 6px 10px rgba(80, 25, 110, 0.24));
    }

    .back-btn { background-image: url("5.png"); }
    .music-btn { background-image: url("6.png"); }

    .location-title {
      width: 48%;
      max-width: 250px;
      aspect-ratio: 420 / 145;
      background: url("8.png") center / contain no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #69228b;
      font-size: clamp(23px, 5.8vw, 36px);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      padding-top: 8px;
      padding-left: 2px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.95);
    }

    .intro-text-block {
      width: 100%;
      max-width: 520px;
      margin: 34px auto 28px;
      padding: 0 34px;
      text-align: center;
    }

    .intro-kicker {
      font-size: clamp(17px, 4.1vw, 23px);
      font-weight: 700;
      margin-bottom: 6px;
      color: #7c359b;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    .intro-title {
      font-size: clamp(31px, 8.2vw, 46px);
      font-weight: 700;
      line-height: 0.94;
      color: #783193;
      margin-bottom: 12px;
      text-align: center;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.9),
        0 5px 10px rgba(120,45,145,0.2);
    }

    .intro-text {
      width: 86%;
      margin: 0 auto;
      font-size: clamp(16px, 3.9vw, 22px);
      line-height: 1.08;
      font-weight: 700;
      color: #6f2f86;
      text-align: center;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.95),
        0 0 8px rgba(255,255,255,0.65);
    }

    .task-card {
      width: 94%;
      max-width: 520px;
      margin: 14px auto 8px;
      position: relative;
      aspect-ratio: 797 / 292;
      background: url("12.png") center / contain no-repeat;
      filter: drop-shadow(0 8px 14px rgba(90,35,120,0.16));
    }

    .task-title {
      position: absolute;
      top: 19%;
      left: 41%;
      right: 11%;
      text-align: center;
      font-size: clamp(15px, 4vw, 24px);
      line-height: 0.96;
      font-weight: 700;
      color: #743092;
      text-shadow: 0 1px 0 rgba(255,255,255,0.95);
    }

    .counter-pill {
      position: absolute;
      left: 39%;
      right: 18%;
      bottom: 24%;
      text-align: center;
      color: #7a3b94;
      font-size: clamp(17px, 4.2vw, 26px);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,0.95);
    }

    .gallery-ribbon {
      width: 78%;
      max-width: 390px;
      aspect-ratio: 850 / 145;
      margin: 0 auto 8px;
      background: url("9.png") center / contain no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff6ff;
      font-size: clamp(20px, 4.9vw, 30px);
      font-weight: 700;
      text-align: center;
      text-shadow:
        0 2px 4px rgba(80,25,110,0.42),
        0 0 8px rgba(255,255,255,0.65);
      filter: drop-shadow(0 7px 11px rgba(90,35,120,0.2));
    }

    .months-grid {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
      padding: 0 8px 20px;
    }

    .month-card {
      position: relative;
      width: 100%;
      aspect-ratio: 560 / 255;
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;
      padding: 8px 7px 8px;
      filter: drop-shadow(0 7px 10px rgba(87,35,105,0.16));
      animation: cardBreath 5.2s ease-in-out infinite;
      transition: transform .25s ease, filter .25s ease;
    }

    .month-card:active {
      transform: scale(1.035);
      filter: drop-shadow(0 10px 15px rgba(87,35,105,0.22));
    }

    .month-card:nth-child(2n) { animation-delay: .45s; }
    .month-card:nth-child(3n) { animation-delay: .9s; }

    .month-pink { background-image: url("1.png"); }
    .month-blue { background-image: url("2.png"); }
    .month-green { background-image: url("3.png"); }
    .month-autumn { background-image: url("4.png"); }

    .month-title {
      height: 31%;
      padding-left: 34px;
      display: flex;
      align-items: center;
      color: #612985;
      font-size: clamp(13px, 3.4vw, 18px);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255,255,255,0.94);
    }

    .photo-row {
      height: 62%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 0 4px 4px;
    }

    .photo-item {
      position: relative;
      border: none;
      border-radius: 7px;
      overflow: hidden;
      background: rgba(255,255,255,0.35);
      box-shadow:
        0 0 0 1.5px rgba(255,225,170,0.72),
        inset 0 2px 5px rgba(255,255,255,0.75);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-size: 0;
      color: transparent;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      font-size: 0;
      color: transparent;
    }

    .photo-item.selected {
      box-shadow:
        0 0 0 2.5px rgba(255,212,90,0.95),
        0 0 11px rgba(255,205,85,0.9);
    }

    .like-badge {
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 20px;
      height: 20px;
      background: url("10.png") center / contain no-repeat;
      opacity: 0;
      transform: scale(0.55);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(90,35,90,0.25));
    }

    .photo-item.selected .like-badge {
      opacity: 1;
      transform: scale(1);
    }

    .complete-btn {
      display: none;
      width: calc(100% - 28px);
      max-width: 430px;
      margin: 10px auto 0;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      background: linear-gradient(180deg, #fff7fb, #f6d5ff);
      color: #6f2f8b;
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      box-shadow:
        0 0 0 2px rgba(255,220,120,0.95),
        0 0 18px rgba(255,220,120,0.58),
        0 9px 17px rgba(90,35,120,0.22);
      cursor: pointer;
    }

    .complete-btn.show {
      display: block;
    }

    .photo-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(42, 13, 58, 0.78);
      backdrop-filter: blur(5px);
    }

    .photo-overlay.show {
      display: flex;
    }

    .viewer-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      border-radius: 26px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(255,250,252,0.98), rgba(246,220,255,0.96));
      box-shadow:
        0 0 0 3px rgba(255,222,130,0.95),
        0 0 28px rgba(255,226,135,0.65),
        0 20px 50px rgba(20,0,40,0.38);
    }

    .viewer-img {
      width: 100%;
      max-height: 68vh;
      border-radius: 20px;
      display: block;
      object-fit: contain;
    }
