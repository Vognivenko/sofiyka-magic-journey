<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Знайомство з Софійкою</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: 'Cormorant Garamond', serif;
      background: #f3defb;
      color: #74418a;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 18% 8%, rgba(255,255,255,0.9), transparent 18%),
        radial-gradient(circle at 82% 18%, rgba(255,245,190,0.65), transparent 22%),
        linear-gradient(180deg, #ffe4f7 0%, #eadcff 48%, #dff2ff 100%);
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px 32px;
      position: relative;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .round-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      text-decoration: none;
      cursor: pointer;
      color: #74318d;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 30% 25%, #ffffff 0%, #fff8dc 32%, #ffe28a 62%, #f0b84c 100%);
      box-shadow:
        0 0 0 3px rgba(255,245,200,0.9),
        0 0 0 6px rgba(255,215,90,0.34),
        0 0 22px rgba(255,220,95,0.78),
        0 8px 18px rgba(90,35,115,0.24),
        inset 0 4px 7px rgba(255,255,255,0.95),
        inset 0 -7px 12px rgba(120,70,20,0.16);
      -webkit-tap-highlight-color: transparent;
    }

    .round-btn span {
      font-size: 32px;
      line-height: 1;
      transform: translateY(-1px);
      pointer-events: none;
    }

    .progress-pill {
      min-height: 46px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.62);
      box-shadow:
        0 0 0 2px rgba(255,230,145,0.65),
        0 8px 18px rgba(90,35,115,0.12),
        inset 0 2px 6px rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7d3f97;
      font-weight: 700;
      font-size: 18px;
      text-align: center;
    }

    .hero {
      position: relative;
      border-radius: 32px;
      padding: 26px 20px 24px;
      margin-bottom: 18px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.82), rgba(255,244,253,0.7));
      box-shadow:
        0 0 0 2px rgba(255,235,165,0.7),
        0 18px 34px rgba(86,38,112,0.18),
        inset 0 3px 8px rgba(255,255,255,0.9);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      top: -70px;
      left: -60px;
      background: radial-gradient(circle, rgba(255,230,128,0.55), transparent 68%);
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      right: -80px;
      bottom: -80px;
      background: radial-gradient(circle, rgba(218,158,255,0.42), transparent 70%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #8a4ca5;
      background: rgba(255,246,214,0.82);
      box-shadow: 0 0 0 1px rgba(255,222,120,0.8);
    }

    h1 {
      font-size: clamp(36px, 9vw, 54px);
      line-height: 0.9;
      color: #7d3f97;
      margin-bottom: 14px;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.9),
        0 5px 10px rgba(80,30,100,0.18);
    }

    .hero-text {
      font-size: 20px;
      line-height: 1.38;
      color: #70407f;
    }

    .task-card {
      position: sticky;
      top: 8px;
      z-index: 50;
      border-radius: 24px;
      padding: 14px 16px;
      margin: 16px 0 18px;
      background:
        linear-gradient(180deg, rgba(255,252,255,0.96), rgba(251,234,255,0.94));
      box-shadow:
        0 0 0 2px rgba(255,230,145,0.78),
        0 10px 22px rgba(87,35,110,0.16),
        inset 0 2px 7px rgba(255,255,255,0.88);
    }

    .task-title {
      font-size: 21px;
      line-height: 1.15;
      font-weight: 700;
      color: #7d3f97;
      text-align: center;
      margin-bottom: 8px;
    }

    .counter {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #9a5ab2;
    }

    .counter.ready {
      color: #7d3f97;
    }

    .months {
      display: grid;
      gap: 14px;
    }

    .month-card {
      position: relative;
      min-height: 132px;
      border-radius: 28px;
      padding: 18px 70px 18px 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,244,253,0.68));
      box-shadow:
        0 0 0 2px rgba(255,235,165,0.62),
        0 10px 22px rgba(86,38,112,0.13),
        inset 0 3px 8px rgba(255,255,255,0.78);
      overflow: hidden;
    }

    .month-card::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      right: -45px;
      top: -45px;
      background: radial-gradient(circle, rgba(255,224,120,0.45), transparent 68%);
      pointer-events: none;
    }

    .month-card.selected {
      box-shadow:
        0 0 0 2px rgba(255,229,120,0.95),
        0 0 24px rgba(255,224,120,0.9),
        0 12px 25px rgba(86,38,112,0.18),
        inset 0 3px 8px rgba(255,255,255,0.82);
      transform: translateY(-1px);
    }

    .month-label {
      font-size: 27px;
      line-height: 1;
      font-weight: 700;
      color: #7d3f97;
      margin-bottom: 8px;
    }

    .month-text {
      font-size: 18px;
      line-height: 1.35;
      color: #70407f;
    }

    .like-btn {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 26px;
      line-height: 1;
      background:
        radial-gradient(circle at 30% 25%, #ffffff 0%, #ffeef8 38%, #f5b4d7 72%, #c765a4 100%);
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.75),
        0 7px 15px rgba(90,35,115,0.18),
        inset 0 3px 6px rgba(255,255,255,0.88);
      -webkit-tap-highlight-color: transparent;
    }

    .month-card.selected .like-btn {
      background:
        radial-gradient(circle at 30% 25%, #ffffff 0%, #ffe4f3 28%, #ff7eb7 64%, #d93b7c 100%);
      animation: heartPulse 1.4s ease-in-out infinite;
    }

      margin-top:
