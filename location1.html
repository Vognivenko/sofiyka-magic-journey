  <style>

    .task-title {

    .gallery-zone {
      width: 100%;
      position: relative;
      margin-top: -44px;
      padding: 92px 0 0;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          rgba(248,217,239,0) 0%,
          rgba(248,217,239,0.36) 6%,
          rgba(249,218,242,0.92) 16%,

          #f8d2ec 68%,

    }

    .gallery-zone::before {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      top: -128px;
      height: 260px;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 28%, rgba(255,255,255,0.80) 0%, rgba(255,255,255,0.38) 34%, rgba(255,255,255,0) 72%),
        linear-gradient(
          180deg,
          rgba(248,217,239,0) 0%,
          rgba(248,217,239,0.30) 34%,
          rgba(248,217,239,0.82) 68%,
          #f9d8f0 100%
        );
      filter: blur(0.4px);
    }

    .gallery-zone::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.78) 0 1.1px, transparent 1.6px),
        radial-gradient(circle, rgba(255,231,150,0.62) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.48) 0 0.9px, transparent 1.4px);
      background-size:
        78px 104px,
        128px 142px,
        58px 86px;
      background-position:
        10px 20px,
        42px 76px,
        28px 48px;
      opacity: 0.20;
      animation: sparkleFloat 14s linear infinite;
    }

    .gallery-heading,
    .months-grid,
    .complete-btn,
    .bottom-decor {
      position: relative;
      z-index: 2;
    }

    .gallery-heading {
      width: 96%;
      max-width: 470px;
      margin: 4px auto 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 18px;
    }

    .gallery-heading::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 2px;
      width: 112%;
      height: 158px;
      transform: translateX(-50%);
      border-radius: 999px;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255,255,255,0.78) 0%,
          rgba(255,235,250,0.48) 38%,
          rgba(255,210,240,0.18) 64%,
          transparent 78%
        );
      filter: blur(2px);
      z-index: 0;
      pointer-events: none;
    }

    .gallery-heading::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 76%;
      height: 34px;
      transform: translateX(-50%);
      background:
        radial-gradient(
          ellipse at center,
          rgba(255,230,150,0.62) 0%,
          rgba(255,230,150,0.24) 42%,
          transparent 76%

      filter: blur(1px);
      z-index: 0;
      pointer-events: none;
    }

    .gallery-crown {
      width: 88px;
      height: 88px;
      margin-bottom: -36px;
      position: relative;
      z-index: 4;
      background: url("9.png") center / contain no-repeat;
      filter:
        drop-shadow(0 6px 8px rgba(90,35,120,0.25))
        drop-shadow(0 0 14px rgba(255,235,160,0.85));
      pointer-events: none;
    }

    .gallery-ribbon {
      width: 100%;
      aspect-ratio: 850 / 145;
      position: relative;
      z-index: 3;
      background: url("10.png") center / contain no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff6ff;
      font-size: clamp(23px, 5.4vw, 34px);
      font-weight: 700;
      text-align: center;
      padding-top: 7px;
      text-shadow:
        0 2px 4px rgba(80,25,110,0.52),
        0 0 10px rgba(255,255,255,0.85);
      filter:
        drop-shadow(0 8px 12px rgba(90,35,120,0.25))
        drop-shadow(0 0 16px rgba(255,230,170,0.35));
    }

    .months-grid {
      width: 100%;
      max-width: 430px;
      margin: 8px auto 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
      padding: 0 22px 22px;
    }

    .month-card {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      border: none;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      filter:
        drop-shadow(0 10px 16px rgba(87,35,105,0.18))
        drop-shadow(0 0 12px rgba(255,230,170,0.14));
      animation: frameBreath 5.4s ease-in-out infinite;
      transition:
        transform .25s ease,
        filter .25s ease;
      will-change: transform;
    }

    .month-card::before {
      content: "";
      position: absolute;
      left: -10px;
      right: -10px;
      top: 18px;
      bottom: 30px;
      z-index: 0;
      border-radius: 42px;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.58) 0%, rgba(255,255,255,0.18) 36%, transparent 70%),
        radial-gradient(circle at 18% 82%, rgba(255,225,245,0.50) 0%, rgba(255,225,245,0.14) 34%, transparent 62%),
        radial-gradient(circle at 86% 72%, rgba(255,238,183,0.30) 0%, rgba(255,238,183,0.10) 30%, transparent 58%),
        linear-gradient(180deg, rgba(255,245,252,0.18) 0%, rgba(255,220,243,0.16) 48%, rgba(245,198,230,0.20) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.22),
        0 0 22px rgba(255,255,255,0.16),
        0 14px 24px rgba(126,45,138,0.05);
      pointer-events: none;
    }

    .month-card::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      top: 36px;
      height: 64px;
      z-index: 0;
      border-radius: 999px;
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.08) 55%, transparent 78%);
      pointer-events: none;
    }

    .month-card:nth-child(2n) {
      animation-delay: .45s;
    }

    .month-card:nth-child(3n) {
      animation-delay: .9s;
    }

    .month-card:active {
      transform: scale(1.018);
      filter:
        drop-shadow(0 14px 22px rgba(87,35,105,0.25))
        drop-shadow(0 0 18px rgba(255,230,170,0.30));
    }

    .month-card.selected {
      animation: selectedBreath 2.7s ease-in-out infinite;
      filter:
        drop-shadow(0 15px 22px rgba(87,35,105,0.28))
        drop-shadow(0 0 26px rgba(255,115,135,0.76))
        drop-shadow(0 0 18px rgba(255,230,170,0.36));
    }

    .month-card.selected::before {
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.76) 0%, rgba(255,255,255,0.24) 38%, transparent 70%),
        radial-gradient(circle at 18% 82%, rgba(255,221,239,0.72) 0%, rgba(255,221,239,0.22) 36%, transparent 62%),
        radial-gradient(circle at 86% 72%, rgba(255,238,183,0.48) 0%, rgba(255,238,183,0.15) 32%, transparent 58%),
        linear-gradient(180deg, rgba(255,250,253,0.30) 0%, rgba(255,220,243,0.26) 48%, rgba(245,198,230,0.30) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.30),
        0 0 30px rgba(255,255,255,0.24),
        0 18px 34px rgba(126,45,138,0.08);
    }

    .month-selection-glow {
      position: absolute;
      left: 7.4%;
      top: 22.6%;
      width: 85.2%;
      height: 63.2%;
      border-radius: 22px;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      box-shadow:
        0 0 0 4px rgba(255,117,142,0.92),
        0 0 22px rgba(255,75,110,0.65),
        inset 0 0 18px rgba(255,230,235,0.45);
      transition: opacity .22s ease;
    }

    .month-card.selected .month-selection-glow {
      opacity: 1;
      animation: selectedGlow 2.2s ease-in-out infinite;
    }

    .month-photo {
      position: absolute;
      left: 7.5%;
      top: 22.8%;
      width: 85%;
      height: 63%;
      border-radius: 24px;
      object-fit: cover;
      object-position: center 36%;
      z-index: 1;
      background: rgba(255,255,255,0.45);
    }

    .month-frame {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: url("gallery_frame_one.png") center / contain no-repeat;
      pointer-events: none;
    }

    .month-title {
      position: absolute;
      top: 12.4%;
      left: 16%;
      width: 68%;
      height: 10.5%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #6a2787;
      font-size: clamp(22px, 5.8vw, 34px);
      font-weight: 700;
      line-height: 1;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.95),
        0 0 9px rgba(255,255,255,0.7),
        0 4px 9px rgba(95,35,115,0.22);
      pointer-events: none;
    }

    .month-soft-shine {
      position: absolute;
      left: 8.5%;
      top: 23.8%;
      width: 83%;
      height: 61%;
      z-index: 6;
      border-radius: 24px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.52;
      mix-blend-mode: screen;
    }

    .month-soft-shine::before {
      content: "";
      position: absolute;
      top: -30%;
      left: -70%;
      width: 42%;
      height: 160%;
      transform: rotate(18deg);
      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,255,255,0.10) 18%,
          rgba(255,255,255,0.62) 50%,
          rgba(255,255,255,0.10) 82%,
          transparent 100%
        );
      animation: photoShine 6.8s ease-in-out infinite;
    }

    .month-card.selected .month-soft-shine {
      opacity: 0.34;
    }

    .month-card.selected .month-soft-shine::before {
      animation-duration: 4.2s;
    }

    .month-sparkle-dust {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      opacity: 0.62;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 1.2px, transparent 1.8px),
        radial-gradient(circle, rgba(255,235,150,0.80) 0 1.1px, transparent 1.7px),
        radial-gradient(circle, rgba(255,255,255,0.65) 0 0.9px, transparent 1.4px);
      background-size:
        92px 122px,
        136px 166px,
        64px 92px;
      background-position:
        15px 42px,
        72px 118px,
        30px 76px;
      animation: cardSparkles 9s linear infinite;
    }

    .month-card.selected .month-sparkle-dust {
      opacity: 0.88;
      animation: selectedSparkles 4.8s linear infinite;
    }

    .month-selected-heart {
      position: absolute;
      right: 7.8%;
      bottom: 5.8%;
      width: 70px;
      height: 70px;
      z-index: 9;
      display: none;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(circle at 35% 28%, #fff8fb 0%, #ffd6e0 32%, #ff6f8f 68%, #c61f45 100%);
      box-shadow:
        0 0 0 3px rgba(255,245,248,0.95),

        0 8px 15px rgba(100,20,55,0.28);

      font-size: 39px;
      font-weight: 700;
      line-height: 1;
      text-shadow:
        0 2px 3px rgba(95,0,30,0.25),
        0 0 8px rgba(255,255,255,0.9);
    }

    .month-card.selected .month-selected-heart {
      display: flex;
      animation: heartPop .36s ease both, heartPulse 1.8s ease-in-out infinite .36s;
    }

    .month-selected-heart:active {
      transform: scale(0.92);
    }

    .complete-btn {
      display: none;
      width: calc(100% - 28px);
      max-width: 430px;
      margin: 10px auto 0;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      background: linear-gradient(180deg, #fff7fb, #f6d5ff);
      color: #6f2f8b;
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      box-shadow:
        0 0 0 2px rgba(255,220,120,0.95),
        0 0 18px rgba(255,220,120,0.58),
        0 9px 17px rgba(90,35,120,0.22);
      cursor: pointer;
    }

    .complete-btn.show {
      display: block;
    }

    .bottom-decor {
      width: 100%;
      max-width: 520px;
      height: clamp(78px, 24vw, 130px);
      margin: 10px auto 0;
      background-image: url("fon_loc1_buttom.png");
      background-size: 100% auto;
      background-position: bottom center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    .photo-overlay,
    .choice-overlay,
    .bonus-video-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(42, 13, 58, 0.80);
      backdrop-filter: blur(6px);
    }

    .photo-overlay.show,
    .choice-overlay.show,
    .bonus-video-overlay.show {
      display: flex;
    }

    .viewer-card,
    .choice-card,
    .bonus-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      border-radius: 30px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,250,252,0.98), rgba(246,220,255,0.96));
      box-shadow:
        0 0 0 3px rgba(255,222,130,0.95),
        0 0 28px rgba(255,226,135,0.65),
        0 20px 50px rgba(20,0,40,0.38);
      animation: viewerAppear .24s ease both;
    }

    .viewer-media {
      width: 100%;
      aspect-ratio: 3 / 4.2;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255,255,255,0.35);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
    }

    .viewer-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 35%;
      border-radius: 28px;
      background: rgba(255,255,255,0.25);
    }

    .viewer-title {
      margin: 10px 0 8px;
      text-align: center;
      color: #6a2787;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .viewer-btn,
    .choice-btn,
    .bonus-btn {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 12px 10px;

      font-weight: 700;
      cursor: pointer;
      color: #743092;
      background: #fff4fb;
      box-shadow:
        inset 0 0 0 1px rgba(255,220,140,0.65),
        0 4px 10px rgba(90,35,120,0.14);
    }

      padding: 24px 18px 20px;
      text-align: center;
    }

    .choice-title {
      color: #6a2787;
      font-size: 34px;
      font-weight: 700;
      line-height: 1;

        0 0 10px rgba(255,255,255,0.65);

      width: 88%;

      font-weight: 700;
      line-height: 1.08;

    .choice-actions {

      grid-template-columns: 1fr;

    }

    .choice-btn.primary,
    .bonus-btn.primary {
      background: linear-gradient(180deg, #fff6fb, #f1cfff);
      box-shadow:
        0 0 0 2px rgba(255,220,120,0.95),
        0 0 18px rgba(255,220,120,0.55),
        0 8px 16px rgba(90,35,120,0.18);
    }

    .choice-btn.video {
      background: linear-gradient(180deg, #fff9e9, #ffe4a8);
      color: #7a4386;
    }

      width: 100%;
      max-height: 70vh;
      display: block;
      border-radius: 24px;
      background: #16061f;
      object-fit: contain;
      box-shadow:
        0 0 0 2px rgba(255,220,120,0.85),
        0 0 20px rgba(255,220,120,0.35);
    }

    .bonus-actions {
      display: grid;
      grid-template-columns: 1fr;
