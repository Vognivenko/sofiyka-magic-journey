oto-overlay.show { display: flex; } .viewer-card { position: relative; width: 100%; max-width: 430px; border-radius: 30px; padding: 12px; background: linear-gradient(180deg, rgba(255,250,252,0.98), rgba(246,220,255,0.96)); box-shadow: 0 0 0 3px rgba(255,222,130,0.95), 0 0 28px rgba(255,226,135,0.65), 0 20px 50px rgba(20,0,40,0.38); animation: viewerAppear .24s ease both; } .viewer-img { width: 100%; max-height: 68vh; border-radius: 22px; display: block; object-fit: contain; background: rgba(255,255,255,0.35); } .viewer-title { margin: 8px 0 4px; text-align: center; color: #6a2787; font-size: 28px; font-weight: 700; line-height: 1; text-shadow: 0 1px 0 rgba(255,255,255,0.9); } .viewer-actions { display: flex; gap: 10px; margin-top: 12px; } .viewer-btn { flex: 1; border: none; border-radius: 999px; padding: 12px 10px; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; cursor: pointer; color: #743092; background: #fff4fb; box-shadow: inset 0 0 0 1px rgba(255,220,140,0.65), 0 4px 10px rgba(90,35,120,0.14); } .close-viewer { position: absolute; top: -14px; right: -10px; width: 42px; height: 42px; border: none; border-radius: 50%; background: #fff3fb; color: #743092; font-size: 27px; font-weight: 700; cursor: pointer; box-shadow: 0 0 0 2px rgba(255,220,120,0.9), 0 6px 12px rgba(60,20,90,0.22); } @keyframes frameBreath { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.008); } } @keyframes selectedGlow { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } } @keyframes badgePop { 0% { opacity: 0; transform: scale(0.45) rotate(-8deg); } 70% { opacity: 1; transform: scale(1.14) rotate(4deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } } @keyframes viewerAppear { 0% { opacity: 0; transform: scale(0.94) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } } </style> </head> <body class="notranslate"> <audio id="bgMusic" src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" loop preload="auto"></audio> <main class="page"> <header class="topbar"> <button class="image-btn back-btn" type="button" aria-label="Назад" onclick="goBack()"></button> <div class="location-title">Локація 1</div> <button id="musicToggle" class="image-btn music-btn" type="button" aria-label="Музика" onclick="toggleMusic(event)"></button> </header> <section class="intro-text-block"> <div class="intro-kicker">Чарівна подорож починається</div> <h1 class="intro-title">Знайомство<br>із Софійкою</h1> <p class="intro-text"> Це перша зупинка нашої казкової подорожі у світ чарівної принцеси, її перших посмішок, поглядів і маленьких перемог у житті. </p> </section> <section class="task-card"> <div class="task-title">Обери 7 наймиліших<br>фото Софійки</div> <div class="counter-pill" id="counterText">Обрано 0 з 7</div> </section> <div class="gallery-heading"> <div class="gallery-crown"></div> <div class="gallery-ribbon">Галерея по місяцях</div> </div> <section class="months-grid" id="monthsGrid"></section> <button class="complete-btn" id="completeBtn" type="button" onclick="completeLocation()"> Відкрити наступну локацію ✨ </button> <div class="bottom-decor"></div> </main> <div class="photo-overlay" id="photoOverlay" onclick="closeViewerByBg(event)"> <div class="viewer-card"> <button class="close-viewer" type="button" onclick="closeViewer()">×</button> <img class="viewer-img" id="viewerImg" src="" alt=""> <div class="viewer-title" id="viewerTitle"></div> <div class="viewer-actions"> <button class="viewer-btn" type="button" id="viewerLikeBtn" onclick="toggleCurrentPhotoLike()">❤️ Обрати</button> <button class="viewer-btn" type="button" onclick="closeViewer()">Закрити</button> </div> </div> </div> <script> var REQUIRED_LIKES = 7; var bgMusic = document.getElementById("bgMusic"); var musicToggle = document.getElementById("musicToggle"); var monthsGrid = document.getElementById("monthsGrid"); var counterText = document.getElementById("counterText"); var completeBtn = document.getElementById("completeBtn"); var photoOverlay = document.getElementById("photoOverlay"); var viewerImg = document.getElementById("viewerImg"); var viewerTitle = document.getElementById("viewerTitle"); var viewerLikeBtn = document.getElementById("viewerLikeBtn"); var currentPhotoId = null; var months = [ { title: "Народження", src: "IMG-20250705-WA0000.jpg" }, { title: "1 місяць", src: "photo_1.jpg" }, { title: "2 місяці", src: "photo_2.jpg" }, { title: "3 місяці", src: "photo_3.jpg" }, { title: "4 місяці", src: "photo_4.jpg" }, { title: "5 місяців", src: "photo_5.jpg" }, { title: "6 місяців", src: "photo_6.jpg" }, { title: "7 місяців", src: "photo_7.jpg" }, { title: "8 місяців", src: "photo_8.jpg" }, { title: "9 місяців", src: "photo_9.jpg" }, { title: "10 місяців", src: "photo_10.jpg" }, { title: "11 місяців", src: "photo_11.jpg" } ]; var selectedPhotos = JSON.parse(localStorage.getItem("sofiyka_location1_selected") || "[]"); if (bgMusic) { bgMusic.volume = 0.35; } function goBack() { window.location.href = "map.html"; } function photoId(monthIndex) { return "m" + monthIndex; } function isSelected(id) { return selectedPhotos.indexOf(id) !== -1; } function saveSelected() { localStorage.setItem("sofiyka_location1_selected", JSON.stringify(selectedPhotos)); } function renderMonths() { monthsGrid.innerHTML = ""; for (var i = 0; i < months.length; i++) { var month = months[i]; var id = photoId(i); var card = document.createElement("button"); card.className = "month-card"; card.type = "button"; card.setAttribute("data-photo-id", id); card.setAttribute("data-src", month.src); card.setAttribute("data-title", month.title); if (isSelected(id)) { card.classList.add("selected"); } card.onclick = function(event) { event.preventDefault(); event.stopPropagation(); openViewer( this.getAttribute("data-photo-id"), this.getAttribute("data-src"), this.getAttribute("data-title") ); }; var photo = document.createElement("img"); photo.className = "month-photo"; photo.src = month.src; photo.alt = month.title; photo.onerror = function() { this.style.display = "none"; }; var frame = document.createElement("div"); frame.className = "month-frame"; var title = document.createElement("div"); title.className = "month-title"; title.textContent = month.title; var badge = document.createElement("div"); badge.className = "month-selected-badge"; badge.textContent = "✓"; card.appendChild(photo); card.appendChild(frame); card.appendChild(title); card.appendChild(badge); monthsGrid.appendChild(card); } } function updateCounter() { counterText.textContent = "Обрано " + selectedPhotos.length + " з " + REQUIRED_LIKES; if (selectedPhotos.length >= REQUIRED_LIKES) { completeBtn.classList.add("show"); counterText.textContent = "Обрано 7 з 7 ✨"; } else { completeBtn.classList.remove("show"); } } function toggleLike(id) { var index = selectedPhotos.indexOf(id); if (index !== -1) { selectedPhotos.splice(index, 1); } else { if (selectedPhotos.length >= REQUIRED_LIKES) { alert("Вже обрано 7 фото. Щоб вибрати інше — спочатку зніми сердечко з одного фото ❤️"); return; } selectedPhotos.push(id); } saveSelected(); renderMonths(); updateCounter(); if (currentPhotoId === id) { updateViewerLikeButton(); } } function openViewer(id, src, title) { currentPhotoId = id; viewerImg.src = src; viewerTitle.textContent = title || ""; viewerImg.onerror = function() { this.style.display = "none"; }; viewerImg.style.display = "block"; updateViewerLikeButton(); photoOverlay.classList.add("show"); } function closeViewer() { photoOverlay.classList.remove("show"); currentPhotoId = null; viewerImg.src = ""; viewerTitle.textContent = ""; } function closeViewerByBg(event) { if (event.target === photoOverlay) { closeViewer(); } } function updateViewerLikeButton() { if (!currentPhotoId) return; if (isSelected(currentPhotoId)) { viewerLikeBtn.textContent = "💛 Прибрати"; } else { viewerLikeBtn.textContent = "❤️ Обрати"; } } function toggleCurrentPhotoLike() { if (!currentPhotoId) return; toggleLike(currentPhotoId); } function completeLocation() { if (selectedPhotos.length < REQUIRED_LIKES) { alert("Обери 7 наймиліших фото Софійки ❤️"); return; } localStorage.setItem("sofiyka_location1_done", "true"); window.location.href = "map.html"; } async function toggleMusic(event) { if (event) { event.preventDefault(); event.stopPropagation(); } if (!bgMusic || !musicToggle) return; try { if (bgMusic.paused) { await bgMusic.play(); musicToggle.style.transform = "scale(1.06)"; } else { bgMusic.pause(); musicToggle.style.transform = "scale(1)"; } } catch (error) { alert("Музика не запустилась. Перевір mp3 файл."); } } renderMonths(); updateCounter(); </script> </body> </html>
