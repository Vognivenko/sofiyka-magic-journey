<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Локація 1 — Знайомство з Софійкою</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --violet: #7e459e;
      --violet-dark: #63327d;
      --violet-soft: #9b6bb7;
      --gold: #efd77a;
      --gold-dark: #d8b94f;
      --pink: #c94fa4;
      --rose: #dc78bb;
      --text-dark: #6f4d74;
      --white: rgba(255, 252, 250, 0.94);
      --white-soft: rgba(255, 252, 250, 0.84);
      --shadow: 0 10px 26px rgba(177, 111, 187, 0.12);
      --border: 2px solid rgba(238, 219, 127, 0.85);
      --container-width: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--violet);
      font-family: "Cormorant Garamond", serif;
      background:
        linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
        url("fon_location1.png") center top / cover no-repeat;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: var(--container-width);
      margin: 0 auto;
      padding: 14px 18px 42px;
    }

    /* ===== ВЕРХНЯ НАВІГАЦІЯ БЕЗ heder_loc1.png ===== */

    .top-nav {
      position: relative;
      width: 100%;
      min-height: 112px;
      margin: 0 auto 20px;
      display: grid;
      grid-template-columns: 94px 1fr 94px;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .top-nav::before {
      content: "";
      position: absolute;
      left: 70px;
      right: 70px;
      top: 50%;
      height: 58px;
      transform: translateY(-50%);
      border-radius: 999px;
      background:
        linear-gradient(90deg,
          rgba(255,255,255,0.10),
          rgba(255,245,250,0.58),
          rgba(255,255,255,0.10)
        );
      box-shadow:
        0 8px 18px rgba(116, 61, 140, 0.10),
        inset 0 0 0 1px rgba(255,255,255,0.45);
      pointer-events: none;
      z-index: 0;
    }

    .nav-btn {
      position: relative;
      z-index: 2;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 3px solid rgba(238, 219, 127, 0.96);
      background:
        radial-gradient(circle at 34% 28%, #ffffff 0%, #fff3d9 36%, #eec86a 74%, #bd8d2e 100%);
      color: var(--violet-dark);
      font-family: "Cormorant Garamond", serif;
      font-size: 46px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 5px rgba(255, 247, 219, 0.45),
        0 8px 18px rgba(143, 85, 157, 0.18),
        inset 0 2px 10px rgba(255,255,255,0.72);
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn:active {
      transform: scale(0.96);
    }

    .back-btn {
      justify-self: start;
    }

    .music-btn {
      justify-self: end;
      background:
        radial-gradient(circle at 34% 28%, #ffffff 0%, #f8e4ff 38%, #c989ee 74%, #8f55c8 100%);
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(82, 38, 111, 0.25);
    }

    .music-btn.playing::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 3px solid rgba(255, 239, 150, 0.82);
      box-shadow:
        0 0 18px rgba(255, 239, 150, 0.82),
        0 0 26px rgba(198, 130, 235, 0.44);
      pointer-events: none;
      animation: musicGlow 1.6s ease-in-out infinite;
    }

    .location-label {
      position: relative;
      z-index: 1;
      min-height: 72px;
      padding: 14px 34px;
      justify-self: center;
      border-radius: 22px;
      border: 3px solid rgba(238, 219, 127, 0.92);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.96), rgba(255,247,232,0.88) 55%, rgba(255,231,245,0.82) 100%);
      box-shadow:
        0 8px 18px rgba(116, 61, 140, 0.12),
        inset 0 2px 10px rgba(255,255,255,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--violet-dark);
      font-size: clamp(30px, 4.2vw, 48px);
      line-height: 1;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .location-label::before,
    .location-label::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translateY(-50%) rotate(45deg);
      border: 2px solid rgba(238, 219, 127, 0.82);
      background: rgba(255,255,255,0.66);
      z-index: -1;
    }

    .location-label::before {
      left: -13px;
    }

    .location-label::after {
      right: -13px;
    }

    @keyframes musicGlow {
      0%, 100% {
        opacity: 0.45;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.06);
      }
    }

    /* ===== ПЕРШИЙ БЛОК БЕЗ НАКЛАДЕННЯ ФОНІВ ===== */

    .intro-shell {
      width: min(92%, 900px);
      margin: 22px auto 28px;
      padding: 14px;
      border-radius: 34px;
      border: 3px solid rgba(226, 193, 93, 0.75);
      background: rgba(255, 245, 250, 0.42);
      box-shadow:
        0 10px 30px rgba(177, 111, 187, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.55);
      overflow: hidden;
      position: relative;
    }

    .intro-hero {
      width: 100%;
      height: 235px;
      border-radius: 26px 26px 0 0;
      background-image: url("fon_block1.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 2px solid rgba(231, 200, 103, 0.55);
      border-bottom: none;
    }

    .intro-card {
      width: calc(100% - 40px);
      margin: -30px auto 18px;
      padding: 36px 28px 34px;
      border-radius: 28px;
      background: rgba(255, 252, 250, 0.94);
      border: 2px solid rgba(233, 210, 134, 0.7);
      box-shadow:
        0 10px 22px rgba(187, 132, 173, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.7);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .intro-card h1 {
      margin: 0 0 18px;
      font-size: clamp(38px, 5.4vw, 68px);
      line-height: 1.04;
      color: #a24e93;
      font-weight: 700;
    }

    .intro-card p {
      margin: 0 auto 26px;
      max-width: 680px;
      font-size: clamp(20px, 2.45vw, 32px);
      line-height: 1.35;
      color: var(--text-dark);
      font-weight: 600;
    }

    .intro-scroll-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 17px 44px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #df78b7 0%, #b24ea4 100%);
      color: #ffffff;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(22px, 2.5vw, 34px);
      font-weight: 700;
      box-shadow: 0 10px 22px rgba(190, 90, 160, 0.28);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .intro-scroll-btn:active {
      transform: scale(0.97);
    }

    /* ===== ЧИСТИЙ БЛОК ПРОГРЕСУ ===== */

    .progress-card {
      width: min(92%, 900px);
      margin: 0 auto 28px;
      padding: 26px 22px 28px;
      border-radius: 32px;
      border: 3px solid rgba(226, 193, 93, 0.75);
      background: rgba(255, 252, 250, 0.90);
      box-shadow:
        0 10px 26px rgba(177, 111, 187, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.65);
      text-align: center;
    }

    .progress-title {
      margin: 0 0 20px;
      font-size: clamp(30px, 4.5vw, 54px);
      line-height: 1.08;
      font-weight: 700;
      color: #8b3f92;
    }

    .progress-box {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 18px 18px 20px;
      border-radius: 26px;
      border: 2px solid rgba(226, 193, 93, 0.65);
      background: rgba(255, 255, 255, 0.84);
      box-shadow:
        0 8px 18px rgba(177, 111, 187, 0.10),
        inset 0 0 0 1px rgba(255,255,255,0.75);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .progress-icon {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1;
    }

    .progress-count {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1;
      font-weight: 700;
      color: var(--violet);
      text-shadow: 0 2px 0 rgba(255,255,255,0.8);
    }

    .progress-line {
      position: relative;
      width: 100%;
      height: 16px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(220, 202, 226, 0.75);
      box-shadow:
        inset 0 2px 6px rgba(126, 69, 158, 0.16),
        0 2px 6px rgba(255,255,255,0.65);
    }

    .progress-line-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #c978d8, #f0d875);
      transition: width 0.25s ease;
    }

    /* ===== ГАЛЕРЕЯ ===== */

    .gallery-section {
      width: min(92%, 900px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .month-card {
      display: grid;
      grid-template-columns: minmax(230px, 300px) 1fr;
      gap: 16px;
      padding: 14px;
      border-radius: 30px;
      border: var(--border);
      background: rgba(255, 252, 250, 0.88);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .month-info {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
      padding: 12px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(226, 193, 93, 0.45);
    }

    .month-icon {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      border-radius: 50%;
      border: 2px solid rgba(239, 215, 122, 0.9);
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,249,236,0.95) 35%, rgba(255,235,179,0.95) 82%);
      box-shadow:
        0 6px 14px rgba(229, 187, 89, 0.14),
        inset 0 2px 10px rgba(255,255,255,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      line-height: 1;
    }

    .month-title {
      margin: 0 0 6px;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1;
      font-weight: 700;
      color: var(--violet);
    }

    .month-subtitle {
      margin: 0;
      font-size: clamp(18px, 1.9vw, 25px);
      line-height: 1.16;
      font-weight: 600;
      color: #7f5a98;
    }

    .photo-card {
      position: relative;
      min-height: 230px;
      border-radius: 24px;
      border: none;
      background: rgba(255,255,255,0.60);
      box-shadow:
        0 5px 12px rgba(173, 117, 195, 0.08),
        inset 0 2px 8px rgba(255,255,255,0.58);
      overflow: hidden;
    }

    .month-photo {
      width: 100%;
      height: 100%;
      min-height: 230px;
      object-fit: cover;
      display: block;
      border-radius: 24px;
    }

    .photo-placeholder {
      width: 100%;
      min-height: 230px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      color: var(--violet);
      font-size: clamp(24px, 2.4vw, 34px);
      font-weight: 700;
      background: rgba(255,255,255,0.68);
    }

    .photo-placeholder span {
      display: block;
      margin-top: 8px;
      font-size: clamp(16px, 1.6vw, 22px);
      color: #8c73a1;
      font-weight: 600;
    }

    .like-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,240,246,0.96) 38%, rgba(246, 194, 221, 0.96) 88%);
      box-shadow: 0 6px 14px rgba(240, 161, 201, 0.22);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      color: #5b435f;
      transition: transform 0.12s ease, background 0.12s ease;
      z-index: 3;
      -webkit-tap-highlight-color: transparent;
    }

    .like-btn:active {
      transform: scale(0.94);
    }

    .like-btn.active {
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,220,236,0.98) 38%, rgba(255, 141, 186, 0.96) 88%);
      color: #d43d73;
      transform: scale(1.04);
    }

    /* ===== ФІНАЛ ===== */

    .unlock-card {
      width: min(92%, 900px);
      margin: 24px auto 0;
      padding: 24px 20px 26px;
      text-align: center;
      border-radius: 32px;
      border: 3px solid rgba(226, 193, 93, 0.75);
      background: rgba(255, 252, 250, 0.90);
      box-shadow: var(--shadow);
    }

    .unlock-title {
      margin: 0 0 16px;
      font-size: clamp(32px, 3.7vw, 52px);
      line-height: 1.04;
      font-weight: 700;
      color: var(--violet);
    }

    .next-btn {
      min-height: 62px;
      padding: 13px 32px;
      border-radius: 999px;
      border: 2px solid rgba(230, 216, 185, 0.88);
      background: linear-gradient(180deg, rgba(230,226,224,0.95), rgba(197,190,188,0.95));
      color: rgba(119, 96, 115, 0.88);
      font-size: clamp(24px, 2.4vw, 32px);
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      cursor: not-allowed;
      box-shadow: inset 0 3px 10px rgba(255,255,255,0.55);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    .next-btn.enabled {
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #c78be5, #a96bd1);
      border-color: rgba(233, 207, 255, 0.95);
      box-shadow:
        0 8px 20px rgba(164, 97, 204, 0.22),
        inset 0 2px 10px rgba(255,255,255,0.30);
    }

    .next-btn.enabled:active {
      transform: scale(0.98);
    }

    .hint {
      margin-top: 12px;
      min-height: 28px;
      font-size: 21px;
      font-weight: 600;
      color: #8b6e9c;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(117, 76, 150, 0.95);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(117, 76, 150, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 50;
      text-align: center;
      max-width: calc(100% - 32px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    audio {
      display: none;
    }

    /* ===== АДАПТИВ ===== */

    @media (max-width: 980px) {
      .page {
        padding: 10px 12px 34px;
      }

      .top-nav {
        min-height: 104px;
        grid-template-columns: 84px 1fr 84px;
        margin-bottom: 16px;
      }

      .nav-btn {
        width: 74px;
        height: 74px;
        font-size: 41px;
      }

      .location-label {
        min-height: 66px;
        font-size: 38px;
        padding: 12px 28px;
      }

      .month-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .page {
        padding: 8px 10px 34px;
      }

      .top-nav {
        min-height: 92px;
        grid-template-columns: 72px 1fr 72px;
        gap: 6px;
        margin-bottom: 14px;
      }

      .top-nav::before {
        left: 56px;
        right: 56px;
        height: 46px;
      }

      .nav-btn {
        width: 62px;
        height: 62px;
        font-size: 34px;
        border-width: 2px;
      }

      .location-label {
        min-height: 54px;
        padding: 9px 20px;
        font-size: 30px;
        border-radius: 18px;
      }

      .location-label::before,
      .location-label::after {
        width: 18px;
        height: 18px;
      }

      .location-label::before {
        left: -10px;
      }

      .location-label::after {
        right: -10px;
      }

      .intro-shell {
        width: calc(100% - 28px);
        margin: 18px auto 24px;
        padding: 10px;
        border-radius: 26px;
      }

      .intro-hero {
        height: 160px;
        border-radius: 20px 20px 0 0;
      }

      .intro-card {
        width: calc(100% - 20px);
        margin: -22px auto 12px;
        padding: 24px 18px 24px;
        border-radius: 22px;
      }

      .intro-card h1 {
        font-size: 40px;
        line-height: 1.05;
        margin-bottom: 14px;
      }

      .intro-card p {
        font-size: 20px;
        line-height: 1.32;
        margin-bottom: 20px;
      }

      .intro-scroll-btn {
        width: 100%;
        max-width: 320px;
        padding: 15px 20px;
        font-size: 24px;
      }

      .progress-card {
        width: calc(100% - 28px);
        padding: 22px 16px 24px;
        border-radius: 28px;
        margin-bottom: 24px;
      }

      .progress-title {
        font-size: 32px;
        margin-bottom: 16px;
      }

      .progress-box {
        padding: 16px 14px 18px;
        border-radius: 22px;
      }

      .progress-top {
        gap: 10px;
      }

      .progress-count {
        font-size: 32px;
      }

      .progress-icon {
        font-size: 32px;
      }

      .progress-line {
        height: 14px;
      }

      .gallery-section {
        width: calc(100% - 28px);
        gap: 16px;
      }

      .month-card {
        padding: 10px;
        border-radius: 26px;
        gap: 10px;
      }

      .month-info {
        gap: 10px;
      }

      .month-icon {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
        font-size: 28px;
      }

      .month-title {
        font-size: 30px;
      }

      .month-subtitle {
        font-size: 20px;
      }

      .photo-card,
      .month-photo,
      .photo-placeholder {
        min-height: 270px;
      }

      .like-btn {
        width: 42px;
        height: 42px;
        top: 10px;
        right: 10px;
        font-size: 23px;
      }

      .unlock-card {
        width: calc(100% - 28px);
        padding: 22px 16px 24px;
      }

      .unlock-title {
        font-size: 31px;
      }

      .next-btn {
        width: 100%;
        font-size: 24px;
      }

      .hint {
        font-size: 18px;
      }
    }

    @media (max-width: 420px) {
      .top-nav {
        grid-template-columns: 66px 1fr 66px;
      }

      .nav-btn {
        width: 58px;
        height: 58px;
        font-size: 32px;
      }

      .location-label {
        font-size: 28px;
        padding-left: 16px;
        padding-right: 16px;
      }

      .intro-card h1 {
        font-size: 37px;
      }

      .intro-card p {
        font-size: 19px;
      }

      .progress-title {
        font-size: 30px;
      }

      .progress-count {
        font-size: 30px;
      }

      .month-title {
        font-size: 28px;
      }

      .month-subtitle {
        font-size: 19px;
      }

      .photo-card,
      .month-photo,
      .photo-placeholder {
        min-height: 245px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio id="bgMusic" loop preload="auto">
    <source src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="page">

    <header class="top-nav">
      <button class="nav-btn back-btn" id="backBtn" type="button" aria-label="Назад">
        ←
      </button>

      <div class="location-label">
        Локація 1
      </div>

      <button class="nav-btn music-btn" id="musicBtn" type="button" aria-l
