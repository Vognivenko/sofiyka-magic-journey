<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Локація 1 — Знайомство із Софійкою</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #f8d9ef;
      color: #6f2f8b;
    }

    body {
      min-height: 100vh;
      background-color: #f8d9ef;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 16px 0 0;
      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(
          180deg,
          rgba(248, 217, 239, 0) 0%,
          rgba(248, 217, 239, 0) 58%,
          #f8d9ef 76%,
          #f8d9ef 100%
        ),
        url("fon_loc1.png");

      background-size:
        100% 100%,
        100% auto;

      background-position:
        top center,
        top center;

      background-repeat:
        no-repeat,
        no-repeat;

      background-color: #f8d9ef;
    }

    .topbar {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 14px;
      padding: 4px 6px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .image-btn {
      width: 56px;
      height: 56px;
      border: none;
      background: transparent center / contain no-repeat;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 6px 10px rgba(80, 25, 110, 0.24));
    }

    .back-btn {
      background-image: url("5.png");
    }

    .music-btn {
      background-image: url("6.png");
    }

    .location-title {
      width: 48%;
      max-width: 250px;
      aspect-ratio: 420 / 145;
      background: url("8.png") center / contain no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #69228b;
      font-size: clamp(23px, 5.8vw, 36px);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      padding-top: 8px;
      padding-left: 2px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.95);
    }

    .intro-text-block {
      width: 100%;
      max-width: 520px;
      margin: 34px auto 30px;
      padding: 0 34px;
      text-align: center;
    }

    .intro-kicker {
      font-size: clamp(17px, 4.1vw, 23px);
      font-weight: 700;
      margin-bottom: 6px;
      color: #7c359b;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    .intro-title {
      font-size: clamp(30px, 7.8vw, 44px);
      font-weight: 700;
      line-height: 0.94;
      color: #783193;
      margin-bottom: 12px;
      text-align: center;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.9),
        0 5px 10px rgba(120,45,145,0.2);
    }

    .intro-text {
      width: 76%;
      margin: 0 auto;
      font-size: clamp(15px, 3.6vw, 20px);
      line-height: 1.08;
      font-weight: 700;
      color: #6f2f86;
      text-align: center;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.95),
        0 0 8px rgba(255,255,255,0.65);
    }

    .task-card {
      width: 92%;
      max-width: 520px;
      margin: 54px auto 18px;
      position: relative;
      aspect-ratio: 797 / 292;
      background: url("12.png") center / contain no-repeat;
      filter: drop-shadow(0 8px 14px rgba(90,35,120,0.16));
    }

    .task-title {
      position: absolute;
      top: 19%;
      left: 38%;
      width: 43%;
      text-align: center;
      font-size: clamp(15px, 3.8vw, 23px);
      line-height: 0.95;
      font-weight: 700;
      color: #743092;
      text-shadow: 0 1px 0 rgba(255,255,255,0.95);
    }

    .counter-pill {
      position: absolute;
      top: 63%;
      left: 34%;
      width: 43%;
      text-align: center;
      color: #7a3b94;
      font-size: clamp(17px, 4.1vw, 25px);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,0.95);
    }

    .gallery-heading {
      width: 84%;
      max-width: 420px;
      margin: 4px auto 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-crown {
      width: 62px;
      height: 62px;
      margin-bottom: -24px;
      position: relative;
      z-index: 3;
      background: url("9.png") center / contain no-repeat;
      filter:
        drop-shadow(0 4px 7px rgba(90,35,120,0.22))
        drop-shadow(0 0 8px rgba(255,240,180,0.65));
      pointer-events: none;
    }

    .gallery-ribbon {
      width: 100%;
      aspect-ratio: 850 / 145;
      position: relative;
      z-index: 2;
      background: url("10.png") center / contain no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff6ff;
      font-size: clamp(20px, 4.9vw, 30px);
      font-weight: 700;
      text-align: center;
      padding-top: 5px;
      text-shadow:
        0 2px 4px rgba(80,25,110,0.45),
        0 0 9px rgba(255,255,255,0.75);
      filter: drop-shadow(0 7px 11px rgba(90,35,120,0.22));
    }

    .months-grid {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 0 18px 26px;
    }

    .month-card {
      position: relative;
      width: 100%;
      aspect-ratio: 560 / 255;
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;
      padding: 12px 15px 13px;
      filter: drop-shadow(0 8px 12px rgba(87,35,105,0.18));
      animation: cardBreath 5.2s ease-in-out infinite;
      transition: transform .25s ease, filter .25s ease;
    }

    .month-card:active {
      transform: scale(1.025);
      filter: drop-shadow(0 12px 18px rgba(87,35,105,0.24));
    }

    .month-card:nth-child(2n) {
      animation-delay: .45s;
    }

    .month-card:nth-child(3n) {
      animation-delay: .9s;
    }

    .month-pink {
      background-image: url("1.png");
    }

    .month-blue {
      background-image: url("2.png");
    }

    .month-green {
      background-image: url("3.png");
    }

    .month-autumn {
      background-image: url("4.png");
    }

    .month-title {
      height: 32%;
      padding-left: 58px;
      display: flex;
      align-items: center;
      color: #612985;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.96),
        0 0 7px rgba(255,255,255,0.55);
    }

    .photo-row {
      height: 58%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 2px 18px 8px 54px;
    }

    .photo-item {
      position: relative;
      border: none;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,0.38);
      box-shadow:
        0 0 0 2px rgba(255,225,170,0.75),
        inset 0 2px 5px rgba(255,255,255,0.8);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-size: 0;
      color: transparent;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      font-size: 0;
      color: transparent;
    }

    .photo-item.selected {
      box-shadow:
        0 0 0 3px rgba(255,212,90,0.95),
        0 0 13px rgba(255,205,85,0.9);
    }

    .like-badge {
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 22px;
      height: 22px;
      background: none;
      opacity: 0;
      transform: scale(0.55);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
    }

    .photo-item.selected .like-badge {
      opacity: 1;
      transform: scale(1);
    }

    .complete-btn {
      display: none;
      width: calc(100% - 28px);
      max-width: 430px;
      margin: 12px auto 0;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      background: linear-gradient(180deg, #fff7fb, #f6d5ff);
      color: #6f2f8b;
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      box-shadow:
        0 0 0 2px rgba(255,220,120,0.95),
        0 0 18px rgba(255,220,120,0.58),
        0 9px 17px rgba(90,35,120,0.22);
      cursor: pointer;
    }

    .complete-btn.show {
      display: block;
    }

    .bottom-decor {
      width: 100%;
      max-width: 520px;
      height: clamp(78px, 24vw, 130px);
      margin: 10px auto 0;
      background-image: url("fon_loc1_buttom.png");
      background-size: 100% auto;
      background-position: bottom center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    .photo-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(42, 13, 58, 0.78);
      backdrop-filter: blur(5px);
    }

    .photo-overlay.show {
      display: flex;
    }

    .viewer-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      border-radius: 26px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(255,250,252,0.98), rgba(246,220,255,0.96));
      box-shadow:
        0 0 0 3px rgba(255,222,130,0.95),
        0 0 28px rgba(255,226,135,0.65),
        0 20px 50px rgba(20,0,40,0.38);
    }

    .viewer-img {
      width: 100%;
      max-height: 68vh;
      border-radius: 20px;
      display: block;
      object-fit: contain;
    }

    .viewer-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .viewer-btn {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 12px 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      color: #743092;
      background: #fff4fb;
    }

    .close-viewer {
      position: absolute;
      top: -14px;
      right: -10px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #fff3fb;
      color: #743092;
      font-size: 27px;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes cardBreath {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-2px) scale(1.006);
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio id="bgMusic" src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" loop preload="auto"></audio>

  <main class="page">

    <header class="topbar">
      <button class="image-btn back-btn" type="button" aria-label="Назад" onclick="goBack()"></button>
      <div class="location-title">Локація 1</div>
      <button id="musicToggle" class="image-btn music-btn" type="button" aria-label="Музика" onclick="toggleMusic(event)"></button>
    </header>

    <section class="intro-text-block">
      <div class="intro-kicker">Чарівна подорож починається</div>
      <h1 class="intro-title">Знайомство<br>із Софійкою</h1>
      <p class="intro-text">
        Це перша зупинка нашої казкової подорожі у світ чарівної принцеси,
        її перших посмішок, поглядів і маленьких перемог у житті.
      </p>
    </section>

    <section class="task-card">
      <div class="task-title">Обери 7 наймиліших<br>фото Софійки</div>
      <div class="counter-pill" id="counterText">Обрано 0 з 7</div>
    </section>

    <div class="gallery-heading">
      <div class="gallery-crown"></div>
      <div class="gallery-ribbon">Галерея по місяцях</div>
    </div>

    <section class="months-grid" id="monthsGrid"></section>

    <button class="complete-btn" id="completeBtn" type="button" onclick="completeLocation()">
      Відкрити наступну локацію ✨
    </button>

    <div class="bottom-decor"></div>

  </main>

  <div class="photo-overlay" id="photoOverlay" onclick="closeViewerByBg(event)">
    <div class="viewer-card">
      <button class="close-viewer" type="button" onclick="closeViewer()">×</button>
      <img class="viewer-img" id="viewerImg" src="" alt="">
      <div class="viewer-actions">
        <button class="viewer-btn" type="button" id="viewerLikeBtn" onclick="toggleCurrentPhotoLike()">❤️ Обрати</button>
        <button class="viewer-btn" type="button" onclick="closeViewer()">Закрити</button>
      </div>
    </div>
  </div>

  <script>
    var REQUIRED_LIKES = 7;

    var bgMusic = document.getElementById("bgMusic");
    var musicToggle = document.getElementById("musicToggle");
    var monthsGrid = document.getElementById("monthsGrid");
    var counterText = document.getElementById("counterText");
    var completeBtn = document.getElementById("completeBtn");
    var photoOverlay = document.getElementById("photoOverlay");
    var viewerImg = document.getElementById("viewerImg");
    var viewerLikeBtn = document.getElementById("viewerLikeBtn");

    var currentPhotoId = null;

    var months = [
      { title: "Народження", style: "month-pink", prefix: "photo_0" },
      { title: "1 місяць", style: "month-pink", prefix: "photo_1" },
      { title: "2 місяці", style: "month-pink", prefix: "photo_2" },
      { title: "3 місяці", style: "month-autumn", prefix: "photo_3" },
      { title: "4 місяці", style: "month-autumn", prefix: "photo_4" },
      { title: "5 місяців", style: "month-autumn", prefix: "photo_5" },
      { title: "6 місяців", style: "month-blue", prefix: "photo_6" },
      { title: "7 місяців", style: "month-blue", prefix: "photo_7" },
      { title: "8 місяців", style: "month-blue", prefix: "photo_8" },
      { title: "9 місяців", style: "month-green", prefix: "photo_9" },
      { title: "10 місяців", style: "month-green", prefix: "photo_10" },
      { title: "11 місяців", style: "month-green", prefix: "photo_11" }
    ];

    var selectedPhotos = JSON.parse(localStorage.getItem("sofiyka_location1_selected") || "[]");

    if (bgMusic) {
      bgMusic.volume = 0.35;
    }

    function goBack() {
      window.location.href = "map.html";
    }

    function photoId(monthIndex, photoIndex) {
      return "m" + monthIndex + "_p" + photoIndex;
    }

    function photoSrc(monthIndex, photoIndex) {
      return months[monthIndex].prefix + "_" + photoIndex + ".jpg";
    }

    function isSelected(id) {
      return selectedPhotos.indexOf(id) !== -1;
    }

    function saveSelected() {
      localStorage.setItem("sofiyka_location1_selected", JSON.stringify(selectedPhotos));
    }

    function renderMonths() {
      monthsGrid.innerHTML = "";

      for (var i = 0; i < months.length; i++) {
        var month = months[i];

        var card = document.createElement("article");
        card.className = "month-card " + month.style;

        var title = document.createElement("div");
        title.className = "month-title";
        title.textContent = month.title;

        var row = document.createElement("div");
        row.className = "photo-row";

        for (var p = 1; p <= 3; p++) {
          var id = photoId(i, p);

          var btn = document.createElement("button");
          btn.className = "photo-item";
          btn.type = "button";
          btn.setAttribute("data-photo-id", id);
          btn.setAttribute("data-src", photoSrc(i, p));

          if (isSelected(id)) {
            btn.classList.add("selected");
          }

          btn.onclick = function(event) {
            event.preventDefault();
            event.stopPropagation();
            openViewer(this.getAttribute("data-photo-id"), this.getAttribute("data-src"));
          };

          var img = document.createElement("img");
          img.src = photoSrc(i, p);
          img.alt = "";
          img.onerror = function() {
            this.style.display = "none";
          };

          var badge = document.createElement("span");
          badge.className = "like-badge";

          btn.appendChild(img);
          btn.appendChild(badge);
          row.appendChild(btn);
        }

        card.appendChild(title);
        card.appendChild(row);
        monthsGrid.appendChild(card);
      }
    }

    function updateCounter() {
      counterText.textContent = "Обрано " + selectedPhotos.length + " з " + REQUIRED_LIKES;

      if (selectedPhotos.length >= REQUIRED_LIKES) {
        completeBtn.classList.add("show");
        counterText.textContent = "Обрано 7 з 7 ✨";
      } else {
        completeBtn.classList.remove("show");
      }
    }

    function toggleLike(id) {
      var index = selectedPhotos.indexOf(id);

      if (index !== -1) {
        selectedPhotos.splice(index, 1);
      } else {
        if (selectedPhotos.length >= REQUIRED_LIKES) {
          alert("Вже обрано 7 фото. Щоб вибрати інше — спочатку зніми сердечко з одного фото ❤️");
          return;
        }

        selectedPhotos.push(id);
      }

      saveSelected();
      renderMonths();
      updateCounter();

      if (currentPhotoId === id) {
        updateViewerLikeButton();
      }
    }

    function openViewer(id, src) {
      currentPhotoId = id;
      viewerImg.src = src;
      viewerImg.onerror = function() {
        this.style.display = "none";
      };
      viewerImg.style.display = "block";
      updateViewerLikeButton();
      photoOverlay.classList.add("show");
    }

    function closeViewer() {
      photoOverlay.classList.remove("show");
      currentPhotoId = null;
      viewerImg.src = "";
    }

    function closeViewerByBg(event) {
      if (event.target === photoOverlay) {
        closeViewer();
      }
    }

    function updateViewerLikeButton() {
      if (!currentPhotoId) return;

      if (isSelected(currentPhotoId)) {
        viewerLikeBtn.textContent = "💛 Прибрати";
      } else {
        viewerLikeBtn.textContent = "❤️ Обрати";
      }
    }

    function toggleCurrentPhotoLike() {
      if (!currentPhotoId) return;
      toggleLike(currentPhotoId);
    }

    function completeLocation() {
      if (selectedPhotos.length < REQUIRED_LIKES) {
        alert("Обери 7 наймиліших фото Софійки ❤️");
        return;
      }

      localStorage.setItem("sofiyka_location1_done", "true");
      window.location.href = "map.html";
    }

    async function toggleMusic(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (!bgMusic || !musicToggle) return;

      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          musicToggle.style.transform = "scale(1.06)";
        } else {
          bgMusic.pause();
          musicToggle.style.transform = "scale(1)";
        }
      } catch (error) {
        alert("Музика не запустилась. Перевір mp3 файл.");
      }
    }

    renderMonths();
    updateCounter();
  </script>

</body>
</html>
