<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Локація 1 — Знайомство із Софійкою</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #f8d9ef;
    }

    body {
      min-height: 100vh;
      background-image: url("fon_loc1.png");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: scroll;
      color: #6f2f8b;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 18px 10px 38px;
    }

    .topbar {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .image-btn {
      width: 62px;
      height: 62px;
      border: none;
      background-color: transparent;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 6px 10px rgba(80, 25, 110, 0.24));
    }

    .back-btn {
      background-image: url("5.png");
    }

    .music-btn {
      background-image: url("6.png");
    }

    .location-title {
      width: 46%;
      max-width: 250px;
      aspect-ratio: 420 / 145;
      background: url("8.png") center / contain no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 2px;
      color: #69228b;
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 700;
      line-height: 1;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.95),
        0 3px 7px rgba(110,40,130,0.18);
    }

    .section {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 18px;
    }

    .intro-card {
      min-height: 390px;
      border-radius: 30px;
      padding: 26px 18px 24px;
      background:
        linear-gradient(180deg, rgba(255,246,252,0.82), rgba(255,231,246,0.62));
      border: 2px solid rgba(255,219,126,0.78);
      box-shadow:
        0 0 18px rgba(255,224,135,0.45),
        0 14px 28px rgba(93,37,120,0.16),
        inset 0 0 20px rgba(255,255,255,0.6);
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    .intro-photo-wrap {
      width: 190px;
      height: 190px;
      margin: 0 auto 14px;
      border-radius: 50%;
      padding: 8px;
      background:
        radial-gradient(circle at 30% 20%, #fffdf4 0%, #ffe49a 35%, #d69a34 100%);
      box-shadow:
        0 0 0 4px rgba(255,255,255,0.72),
        0 0 24px rgba(255,224,120,0.82),
        0 10px 20px rgba(85,35,105,0.2);
    }

    .intro-photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .intro-kicker {
      text-align: center;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      margin-bottom: 8px;
      color: #7c359b;
    }

    .intro-title {
      text-align: center;
      font-size: clamp(38px, 10vw, 58px);
      font-weight: 700;
      line-height: 0.92;
      color: #783193;
      margin-bottom: 14px;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.88),
        0 5px 10px rgba(120,45,145,0.2);
    }

    .intro-text {
      text-align: center;
      max-width: 430px;
      margin: 0 auto;
      font-size: clamp(20px, 4.8vw, 27px);
      line-height: 1.18;
      font-weight: 700;
      color: #6f2f86;
      text-shadow: 0 1px 0 rgba(255,255,255,0.86);
    }

    .task-card {
      position: relative;
      min-height: 180px;
      background: url("12.png") center / 100% 100% no-repeat;
      padding: 28px 92px 22px 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      filter: drop-shadow(0 10px 18px rgba(90,35,120,0.18));
    }

    .task-title {
      font-size: clamp(25px, 6.4vw, 38px);
      line-height: 0.95;
      font-weight: 700;
      color: #743092;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.96),
        0 3px 7px rgba(120,45,145,0.18);
    }

    .counter-pill {
      align-self: center;
      min-width: 170px;
      margin-top: 15px;
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(255,245,253,0.62);
      box-shadow:
        inset 0 2px 7px rgba(255,255,255,0.9),
        0 0 0 1px rgba(255,207,232,0.85);
      color: #7a3b94;
      font-size: clamp(24px, 5.8vw, 34px);
      font-weight: 700;
      line-height: 1;
    }

    .gallery-ribbon {
      width: 86%;
      max-width: 430px;
      aspect-ratio: 850 / 145;
      margin: 12px auto 14px;
      background: url("9.png") center / contain no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff6ff;
      font-size: clamp(26px, 6vw, 39px);
      font-weight: 700;
      text-shadow:
        0 2px 4px rgba(80,25,110,0.42),
        0 0 8px rgba(255,255,255,0.65);
      filter: drop-shadow(0 8px 13px rgba(90,35,120,0.22));
    }

    .months-grid {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      padding-bottom: 20px;
    }

    .month-card {
      position: relative;
      width: 100%;
      aspect-ratio: 560 / 255;
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      padding: 17px 17px 17px;
      filter: drop-shadow(0 9px 13px rgba(87,35,105,0.18));
      animation: cardBreath 5.2s ease-in-out infinite;
      transition: transform .25s ease, filter .25s ease;
    }

    .month-card:active {
      transform: scale(1.035);
      filter: drop-shadow(0 13px 18px rgba(87,35,105,0.24));
    }

    .month-card:nth-child(2n) {
      animation-delay: .45s;
    }

    .month-card:nth-child(3n) {
      animation-delay: .9s;
    }

    .month-pink { background-image: url("1.png"); }
    .month-blue { background-image: url("2.png"); }
    .month-green { background-image: url("3.png"); }
    .month-autumn { background-image: url("4.png"); }

    .month-title {
      height: 32%;
      padding-left: 58px;
      display: flex;
      align-items: center;
      color: #612985;
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,0.94);
    }

    .photo-row {
      height: 62%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 7px 6px;
    }

    .photo-item {
      position: relative;
      border: none;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.45);
      box-shadow:
        0 0 0 2px rgba(255,225,170,0.72),
        inset 0 2px 5px rgba(255,255,255,0.75);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .photo-item.selected {
      box-shadow:
        0 0 0 3px rgba(255,212,90,0.95),
        0 0 14px rgba(255,205,85,0.9);
    }

    .like-badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 31px;
      height: 31px;
      background: url("10.png") center / contain no-repeat;
      opacity: 0;
      transform: scale(0.55);
      transition: opacity .2s ease, transform .2s ease;
      filter: drop-shadow(0 3px 5px rgba(100,35,100,0.25));
      pointer-events: none;
    }

    .photo-item.selected .like-badge {
      opacity: 1;
      transform: scale(1);
    }

    .complete-btn {
      display: none;
      width: calc(100% - 28px);
      max-width: 430px;
      margin: 8px auto 0;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      background:
        linear-gradient(180deg, #fff7fb, #f6d5ff);
      color: #6f2f8b;
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      box-shadow:
        0 0 0 2px rgba(255,220,120,0.95),
        0 0 18px rgba(255,220,120,0.58),
        0 9px 17px rgba(90,35,120,0.22);
      cursor: pointer;
    }

    .complete-btn.show {
      display: block;
      animation: buttonAppear .4s ease both;
    }

    .photo-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(42, 13, 58, 0.78);
      backdrop-filter: blur(5px);
    }

    .photo-overlay.show {
      display: flex;
    }

    .viewer-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      border-radius: 26px;
      padding: 12px;
      background:
        linear-gradient(180deg, rgba(255,250,252,0.98), rgba(246,220,255,0.96));
      box-shadow:
        0 0 0 3px rgba(255,222,130,0.95),
        0 0 28px rgba(255,226,135,0.65),
        0 20px 50px rgba(20,0,40,0.38);
    }

    .viewer-img {
      width: 100%;
      max-height: 68vh;
      border-radius: 20px;
      display: block;
      object-fit: contain;
      background: rgba(255,255,255,0.6);
    }

    .viewer-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .viewer-btn {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 12px 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      color: #743092;
      background: #fff4fb;
      box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.95),
        0 0 0 1px rgba(255,215,120,0.78);
    }

    .viewer-btn.like {
      background: linear-gradient(180deg, #fff5fb, #ffd7ef);
    }

    .close-viewer {
      position: absolute;
      top: -14px;
      right: -10px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #fff3fb;
      color: #743092;
      font-size: 27px;
      font-weight: 700;
      box-shadow:
        0 0 0 2px rgba(255,220,120,0.95),
        0 6px 12px rgba(40,0,50,0.22);
      cursor: pointer;
    }

    @keyframes cardBreath {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-2px) scale(1.008);
      }
    }

    @keyframes buttonAppear {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (min-width: 560px) {
      .months-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .month-title {
        font-size: 25px;
      }
    }

    @media (max-width: 420px) {
      .page {
        padding-left: 8px;
        padding-right: 8px;
      }

      .image-btn {
        width: 56px;
        height: 56px;
      }

      .intro-photo-wrap {
        width: 168px;
        height: 168px;
      }

      .task-card {
        min-height: 160px;
        padding-left: 105px;
        padding-right: 82px;
      }

      .photo-row {
        gap: 6px;
      }

      .month-title {
        padding-left: 52px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio
    id="bgMusic"
    src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3"
    loop
    preload="auto">
  </audio>

  <main class="page">

    <header class="topbar">
      <button class="image-btn back-btn" type="button" aria-label="Назад" onclick="goBack()"></button>
      <div class="location-title">Локація 1</div>
      <button id="musicToggle" class="image-btn music-btn" type="button" aria-label="Музика" onclick="toggleMusic(event)"></button>
    </header>

    <section class="section intro-card">
      <div class="intro-photo-wrap">
        <img class="intro-photo" src="sofiyka_header.jpg" alt="Софійка">
      </div>

      <div class="intro-kicker">Чарівна подорож починається</div>
      <h1 class="intro-title">Знайомство<br>із Софійкою</h1>

      <p class="intro-text">
        Це перша зупинка нашої казкової подорожі у світ чарівної принцеси,
        її перших посмішок, поглядів і маленьких перемог у житті.
      </p>
    </section>

    <section class="section task-card">
      <div class="task-title">Обери 7 наймиліших<br>фото Софійки</div>
      <div class="counter-pill" id="counterText">Обрано 0 з 7</div>
    </section>

    <div class="gallery-ribbon">Галерея по місяцях</div>

    <section class="months-grid" id="monthsGrid"></section>

    <button class="complete-btn" id="completeBtn" type="button" onclick="completeLocation()">
      Відкрити наступну локацію ✨
    </button>

  </main>

  <div class="photo-overlay" id="photoOverlay" onclick="closeViewerByBg(event)">
    <div class="viewer-card">
      <button class="close-viewer" type="button" onclick="closeViewer()">×</button>
      <img class="viewer-img" id="viewerImg" src="" alt="Фото Софійки">
      <div class="viewer-actions">
        <button class="viewer-btn like" type="button" id="viewerLikeBtn" onclick="toggleCurrentPhotoLike()">❤️ Обрати</button>
        <button class="viewer-btn" type="button" onclick="closeViewer()">Закрити</button>
      </div>
    </div>
  </div>

  <script>
    var REQUIRED_LIKES = 7;

    var bgMusic = document.getElementById("bgMusic");
    var musicToggle = document.getElementById("musicToggle");
    var monthsGrid = document.getElementById("monthsGrid");
    var counterText = document.getElementById("counterText");
    var completeBtn = document.getElementById("completeBtn");
    var photoOverlay = document.getElementById("photoOverlay");
    var viewerImg = document.getElementById("viewerImg");
    var viewerLikeBtn = document.getElementById("viewerLikeBtn");

    var currentPhotoId = null;

    var months = [
      { title: "Народження", style: "month-pink", prefix: "photo_0" },
      { title: "1 місяць", style: "month-pink", prefix: "photo_1" },
      { title: "2 місяці", style: "month-pink", prefix: "photo_2" },
      { title: "3 місяці", style: "month-autumn", prefix: "photo_3" },
      { title: "4 місяці", style: "month-autumn", prefix: "photo_4" },
      { title: "5 місяців", style: "month-autumn", prefix: "photo_5" },
      { title: "6 місяців", style: "month-blue", prefix: "photo_6" },
      { title: "7 місяців", style: "month-blue", prefix: "photo_7" },
      { title: "8 місяців", style: "month-blue", prefix: "photo_8" },
      { title: "9 місяців", style: "month-green", prefix: "photo_9" },
      { title: "10 місяців", style: "month-green", prefix: "photo_10" },
      { title: "11 місяців", style: "month-green", prefix: "photo_11" }
    ];

    var selectedPhotos = JSON.parse(localStorage.getItem("sofiyka_location1_selected") || "[]");

    if (bgMusic) {
      bgMusic.volume = 0.35;
    }

    function goBack() {
      window.location.href = "map.html";
    }

    function photoId(monthIndex, photoIndex) {
      return "m" + monthIndex + "_p" + photoIndex;
    }

    function photoSrc(monthIndex, photoIndex) {
      return months[monthIndex].prefix + "_" + photoIndex + ".jpg";
    }

    function isSelected(id) {
      return selectedPhotos.indexOf(id) !== -1;
    }

    function saveSelected() {
      localStorage.setItem("sofiyka_location1_selected", JSON.stringify(selectedPhotos));
    }

    function renderMonths() {
      monthsGrid.innerHTML = "";

      for (var i = 0; i < months.length; i++) {
        var month = months[i];

        var card = document.createElement("article");
        card.className = "month-card " + month.style;

        var title = document.createElement("div");
        title.className = "month-title";
        title.textContent = month.title;

        var row = document.createElement("div");
        row.className = "photo-row";

        for (var p = 1; p <= 3; p++) {
          var id = photoId(i, p);
          var btn = document.createElement("button");
          btn.className = "photo-item";
          btn.type = "button";
          btn.setAttribute("data-photo-id", id);
          btn.setAttribute("data-src", photoSrc(i, p));

          if (isSelected(id)) {
            btn.classList.add("selected");
          }

          btn.onclick = function(event) {
            event.preventDefault();
            event.stopPropagation();

            openViewer(this.getAttribute("data-photo-id"), this.getAttribute("data-src"));
          };

          var img = document.createElement("img");
          img.src = photoSrc(i, p);
          img.alt = "Фото Софійки";

          var badge = document.createElement("span");
          badge.className = "like-badge";

          btn.appendChild(img);
          btn.appendChild(badge);
          row.appendChild(btn);
        }

        card.appendChild(title);
        card.appendChild(row);
        monthsGrid.appendChild(card);
      }
    }

    function updateCounter() {
      counterText.textContent = "Обрано " + selectedPhotos.length + " з " + REQUIRED_LIKES;

      if (selectedPhotos.length >= REQUIRED_LIKES) {
        completeBtn.classList.add("show");
        counterText.textContent = "Обрано 7 з 7 ✨";
      } else {
        completeBtn.classList.remove("show");
      }
    }

    function toggleLike(id) {
      var index = selectedPhotos.indexOf(id);

      if (index !== -1) {
        selectedPhotos.splice(index, 1);
      } else {
        if (selectedPhotos.length >= REQUIRED_LIKES) {
          alert("Вже обрано 7 фото. Щоб вибрати інше — спочатку зніми сердечко з одного фото ❤️");
          return;
        }

        selectedPhotos.push(id);
      }

      saveSelected();
      renderMonths();
      updateCounter();

      if (currentPhotoId === id) {
        updateViewerLikeButton();
      }
    }

    function openViewer(id, src) {
      currentPhotoId = id;
      viewerImg.src = src;
      updateViewerLikeButton();
      photoOverlay.classList.add("show");
    }

    function closeViewer() {
      photoOverlay.classList.remove("show");
      currentPhotoId = null;
      viewerImg.src = "";
    }

    function closeViewerByBg(event) {
      if (event.target === photoOverlay) {
        closeViewer();
      }
    }

    function updateViewerLikeButton() {
      if (!currentPhotoId) return;

      if (isSelected(currentPhotoId)) {
        viewerLikeBtn.textContent = "💛 Прибрати";
      } else {
        viewerLikeBtn.textContent = "❤️ Обрати";
      }
    }

    function toggleCurrentPhotoLike() {
      if (!currentPhotoId) return;
      toggleLike(currentPhotoId);
    }

    function completeLocation() {
      if (selectedPhotos.length < REQUIRED_LIKES) {
        alert("Обери 7 наймиліших фото Софійки ❤️");
        return;
      }

      localStorage.setItem("sofiyka_location1_done", "true");
      window.location.href = "map.html";
    }

    async function toggleMusic(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (!bgMusic || !musicToggle) return;

      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          musicToggle.style.transform = "scale(1.06)";
        } else {
          bgMusic.pause();
          musicToggle.style.transform = "scale(1)";
        }
      } catch (error) {
        alert("Музика не запустилась. Перевір, чи mp3 файл лежить поруч із location1.html.");
      }
    }

    renderMonths();
    updateCounter();
  </script>

</body>
</html>
