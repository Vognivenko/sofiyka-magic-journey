<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Локація 1 — Знайомство з Софійкою</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --violet: #7e459e;
      --violet-soft: #9b6bb7;
      --gold: #efd77a;
      --gold-2: #f7e8aa;
      --cream: rgba(255, 251, 255, 0.92);
      --cream-2: rgba(255, 248, 253, 0.90);
      --shadow: 0 8px 20px rgba(173, 117, 195, 0.14);
      --shadow-soft: 0 5px 14px rgba(173, 117, 195, 0.10);
      --border: 2px solid rgba(238, 219, 127, 0.9);
      --radius-xl: 34px;
      --radius-lg: 28px;
      --radius-md: 22px;
      --container-width: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--violet);
      font-family: "Cormorant Garamond", serif;
      background:
        linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
        url("fon_location1.png") center top / cover no-repeat;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--container-width);
      margin: 0 auto;
      padding: 14px 18px 42px;
    }

    /* ===== ШАПКА ЧЕРЕЗ КАРТИНКУ heder_loc1.png ===== */

    .header-loc1 {
      position: relative;
      width: 100%;
      margin: 0 auto 14px;
      z-index: 10;
    }

    .header-loc1-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      filter: drop-shadow(0 8px 18px rgba(116, 61, 140, 0.16));
    }

    .header-click {
      position: absolute;
      top: 20%;
      width: 22%;
      height: 60%;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
    }

    .header-back {
      left: 1.5%;
    }

    .header-music {
      right: 1.5%;
    }

    .header-click:active {
      transform: scale(0.96);
    }

    .header-music.playing::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      box-shadow: 0 0 22px rgba(255, 245, 180, 0.75);
      animation: musicGlow 1.6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes musicGlow {
      0%, 100% {
        opacity: 0.45;
        transform: scale(1);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.06);
      }
    }

    /* ===== ЗАГАЛЬНІ КАРТКИ ===== */

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,248,253,0.86));
      border: var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* ===== ПЕРШИЙ БЛОК ===== */

    .hero-card {
      position: relative;
      margin-bottom: 18px;
      min-height: 230px;
      padding: 20px 26px;
      background:
        linear-gradient(rgba(255,255,255,0.50), rgba(255,248,253,0.54)),
        url("fon_block1.png") center center / cover no-repeat;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      text-align: center;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      padding: 12px 18px;
      background: rgba(255,255,255,0.22);
    }

    .hero-title {
      margin: 0 0 10px;
      font-size: clamp(44px, 5.8vw, 70px);
      line-height: 0.94;
      font-weight: 700;
      color: var(--violet);
      text-shadow:
        0 2px 0 rgba(255,255,255,0.86),
        0 6px 18px rgba(126, 69, 158, 0.10);
    }

    .hero-desc {
      margin: 0;
      max-width: 760px;
      font-size: clamp(22px, 2.7vw, 34px);
      line-height: 1.22;
      font-weight: 600;
      color: #6f438f;
      text-shadow: 0 4px 12px rgba(255,255,255,0.45);
    }

    /* ===== ЗАВДАННЯ ===== */

    .task-card {
      margin-bottom: 18px;
      padding: 20px 20px 22px;
      text-align: center;
    }

    .task-title {
      margin: 0 0 14px;
      font-size: clamp(30px, 3.6vw, 46px);
      line-height: 1.08;
      font-weight: 700;
    }

    .counter-panel {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 14px 18px 16px;
      border-radius: 28px;
      border: 2px solid rgba(238, 219, 127, 0.85);
      background: rgba(255,255,255,0.72);
      box-shadow:
        0 6px 16px rgba(173, 117, 195, 0.10),
        inset 0 2px 8px rgba(255,255,255,0.72);
    }

    .counter-main {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 7px;
      color: var(--violet);
      font-weight: 700;
      line-height: 1;
    }

    .counter-number {
      font-size: clamp(38px, 5vw, 58px);
    }

    .counter-divider {
      font-size: clamp(30px, 4vw, 44px);
      color: var(--violet-soft);
    }

    .counter-max {
      font-size: clamp(30px, 4vw, 44px);
      color: var(--violet-soft);
    }

    .counter-label {
      margin-left: 6px;
      font-size: clamp(20px, 2.3vw, 28px);
      color: #76518f;
    }

    .counter-bar {
      position: relative;
      height: 13px;
      margin-top: 12px;
      border-radius: 999px;
      background: rgba(217, 198, 225, 0.62);
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(126, 69, 158, 0.12);
    }

    .counter-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #c78be5, #efd77a);
      transition: width 0.22s ease;
    }

    /* ===== СЕКЦІЇ МІСЯЦІВ ===== */

    .sections {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .month-card {
      display: grid;
      grid-template-columns: minmax(245px, 300px) 1fr;
      gap: 14px;
      padding: 12px;
      border-radius: 30px;
      border: var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.90), rgba(255,249,252,0.84));
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .month-info {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
      padding: 9px 10px 9px 8px;
      border-radius: 24px;
      background: rgba(255,255,255,0.58);
      box-shadow: inset 0 0 0 1px rgba(247, 230, 170, 0.50);
    }

    .month-icon {
      width: 66px;
      height: 66px;
      flex: 0 0 66px;
      border-radius: 50%;
      border: 2px solid rgba(239, 215, 122, 0.9);
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,249,236,0.95) 35%, rgba(255,235,179,0.95) 82%);
      box-shadow:
        0 6px 16px rgba(229, 187, 89, 0.16),
        inset 0 2px 10px rgba(255,255,255,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      line-height: 1;
    }

    .month-text {
      min-width: 0;
    }

    .month-title {
      margin: 0 0 4px;
      font-size: clamp(26px, 2.6vw, 38px);
      line-height: 1;
      font-weight: 700;
    }

    .month-subtitle {
      margin: 0;
      font-size: clamp(18px, 1.8vw, 25px);
      line-height: 1.15;
      font-weight: 600;
      color: #7f5a98;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
    }

    .photo-card {
      position: relative;
      min-height: 138px;
      border-radius: 22px;
      border: none;
      background: rgba(255,255,255,0.64);
      box-shadow:
        0 5px 12px rgba(173, 117, 195, 0.08),
        inset 0 2px 8px rgba(255,255,255,0.58);
      padding: 18px 14px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .photo-label {
      font-size: clamp(22px, 1.9vw, 28px);
      line-height: 1.1;
      font-weight: 700;
      color: var(--violet);
    }

    .photo-label span {
      display: block;
      margin-top: 6px;
      font-size: clamp(15px, 1.4vw, 19px);
      line-height: 1.2;
      font-weight: 600;
      color: #8c73a1;
    }

    .like-btn {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.96), rgba(255,240,246,0.95) 38%, rgba(246, 194, 221, 0.96) 88%);
      box-shadow: 0 5px 12px rgba(240, 161, 201, 0.18);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 21px;
      color: #5b435f;
      transition: transform 0.12s ease, background 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .like-btn:active {
      transform: scale(0.94);
    }

    .like-btn.active {
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,220,236,0.98) 38%, rgba(255, 141, 186, 0.96) 88%);
      color: #d43d73;
      transform: scale(1.04);
    }

    /* ===== ФІНАЛ ===== */

    .unlock-card {
      margin-top: 20px;
      padding: 22px 20px 24px;
      text-align: center;
      position: relative;
    }

    .unlock-title {
      margin: 0 0 16px;
      font-size: clamp(34px, 3.7vw, 52px);
      line-height: 1.04;
      font-weight: 700;
    }

    .next-btn {
      min-height: 62px;
      padding: 13px 32px;
      border-radius: 999px;
      border: 2px solid rgba(230, 216, 185, 0.88);
      background: linear-gradient(180deg, rgba(230,226,224,0.95), rgba(197,190,188,0.95));
      color: rgba(119, 96, 115, 0.88);
      font-size: clamp(24px, 2.4vw, 32px);
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      cursor: not-allowed;
      box-shadow: inset 0 3px 10px rgba(255,255,255,0.55);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    .next-btn.enabled {
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #c78be5, #a96bd1);
      border-color: rgba(233, 207, 255, 0.95);
      box-shadow:
        0 8px 20px rgba(164, 97, 204, 0.22),
        inset 0 2px 10px rgba(255,255,255,0.30);
    }

    .next-btn.enabled:active {
      transform: scale(0.98);
    }

    .hint {
      margin-top: 12px;
      min-height: 28px;
      font-size: 21px;
      font-weight: 600;
      color: #8b6e9c;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(117, 76, 150, 0.95);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(117, 76, 150, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 50;
      text-align: center;
      max-width: calc(100% - 32px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    audio {
      display: none;
    }

    /* ===== АДАПТИВ ===== */

    @media (max-width: 980px) {
      .page {
        padding: 10px 12px 34px;
      }

      .header-loc1 {
        width: calc(100% + 8px);
        margin-left: -4px;
        margin-right: -4px;
        margin-bottom: 10px;
      }

      .hero-card {
        padding: 16px 14px;
        min-height: 210px;
        margin-bottom: 16px;
      }

      .hero-inner {
        min-height: 176px;
        padding: 12px 10px;
      }

      .hero-title {
        font-size: 48px;
      }

      .hero-desc {
        font-size: 23px;
      }

      .month-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .page {
        padding: 8px 10px 34px;
      }

      .header-loc1 {
        width: calc(100% + 24px);
        margin-left: -12px;
        margin-right: -12px;
        margin-bottom: 8px;
      }

      .header-click {
        top: 18%;
        height: 62%;
        width: 24%;
      }

      .header-back {
        left: 0;
      }

      .header-music {
        right: 0;
      }

      .hero-card {
        border-radius: 30px;
        padding: 14px 12px;
        min-height: 198px;
      }

      .hero-inner {
        min-height: 170px;
        border-radius: 24px;
      }

      .hero-title {
        font-size: 45px;
      }

      .hero-desc {
        font-size: 22px;
      }

      .task-card {
        padding: 18px 16px 20px;
      }

      .task-title {
        font-size: 30px;
      }

      .counter-panel {
        padding: 12px 14px 14px;
      }

      .month-card {
        padding: 10px;
        border-radius: 26px;
        gap: 10px;
      }

      .month-info {
        gap: 10px;
      }

      .month-icon {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
        font-size: 28px;
      }

      .month-title {
        font-size: 28px;
      }

      .month-subtitle {
        font-size: 19px;
      }

      .photo-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .photo-card {
        min-height: 112px;
        border-radius: 18px;
        padding: 22px 6px 8px;
      }

      .photo-label {
        font-size: 19px;
      }

      .photo-label span {
        font-size: 12px;
      }

      .like-btn {
        width: 30px;
        height: 30px;
        top: 6px;
        right: 6px;
        font-size: 17px;
      }

      .unlock-title {
        font-size: 30px;
      }

      .next-btn {
        width: 100%;
        font-size: 24px;
      }

      .hint {
        font-size: 18px;
      }
    }

    @media (max-width: 420px) {
      .hero-title {
        font-size: 41px;
      }

      .hero-desc {
        font-size: 20px;
      }

      .task-title {
        font-size: 28px;
      }

      .month-title {
        font-size: 26px;
      }

      .month-subtitle {
        font-size: 18px;
      }

      .photo-card {
        min-height: 104px;
      }

      .photo-label {
        font-size: 18px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio id="bgMusic" loop preload="auto">
    <source src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="page">

    <header class="header-loc1">
      <img class="header-loc1-img" src="heder_loc1.png" alt="Локація 1">

      <button class="header-click header-back" id="backBtn" type="button" aria-label="Назад"></button>

      <button class="header-click header-music" id="musicBtn" type="button" aria-label="Музика"></button>
    </header>

    <section class="card hero-card">
      <div class="hero-inner">
        <h1 class="hero-title">Знайомство<br>з Софійкою</h1>
        <p class="hero-desc">
          Це перша зупинка нашої казкової подорожі у світ чарівної принцеси
          та її перших посмішок, поглядів і маленьких перемог у її житті.
        </p>
      </div>
    </section>

    <section class="card task-card" id="taskCard">
      <h2 class="task-title">Обери 5 наймиліших фото Софійки</h2>

      <div class="counter-panel" aria-live="polite">
        <div class="counter-main">
          <span class="counter-number" id="selectedCount">0</span>
          <span class="counter-divider">/</span>
          <span class="counter-max">5</span>
          <span class="counter-label">фото обрано</span>
        </div>

        <div class="counter-bar">
          <span class="counter-bar-fill" id="counterBarFill"></span>
        </div>
      </div>
    </section>

    <main class="sections" id="sectionsContainer"></main>

    <section class="card unlock-card">
      <h2 class="unlock-title">Коли обереш 5 фото —<br>відкриється наступний рівень</h2>
      <button class="next-btn" id="nextBtn" type="button" disabled>
        Відкрити наступний рівень
      </button>
      <div class="hint" id="hintText">Оберіть 5 фото, щоб продовжити подорож ✨</div>
    </section>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const sectionsData = [
      {
        icon: "👑",
        title: "Народження",
        subtitle: "День, коли наша принцеса вперше відкрила оченята"
      },
      {
        icon: "☀️",
        title: "1 місяць",
        subtitle: "Перший місяць повний любові та ніжності"
      },
      {
        icon: "🧸",
        title: "2 місяці",
        subtitle: "Маленькі відкриття та перші емоції"
      },
      {
        icon: "🍁",
        title: "3 місяці",
        subtitle: "Перші усмішки та гучний сміх"
      },
      {
        icon: "🍂",
        title: "4 місяці",
        subtitle: "Досліджуємо світ руками та очима"
      },
      {
        icon: "🌰",
        title: "5 місяців",
        subtitle: "Активні рухи та цікаві відкриття"
      },
      {
        icon: "❄️",
        title: "6 місяців",
        subtitle: "Нові вміння кожного дня"
      },
      {
        icon: "🧊",
        title: "7 місяців",
        subtitle: "Сміємося, граємось і пізнаємо світ"
      },
      {
        icon: "🧤",
        title: "8 місяців",
        subtitle: "Маленькі перемоги щодня"
      },
      {
        icon: "🐣",
        title: "9 місяців",
        subtitle: "Готуємось до нових веселих кроків"
      },
      {
        icon: "🌸",
        title: "10 місяців",
        subtitle: "Більше самостійності та радості"
      },
      {
        icon: "💗",
        title: "11 місяців",
        subtitle: "Любимо, ростемо та мріємо"
      }
    ];

    const sectionsContainer = document.getElementById("sectionsContainer");
    const selectedCount = document.getElementById("selectedCount");
    const counterBarFill = document.getElementById("counterBarFill");
    const nextBtn = document.getElementById("nextBtn");
    const hintText = document.getElementById("hintText");
    const toast = document.getElementById("toast");
    const musicBtn = document.getElementById("musicBtn");
    const backBtn = document.getElementById("backBtn");
    const bgMusic = document.getElementById("bgMusic");

    const MAX_LIKES = 5;
    let selectedPhotos = new Set();
    let userTouchedPage = false;

    if (bgMusic) {
      bgMusic.volume = 0.35;
    }

    function renderSections() {
      sectionsContainer.innerHTML = sectionsData.map((section, sectionIndex) => {
        const photoCards = [1, 2, 3].map(photoIndex => {
          const id = `section-${sectionIndex + 1}-photo-${photoIndex}`;

          return `
            <div class="photo-card">
              <button class="like-btn" type="button" aria-label="Вподобати фото" data-id="${id}">
                ♡
              </button>
              <div class="photo-label">
                Фото ${photoIndex}
                <span>сюди вставимо фото</span>
              </div>
            </div>
          `;
        }).join("");

        return `
          <section class="month-card">
            <div class="month-info">
              <div class="month-icon">${section.icon}</div>
              <div class="month-text">
                <h3 class="month-title">${section.title}</h3>
                <p class="month-subtitle">${section.subtitle}</p>
              </div>
            </div>
            <div class="photo-grid">
              ${photoCards}
            </div>
          </section>
        `;
      }).join("");

      bindLikeButtons();
      restoreLikes();
      updateUI();
      startAutoScrollToGallery();
    }

    function bindLikeButtons() {
      document.querySelectorAll(".like-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;

          if (selectedPhotos.has(id)) {
            selectedPhotos.delete(id);
          } else {
            if (selectedPhotos.size >= MAX_LIKES) {
              showToast("Можна вибрати лише 5 фото 💕");
              return;
            }

            selectedPhotos.add(id);
          }

          saveLikes();
          updateUI();
        });
      });
    }

    function updateUI() {
      const total = selectedPhotos.size;
      const percent = Math.round((total / MAX_LIKES) * 100);

      selectedCount.textContent = total;
      counterBarFill.style.width = percent + "%";

      document.querySelectorAll(".like-btn").forEach(btn => {
        const id = btn.dataset.id;
        const active = selectedPhotos.has(id);

        btn.classList.toggle("active", active);
        btn.textContent = active ? "❤" : "♡";
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });

      if (total === MAX_LIKES) {
        nextBtn.disabled = false;
        nextBtn.classList.add("enabled");
        hintText.textContent = "Чудово! Тепер можна відкрити наступний рівень ✨";
      } else {
        nextBtn.disabled = true;
        nextBtn.classList.remove("enabled");
        hintText.textContent = "Оберіть 5 фото, щоб продовжити подорож ✨";
      }
    }

    function saveLikes() {
      localStorage.setItem("sofiyka_location1_likes", JSON.stringify([...selectedPhotos]));
    }

    function restoreLikes() {
      const saved = localStorage.getItem("sofiyka_location1_likes");

      if (!saved) return;

      try {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
          selectedPhotos = new Set(parsed.slice(0, MAX_LIKES));
        }
      } catch (error) {
        selectedPhotos = new Set();
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast._timer);

      showToast._timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    function startAutoScrollToGallery() {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reduceMotion) return;

      setTimeout(() => {
        if (userTouchedPage) return;

        sectionsContainer.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 1100);
    }

    window.addEventListener("wheel", () => {
      userTouchedPage = true;
    }, { passive: true });

    window.addEventListener("touchmove", () => {
      userTouchedPage = true;
    }, { passive: true });

    window.addEventListener("keydown", () => {
      userTouchedPage = true;
    });

    nextBtn.addEventListener("click", () => {
      if (selectedPhotos.size !== MAX_LIKES) return;

      localStorage.setItem("sofiyka_location1_done", "true");
      showToast("Перша локація пройдена! 🌟");

      setTimeout(() => {
        window.location.href = "map.html";
      }, 900);
    });

    backBtn.addEventListener("click", () => {
      window.location.href = "map.html";
    });

    musicBtn.addEventListener("click", async () => {
      if (!bgMusic) return;

      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          musicBtn.classList.add("playing");
          localStorage.setItem("sofiyka_music", "on");
        } else {
          bgMusic.pause();
          musicBtn.classList.remove("playing");
          localStorage.setItem("sofiyka_music", "off");
        }
      } catch (error) {
        showToast("Музика не запустилась. Перевір mp3 файл 🎵");
      }
    });

    function restoreMusicState() {
      const musicState = localStorage.getItem("sofiyka_music");

      if (musicState === "on" && bgMusic) {
        bgMusic.play().then(() => {
          musicBtn.classList.add("playing");
        }).catch(() => {
          musicBtn.classList.remove("playing");
        });
      }
    }

    renderSections();
    restoreMusicState();
  </script>

</body>
</html>
