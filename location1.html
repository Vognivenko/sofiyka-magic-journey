<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Локація 1 — Знайомство з Софійкою</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --violet: #7e459e;
      --violet-soft: #9b6bb7;
      --gold: #efd77a;
      --gold-dark: #d8b94f;
      --pink: #c94fa4;
      --text-dark: #6f4d74;
      --shadow: 0 10px 26px rgba(177, 111, 187, 0.12);
      --border: 2px solid rgba(238, 219, 127, 0.85);
      --container-width: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--violet);
      font-family: "Cormorant Garamond", serif;
      background:
        linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
        url("fon_location1.png") center top / cover no-repeat;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: var(--container-width);
      margin: 0 auto;
      padding: 14px 18px 42px;
    }

    /* ===== ШАПКА location1 — НЕ МІНЯЄМО, КАРТИНКА heder_loc1.png ===== */

    .header-loc1 {
      position: relative;
      width: 100%;
      margin: 0 auto 14px;
      z-index: 10;
    }

    .header-loc1-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      filter: drop-shadow(0 8px 18px rgba(116, 61, 140, 0.16));
    }

    .header-click {
      position: absolute;
      top: 20%;
      width: 22%;
      height: 60%;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
    }

    .header-back {
      left: 1.5%;
    }

    .header-music {
      right: 1.5%;
    }

    .header-click:active {
      transform: scale(0.96);
    }

    .header-music.playing::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      box-shadow: 0 0 22px rgba(255, 245, 180, 0.75);
      animation: musicGlow 1.6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes musicGlow {
      0%, 100% {
        opacity: 0.45;
        transform: scale(1);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.06);
      }
    }

    /* ===== ПЕРШИЙ БЛОК БЕЗ НАКЛАДЕННЯ ФОНІВ ===== */

    .intro-shell {
      width: min(92%, 900px);
      margin: 22px auto 28px;
      padding: 14px;
      border-radius: 34px;
      border: 3px solid rgba(226, 193, 93, 0.75);
      background: rgba(255, 245, 250, 0.42);
      box-shadow:
        0 10px 30px rgba(177, 111, 187, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.55);
      overflow: hidden;
      position: relative;
    }

    .intro-hero {
      width: 100%;
      height: 235px;
      border-radius: 26px 26px 0 0;
      background-image: url("fon_block1.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 2px solid rgba(231, 200, 103, 0.55);
      border-bottom: none;
    }

    .intro-card {
      width: calc(100% - 40px);
      margin: -30px auto 18px;
      padding: 36px 28px 34px;
      border-radius: 28px;
      background: rgba(255, 252, 250, 0.93);
      border: 2px solid rgba(233, 210, 134, 0.7);
      box-shadow:
        0 10px 22px rgba(187, 132, 173, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.7);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .intro-card h1 {
      margin: 0 0 18px;
      font-size: clamp(38px, 5.4vw, 68px);
      line-height: 1.04;
      color: #a24e93;
      font-weight: 700;
    }

    .intro-card p {
      margin: 0 auto 26px;
      max-width: 680px;
      font-size: clamp(20px, 2.45vw, 32px);
      line-height: 1.35;
      color: var(--text-dark);
      font-weight: 600;
    }

    .intro-scroll-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 17px 44px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #df78b7 0%, #b24ea4 100%);
      color: #ffffff;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(22px, 2.5vw, 34px);
      font-weight: 700;
      box-shadow: 0 10px 22px rgba(190, 90, 160, 0.28);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .intro-scroll-btn:active {
      transform: scale(0.97);
    }

    /* ===== ЧИСТИЙ БЛОК ПРОГРЕСУ ===== */

    .progress-card {
      width: min(92%, 900px);
      margin: 0 auto 28px;
      padding: 26px 22px 28px;
      border-radius: 32px;
      border: 3px solid rgba(226, 193, 93, 0.75);
      background: rgba(255, 252, 250, 0.88);
      box-shadow:
        0 10px 26px rgba(177, 111, 187, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.65);
      text-align: center;
    }

    .progress-title {
      margin: 0 0 20px;
      font-size: clamp(30px, 4.5vw, 54px);
      line-height: 1.08;
      font-weight: 700;
      color: #8b3f92;
    }

    .progress-box {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 18px 18px 20px;
      border-radius: 26px;
      border: 2px solid rgba(226, 193, 93, 0.65);
      background: rgba(255, 255, 255, 0.82);
      box-shadow:
        0 8px 18px rgba(177, 111, 187, 0.10),
        inset 0 0 0 1px rgba(255,255,255,0.75);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .progress-icon {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1;
    }

    .progress-count {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1;
      font-weight: 700;
      color: var(--violet);
      text-shadow: 0 2px 0 rgba(255,255,255,0.8);
    }

    .progress-line {
      position: relative;
      width: 100%;
      height: 16px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(220, 202, 226, 0.75);
      box-shadow:
        inset 0 2px 6px rgba(126, 69, 158, 0.16),
        0 2px 6px rgba(255,255,255,0.65);
    }

    .progress-line-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #c978d8, #f0d875);
      transition: width 0.25s ease;
    }

    /* ===== ГАЛЕРЕЯ ===== */

    .gallery-section {
      width: min(92%, 900px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .month-card {
      display: grid;
      grid-template-columns: minmax(230px, 300px) 1fr;
      gap: 16px;
      padding: 14px;
      border-radius: 30px;
      border: var(--border);
      background: rgba(255, 252, 250, 0.86);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .month-info {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
      padding: 12px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.64);
      border: 1px solid rgba(226, 193, 93, 0.45);
    }

    .month-icon {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      border-radius: 50%;
      border: 2px solid rgba(239, 215, 122, 0.9);
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,249,236,0.95) 35%, rgba(255,235,179,0.95) 82%);
      box-shadow:
        0 6px 14px rgba(229, 187, 89, 0.14),
        inset 0 2px 10px rgba(255,255,255,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      line-height: 1;
    }

    .month-title {
      margin: 0 0 6px;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1;
      font-weight: 700;
      color: var(--violet);
    }

    .month-subtitle {
      margin: 0;
      font-size: clamp(18px, 1.9vw, 25px);
      line-height: 1.16;
      font-weight: 600;
      color: #7f5a98;
    }

    .photo-card {
      position: relative;
      min-height: 230px;
      border-radius: 24px;
      border: none;
      background: rgba(255,255,255,0.60);
      box-shadow:
        0 5px 12px rgba(173, 117, 195, 0.08),
        inset 0 2px 8px rgba(255,255,255,0.58);
      overflow: hidden;
    }

    .month-photo {
      width: 100%;
      height: 100%;
      min-height: 230px;
      object-fit: cover;
      display: block;
      border-radius: 24px;
    }

    .photo-placeholder {
      width: 100%;
      min-height: 230px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      color: var(--violet);
      font-size: clamp(24px, 2.4vw, 34px);
      font-weight: 700;
      background: rgba(255,255,255,0.68);
    }

    .photo-placeholder span {
      display: block;
      margin-top: 8px;
      font-size: clamp(16px, 1.6vw, 22px);
      color: #8c73a1;
      font-weight: 600;
    }

    .like-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,240,246,0.96) 38%, rgba(246, 194, 221, 0.96) 88%);
      box-shadow: 0 6px 14px rgba(240, 161, 201, 0.22);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      color: #5b435f;
      transition: transform 0.12s ease, background 0.12s ease;
      z-index: 3;
      -webkit-tap-highlight-color: transparent;
    }

    .like-btn:active {
      transform: scale(0.94);
    }

    .like-btn.active {
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,220,236,0.98) 38%, rgba(255, 141, 186, 0.96) 88%);
      color: #d43d73;
      transform: scale(1.04);
    }

    /* ===== ФІНАЛ ===== */

    .unlock-card {
      width: min(92%, 900px);
      margin: 24px auto 0;
      padding: 24px 20px 26px;
      text-align: center;
      border-radius: 32px;
      border: 3px solid rgba(226, 193, 93, 0.75);
      background: rgba(255, 252, 250, 0.88);
      box-shadow: var(--shadow);
    }

    .unlock-title {
      margin: 0 0 16px;
      font-size: clamp(32px, 3.7vw, 52px);
      line-height: 1.04;
      font-weight: 700;
      color: var(--violet);
    }

    .next-btn {
      min-height: 62px;
      padding: 13px 32px;
      border-radius: 999px;
      border: 2px solid rgba(230, 216, 185, 0.88);
      background: linear-gradient(180deg, rgba(230,226,224,0.95), rgba(197,190,188,0.95));
      color: rgba(119, 96, 115, 0.88);
      font-size: clamp(24px, 2.4vw, 32px);
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      cursor: not-allowed;
      box-shadow: inset 0 3px 10px rgba(255,255,255,0.55);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    .next-btn.enabled {
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #c78be5, #a96bd1);
      border-color: rgba(233, 207, 255, 0.95);
      box-shadow:
        0 8px 20px rgba(164, 97, 204, 0.22),
        inset 0 2px 10px rgba(255,255,255,0.30);
    }

    .next-btn.enabled:active {
      transform: scale(0.98);
    }

    .hint {
      margin-top: 12px;
      min-height: 28px;
      font-size: 21px;
      font-weight: 600;
      color: #8b6e9c;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(117, 76, 150, 0.95);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(117, 76, 150, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 50;
      text-align: center;
      max-width: calc(100% - 32px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    audio {
      display: none;
    }

    /* ===== АДАПТИВ ===== */

    @media (max-width: 980px) {
      .page {
        padding: 10px 12px 34px;
      }

      .header-loc1 {
        width: calc(100% + 8px);
        margin-left: -4px;
        margin-right: -4px;
        margin-bottom: 10px;
      }

      .month-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .page {
        padding: 8px 10px 34px;
      }

      .header-loc1 {
        width: calc(100% + 24px);
        margin-left: -12px;
        margin-right: -12px;
        margin-bottom: 8px;
      }

      .header-click {
        top: 18%;
        height: 62%;
        width: 24%;
      }

      .header-back {
        left: 0;
      }

      .header-music {
        right: 0;
      }

      .intro-shell {
        width: calc(100% - 28px);
        margin: 18px auto 24px;
        padding: 10px;
        border-radius: 26px;
      }

      .intro-hero {
        height: 160px;
        border-radius: 20px 20px 0 0;
      }

      .intro-card {
        width: calc(100% - 20px);
        margin: -22px auto 12px;
        padding: 24px 18px 24px;
        border-radius: 22px;
      }

      .intro-card h1 {
        font-size: 40px;
        line-height: 1.05;
        margin-bottom: 14px;
      }

      .intro-card p {
        font-size: 20px;
        line-height: 1.32;
        margin-bottom: 20px;
      }

      .intro-scroll-btn {
        width: 100%;
        max-width: 320px;
        padding: 15px 20px;
        font-size: 24px;
      }

      .progress-card {
        width: calc(100% - 28px);
        padding: 22px 16px 24px;
        border-radius: 28px;
        margin-bottom: 24px;
      }

      .progress-title {
        font-size: 32px;
        margin-bottom: 16px;
      }

      .progress-box {
        padding: 16px 14px 18px;
        border-radius: 22px;
      }

      .progress-top {
        gap: 10px;
      }

      .progress-count {
        font-size: 32px;
      }

      .progress-icon {
        font-size: 32px;
      }

      .progress-line {
        height: 14px;
      }

      .gallery-section {
        width: calc(100% - 28px);
        gap: 16px;
      }

      .month-card {
        padding: 10px;
        border-radius: 26px;
        gap: 10px;
      }

      .month-info {
        gap: 10px;
      }

      .month-icon {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
        font-size: 28px;
      }

      .month-title {
        font-size: 30px;
      }

      .month-subtitle {
        font-size: 20px;
      }

      .photo-card,
      .month-photo,
      .photo-placeholder {
        min-height: 270px;
      }

      .like-btn {
        width: 42px;
        height: 42px;
        top: 10px;
        right: 10px;
        font-size: 23px;
      }

      .unlock-card {
        width: calc(100% - 28px);
        padding: 22px 16px 24px;
      }

      .unlock-title {
        font-size: 31px;
      }

      .next-btn {
        width: 100%;
        font-size: 24px;
      }

      .hint {
        font-size: 18px;
      }
    }

    @media (max-width: 420px) {
      .intro-card h1 {
        font-size: 37px;
      }

      .intro-card p {
        font-size: 19px;
      }

      .progress-title {
        font-size: 30px;
      }

      .progress-count {
        font-size: 30px;
      }

      .month-title {
        font-size: 28px;
      }

      .month-subtitle {
        font-size: 19px;
      }

      .photo-card,
      .month-photo,
      .photo-placeholder {
        min-height: 245px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio id="bgMusic" loop preload="auto">
    <source src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="page">

    <header class="header-loc1">
      <img class="header-loc1-img" src="heder_loc1.png" alt="Локація 1">

      <button class="header-click header-back" id="backBtn" type="button" aria-label="Назад"></button>

      <button class="header-click header-music" id="musicBtn" type="button" aria-label="Музика"></button>
    </header>

    <section class="intro-shell">
      <div class="intro-hero"></div>

      <div class="intro-card">
        <h1>Знайомство з Софійкою</h1>

          Обери 5 наймиліших фото Софійки,

        </p>

        <button class="intro-scroll-btn" type="button" id="scrollToGalleryBtn">
          Перейти до фото
        </button>
      </div>
    </section>

    <section class="progress-card" id="taskCard">
      <h2 class="progress-title">Обери 5 наймиліших фото Софійки</h2>

      <div class="progress-box" aria-live="polite">
        <div class="progress-top">
          <span class="progress-icon">📸</span>

          <div class="progress-count">
            Вибрано: <span id="selectedCount">0</span>/5
          </div>

          <span class="progress-icon">💛</span>
        </div>

        <div class="progress-line">
          <span class="progress-line-fill" id="counterBarFill"></span>
        </div>
      </div>
    </section>

    <main class="gallery-section" id="sectionsContainer"></main>

    <section class="unlock-card">
      <h2 class="unlock-title">Коли обереш 5 фото —<br>відкриється наступний рівень</h2>
      <button class="next-btn" id="nextBtn" type="button" disabled>
        Відкрити наступний рівень
      </button>
      <div class="hint" id="hintText">Оберіть 5 фото, щоб продовжити подорож ✨</div>
    </section>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const sectionsData = [
      {
        icon: "👑",

        subtitle: "День, коли наша принцеса вперше відкрила оченята",

      },
      {

      },
      {

      {

        subtitle: "Сміємося, граємось і пізнаємо світ",
        photo: "foto8.jpg"
      },
      {
        icon: "🧤",
        title: "8 місяців",
        subtitle: "Маленькі перемоги щодня",
        photo: "foto9.jpg"
      },
      {
        icon: "🐣",
        title: "9 місяців",
        subtitle: "Готуємось до нових веселих кроків",
        photo: "foto10.jpg"
      },
      {
        icon: "🌸",
        title: "10 місяців",
        subtitle: "Більше самостійності та радості",
        photo: "foto11.jpg"
      },
      {
        icon: "💗",
        title: "11 місяців",
        subtitle: "Любимо, ростемо та мріємо",
        photo: "foto12.jpg"
      }
    ];

    const sectionsContainer = document.getElementById("sectionsContainer");
    const selectedCount = document.getElementById("selectedCount");
    const counterBarFill = document.getElementById("counterBarFill");
    const nextBtn = document.getElementById("nextBtn");
    const hintText = document.getElementById("hintText");
    const toast = document.getElementById("toast");
    const musicBtn = document.getElementById("musicBtn");
    const backBtn = document.getElementById("backBtn");
    const bgMusic = document.getElementById("bgMusic");
    const scrollToGalleryBtn = document.getElementById("scrollToGalleryBtn");

    const MAX_LIKES = 5;
    let selectedPhotos = new Set();

    if (bgMusic) {
      bgMusic.volume = 0.35;
    }

    function renderSections() {
      sectionsContainer.innerHTML = sectionsData.map((section, sectionIndex) => {
        const id = `month-${sectionIndex + 1}`;

        return `
          <section class="month-card">
            <div class="month-info">
              <div class="month-icon">${section.icon}</div>
              <div class="month-text">
                <h3 class="month-title">${section.title}</h3>
                <p class="month-subtitle">${section.subtitle}</p>
              </div>
            </div>

            <div class="photo-card">
              <button class="like-btn" type="button" aria-label="Вподобати фото" data-id="${id}">
                ♡
              </button>

              <img
                class="month-photo"
                src="${section.photo}"
                alt="${section.title}"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
              >

              <div class="photo-placeholder">
                <div>
                  Фото місяця
                  <span>${section.photo}</span>
                </div>
              </div>
            </div>
          </section>
        `;
      }).join("");

      bindLikeButtons();
      restoreLikes();
      updateUI();
    }

    function bindLikeButtons() {
      document.querySelectorAll(".like-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;

          if (selectedPhotos.has(id)) {
            selectedPhotos.delete(id);
          } else {
            if (selectedPhotos.size >= MAX_LIKES) {
              showToast("Можна вибрати лише 5 фото 💕");
              return;
            }

            selectedPhotos.add(id);
          }

          saveLikes();
          updateUI();
        });
      });
    }

    function updateUI() {
      const total = selectedPhotos.size;
      const percent = Math.round((total / MAX_LIKES) * 100);

      selectedCount.textContent = total;
      counterBarFill.style.width = percent + "%";

      document.querySelectorAll(".like-btn").forEach(btn => {
        const id = btn.dataset.id;
        const active = selectedPhotos.has(id);

        btn.classList.toggle("active", active);
        btn.textContent = active ? "❤" : "♡";
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });

      if (total === MAX_LIKES) {
        nextBtn.disabled = false;
        nextBtn.classList.add("enabled");
        hintText.textContent = "Чудово! Тепер можна відкрити наступний рівень ✨";
      } else {
        nextBtn.disabled = true;
        nextBtn.classList.remove("enabled");
        hintText.textContent = "Оберіть 5 фото, щоб продовжити подорож ✨";
      }
    }

    function saveLikes() {
      localStorage.setItem("sofiyka_location1_likes", JSON.stringify([...selectedPhotos]));
    }

    function restoreLikes() {
      const saved = localStorage.getItem("sofiyka_location1_likes");

      if (!saved) return;

      try {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
          selectedPhotos = new Set(parsed.slice(0, MAX_LIKES));
        }
      } catch (error) {
        selectedPhotos = new Set();
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast._timer);

      showToast._timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    function scrollToGallery() {
      sectionsContainer.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    scrollToGalleryBtn.addEventListener("click", scrollToGallery);

    nextBtn.addEventListener("click", () => {
      if (selectedPhotos.size !== MAX_LIKES) return;

      localStorage.setItem("sofiyka_location1_done", "true");
      showToast("Перша локація пройдена! 🌟");

      setTimeout(() => {
        window.location.href = "map.html";
      }, 900);
    });

    backBtn.addEventListener("click", () => {
      window.location.href = "map.html";
    });

    musicBtn.addEventListener("click", async () => {
      if (!bgMusic) return;

      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          musicBtn.classList.add("playing");
          localStorage.setItem("sofiyka_music", "on");
        } else {
          bgMusic.pause();
          musicBtn.classList.remove("playing");
          localStorage.setItem("sofiyka_music", "off");
        }
      } catch (error) {
        showToast("Музика не запустилась. Перевір mp3 файл 🎵");
      }
    });

    function restoreMusicState() {
      const musicState = localStorage.getItem("sofiyka_music");

      if (musicState === "on" && bgMusic) {
        bgMusic.play().then(() => {
          musicBtn.classList.add("playing");
        }).catch(() => {
          musicBtn.classList.remove("playing");
        });
      }
    }

    renderSections();
    restoreMusicState();
  </script>

</body>
</html>
