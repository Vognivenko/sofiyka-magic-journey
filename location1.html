<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Локація 1 — Знайомство із Софійкою</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'Cormorant Garamond', serif;
      color: #7b3f63;
      overflow-x: hidden;
      background: #fdeef7;
    }

    body {
      background-image: url("fon_loc1.png");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 18px 14px 40px;
      position: relative;
    }

    .top-buttons {
      position: fixed;
      top: 14px;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      pointer-events: none;
    }

    .round-btn {
      width: 54px;
      height: 54px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 5px 8px rgba(133, 76, 114, 0.35));
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .round-btn:active {
      transform: scale(0.94);
      filter: drop-shadow(0 3px 5px rgba(133, 76, 114, 0.28));
    }

    .round-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .location-sign {
      width: min(74vw, 360px);
      margin: 14px auto 6px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 7px 10px rgba(120, 66, 103, 0.25));
    }

    .location-sign img {
      width: 100%;
      display: block;
    }

    .intro-text {
      width: min(92vw, 560px);
      margin: 0 auto 14px;
      text-align: center;
      font-family: 'Marck Script', cursive;
      font-size: clamp(25px, 7vw, 42px);
      line-height: 1.08;
      color: #8d426d;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.75),
        0 5px 12px rgba(130, 73, 111, 0.22);
    }

    /* =========================
       ДРУГИЙ БЛОК 12.png
       Текст позиціонується відносно самої картинки
       ========================= */

    .task-block {
      width: min(94vw, 620px);
      margin: 10px auto 22px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 10px 18px rgba(127, 76, 111, 0.22));
    }

    .task-block img {
      width: 100%;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .task-title {
      position: absolute;

      /* Права частина картинки 12.png */
      left: 42%;
      right: 8%;

      /* Висота заголовка над рожевою плашкою */
      top: 23%;

      text-align: center;
      font-family: 'Marck Script', cursive;
      font-size: clamp(20px, 5.8vw, 36px);
      line-height: 1.05;
      font-weight: 400;
      color: #8a3f6b;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.82),
        0 4px 8px rgba(121, 64, 101, 0.18);
      transform: translateY(-50%);
      z-index: 3;
    }

    .task-counter {
      position: absolute;

      /* Межі рожевої плашки на 12.png */
      left: 44%;
      right: 8%;

      /* Центр рожевої плашки */
      top: 70.5%;

      height: 13%;
      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px, 4.9vw, 30px);
      line-height: 1;
      font-weight: 700;
      color: #ffffff;
      text-shadow:
        0 2px 4px rgba(120, 45, 92, 0.35),
        0 0 8px rgba(255, 174, 220, 0.45);
      z-index: 3;
    }

    .gallery-ribbon {
      width: min(92vw, 540px);
      margin: 4px auto 18px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 8px 12px rgba(120, 72, 103, 0.2));
    }

    .gallery-ribbon img {
      width: 100%;
      display: block;
    }

    .months {
      width: min(94vw, 720px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
      z-index: 2;
    }

    .month-card {
      position: relative;
      width: 100%;
      padding: 22px 16px 20px;
      min-height: 260px;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      filter: drop-shadow(0 8px 14px rgba(130, 74, 110, 0.2));
    }

    .month-card.pink {
      background-image: url("1.png");
    }

    .month-card.winter {
      background-image: url("2.png");
    }

    .month-card.spring {
      background-image: url("3.png");
    }

    .month-card.summer {
      background-image: url("4.png");
    }

    .month-title {
      margin: 0 0 14px;
      text-align: center;
      font-family: 'Marck Script', cursive;
      font-size: clamp(28px, 7vw, 44px);
      font-weight: 400;
      color: #874266;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.8),
        0 4px 10px rgba(126, 70, 105, 0.18);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 0 4px;
    }

    .photo-card {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.82), rgba(255,228,244,0.8));
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow:
        inset 0 0 0 1px rgba(255, 186, 223, 0.38),
        0 6px 10px rgba(126, 70, 105, 0.18);
      cursor: pointer;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
    }

    .photo-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(15px, 3.8vw, 20px);
      font-weight: 700;
      color: #a65b84;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,0.95), rgba(255,215,238,0.82));
    }

    .like-btn {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      padding: 0;
      z-index: 4;
      cursor: pointer;
      filter: drop-shadow(0 3px 5px rgba(123, 58, 96, 0.35));
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .like-btn img {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0.62;
      object-fit: contain;
    }

    .photo-card.selected .like-btn {
      transform: scale(1.13);
    }

    .photo-card.selected .like-btn img {
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(255, 82, 169, 0.65));
    }

    .photo-card.selected {
      border-color: rgba(255, 101, 178, 0.88);
      box-shadow:
        inset 0 0 0 2px rgba(255, 128, 192, 0.55),
        0 0 0 3px rgba(255, 211, 235, 0.7),
        0 8px 14px rgba(126, 70, 105, 0.22);
    }

    .complete-box {
      width: min(90vw, 520px);
      margin: 28px auto 0;
      padding: 18px 16px;
      text-align: center;
      border-radius: 26px;
      background: rgba(255, 246, 252, 0.82);
      border: 2px solid rgba(255, 184, 224, 0.65);
      box-shadow: 0 8px 18px rgba(126, 70, 105, 0.18);
      display: none;
      position: relative;
      z-index: 2;
    }

    .complete-box.show {
      display: block;
      animation: softAppear 0.45s ease both;
    }

    .complete-title {
      margin: 0 0 12px;
      font-family: 'Marck Script', cursive;
      font-size: clamp(28px, 7vw, 42px);
      color: #8d426d;
      line-height: 1.05;
    }

    .map-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #ec7ab7, #b95f99);
      box-shadow:
        0 7px 13px rgba(157, 75, 124, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.45);
      cursor: pointer;
    }

    .map-btn:active {
      transform: scale(0.97);
    }

    .fullscreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(60, 31, 54, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      backdrop-filter: blur(5px);
    }

    .fullscreen.show {
      display: flex;
    }

    .fullscreen-content {
      position: relative;
      max-width: 94vw;
      max-height: 88vh;
    }

    .fullscreen-img {
      max-width: 94vw;
      max-height: 88vh;
      border-radius: 24px;
      display: block;
      box-shadow: 0 14px 32px rgba(0,0,0,0.35);
      border: 4px solid rgba(255, 235, 248, 0.88);
      object-fit: contain;
    }

    .fullscreen-placeholder {
      width: min(86vw, 430px);
      aspect-ratio: 3 / 4;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,0.98), rgba(255,210,236,0.95));
      border: 4px solid rgba(255, 235, 248, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: 'Marck Script', cursive;
      font-size: 34px;
      color: #8d426d;
      box-shadow: 0 14px 32px rgba(0,0,0,0.35);
    }

    .close-fullscreen {
      position: absolute;
      top: -16px;
      right: -12px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.94);
      color: #9b4c7c;
      font-size: 30px;
      line-height: 44px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.25);
    }

    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 10px rgba(255, 180, 226, 0.9);
      animation: floatSparkle 6s linear infinite;
    }

    .sparkle:nth-child(1) { left: 8%; top: 18%; animation-delay: 0s; }
    .sparkle:nth-child(2) { left: 22%; top: 42%; animation-delay: 1.2s; }
    .sparkle:nth-child(3) { left: 74%; top: 20%; animation-delay: 0.7s; }
    .sparkle:nth-child(4) { left: 88%; top: 54%; animation-delay: 2.1s; }
    .sparkle:nth-child(5) { left: 48%; top: 78%; animation-delay: 1.6s; }
    .sparkle:nth-child(6) { left: 15%; top: 72%; animation-delay: 2.7s; }

    @keyframes floatSparkle {
      0% {
        transform: translateY(0) scale(0.65);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      70% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(-38px) scale(1.1);
        opacity: 0;
      }
    }

    @keyframes softAppear {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 430px) {
      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .round-btn {
        width: 50px;
        height: 50px;
      }

      .location-sign {
        margin-top: 12px;
        width: min(76vw, 320px);
      }

      .task-block {
        width: 96vw;
      }

      .task-title {
        left: 41%;
        right: 7%;
        top: 22.8%;
        font-size: clamp(19px, 5.7vw, 27px);
      }

      .task-counter {
        left: 44%;
        right: 7%;
        top: 70.5%;
        height: 13%;
        font-size: clamp(18px, 5vw, 24px);
      }

      .month-card {
        padding: 20px 12px 18px;
        min-height: 235px;
      }

      .photo-grid {
        gap: 8px;
      }

      .like-btn {
        width: 34px;
        height: 34px;
      }
    }

    @media (max-width: 360px) {
      .task-title {
        left: 41.5%;
        right: 7%;
        top: 22.5%;
        font-size: 20px;
      }

      .task-counter {
        left: 44%;
        right: 7%;
        top: 70.5%;
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <audio id="bgMusic" src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" loop autoplay></audio>

  <div class="sparkles" aria-hidden="true">
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
  </div>

  <div class="top-buttons">
    <button class="round-btn" id="backBtn" type="button" aria-label="Повернутися назад">
      <img src="5.png" alt="Назад" />
    </button>

    <button class="round-btn" id="musicBtn" type="button" aria-label="Музика">
      <img src="6.png" alt="Музика" />
    </button>
  </div>

  <main class="page">
    <section class="location-sign">
      <img src="8.png" alt="Локація 1" />
    </section>

    <div class="intro-text">
      Знайомство із Софійкою
    </div>

    <section class="task-block" aria-label="Завдання">
      <img src="12.png" alt="Завдання" />
      <div class="task-title">Обери 7 наймиліших фото Софійки</div>
      <div class="task-counter" id="selectedCounter">Обрано 0 з 7</div>
    </section>

    <section class="gallery-ribbon">
      <img src="9.png" alt="Галерея" />
    </section>

    <section class="months" id="monthsContainer"></section>

    <section class="complete-box" id="completeBox">
      <h2 class="complete-title">Локацію завершено ✨</h2>
      <button class="map-btn" id="goMapBtn" type="button">Повернутися на карту</button>
    </section>
  </main>

  <div class="fullscreen" id="fullscreen">
    <div class="fullscreen-content" id="fullscreenContent">
      <button class="close-fullscreen" id="closeFullscreen" type="button">×</button>
      <img class="fullscreen-img" id="fullscreenImg" src="" alt="Фото Софійки" />
      <div class="fullscreen-placeholder" id="fullscreenPlaceholder">Фото Софійки</div>
    </div>
  </div>

  <script>
    const REQUIRED_LIKES = 7;
    const STORAGE_KEY = "sofiyka_location1_selected_photos";

    const months = [
      { title: "Народження", style: "summer" },
      { title: "1 місяць", style: "summer" },
      { title: "2 місяці", style: "summer" },
      { title: "3 місяці", style: "summer" },
      { title: "4 місяці", style: "pink" },
      { title: "5 місяців", style: "pink" },
      { title: "6 місяців", style: "autumn" },
      { title: "7 місяців", style: "autumn" },
      { title: "8 місяців", style: "winter" },
      { title: "9 місяців", style: "winter" },
      { title: "10 місяців", style: "spring" },
      { title: "11 місяців", style: "spring" }
    ];

    function getCardStyle(style) {
      if (style === "winter") return "winter";
      if (style === "spring") return "spring";
      if (style === "autumn") return "summer";
      if (style === "summer") return "summer";
      return "pink";
    }

    function getSavedSelected() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        return [];
      }
    }

    let selectedPhotos = getSavedSelected();

    const monthsContainer = document.getElementById("monthsContainer");
    const selectedCounter = document.getElementById("selectedCounter");
    const completeBox = document.getElementById("completeBox");
    const goMapBtn = document.getElementById("goMapBtn");
    const backBtn = document.getElementById("backBtn");
    const musicBtn = document.getElementById("musicBtn");
    const bgMusic = document.getElementById("bgMusic");

    const fullscreen = document.getElementById("fullscreen");
    const fullscreenImg = document.getElementById("fullscreenImg");
    const fullscreenPlaceholder = document.getElementById("fullscreenPlaceholder");
    const closeFullscreen = document.getElementById("closeFullscreen");

    function buildGallery() {
      monthsContainer.innerHTML = "";

      months.forEach((month, monthIndex) => {
        const monthSection = document.createElement("section");
        monthSection.className = `month-card ${getCardStyle(month.style)}`;

        const title = document.createElement("h2");
        title.className = "month-title";
        title.textContent = month.title;

        const grid = document.createElement("div");
        grid.className = "photo-grid";

        for (let photoIndex = 1; photoIndex <= 3; photoIndex++) {
          const photoId = `month-${monthIndex}-photo-${photoIndex}`;

          const card = document.createElement("button");
          card.className = "photo-card";
          card.type = "button";
          card.dataset.photoId = photoId;
          card.dataset.month = month.title;
          card.dataset.photoNumber = photoIndex;

          if (selectedPhotos.includes(photoId)) {
            card.classList.add("selected");
          }

          const img = document.createElement("img");

          /*
            Коли вставлятимеш реальні фото — просто перейменуй їх за схемою:
            photos/month-0-1.jpg, photos/month-0-2.jpg, photos/month-0-3.jpg
            photos/month-1-1.jpg ... і так далі до photos/month-11-3.jpg
          */
          img.src = `photos/month-${monthIndex}-${photoIndex}.jpg`;
          img.alt = `${month.title} — фото ${photoIndex}`;

          const placeholder = document.createElement("div");
          placeholder.className = "photo-placeholder";
          placeholder.innerHTML = `${month.title}<br>Фото ${photoIndex}`;

          img.addEventListener("load", () => {
            img.style.opacity = "1";
            placeholder.style.display = "none";
          });

          img.addEventListener("error", () => {
            img.removeAttribute("src");
            img.style.display = "none";
            placeholder.style.display = "flex";
          });

          const likeBtn = document.createElement("span");
          likeBtn.className = "like-btn";
          likeBtn.innerHTML = `<img src="10.png" alt="Лайк" />`;

          card.appendChild(img);
          card.appendChild(placeholder);
          card.appendChild(likeBtn);

          card.addEventListener("click", (event) => {
            const clickOnLike = event.target.closest(".like-btn");

            if (clickOnLike) {
              toggleLike(photoId, card);
              return;
            }

            openFullscreen(img, month.title, photoIndex);
          });

          likeBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            toggleLike(photoId, card);
          });

          grid.appendChild(card);
        }

        monthSection.appendChild(title);
        monthSection.appendChild(grid);
        monthsContainer.appendChild(monthSection);
      });

      updateCounter();
    }

    function toggleLike(photoId, card) {
      const alreadySelected = selectedPhotos.includes(photoId);

      if (alreadySelected) {
        selectedPhotos = selectedPhotos.filter(id => id !== photoId);
        card.classList.remove("selected");
      } else {
        if (selectedPhotos.length >= REQUIRED_LIKES) {
          return;
        }

        selectedPhotos.push(photoId);
        card.classList.add("selected");
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedPhotos));
      updateCounter();
    }

    function updateCounter() {
      selectedCounter.textContent = `О
