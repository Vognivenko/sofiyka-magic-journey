<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Карта чарівної подорожі Софійки</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #efd8ff;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.9), transparent 18%),
        linear-gradient(180deg, #ffe3f7 0%, #eadcff 45%, #d8edff 100%);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 10px 8px 28px;
    }

    .map-wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255,255,255,0.2);
      box-shadow:
        0 0 24px rgba(255, 220, 120, 0.5),
        0 18px 40px rgba(70, 25, 90, 0.26);
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .image-btn {
      width: 58px;
      height: 58px;
      border: none;
      background: transparent;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      cursor: pointer;
      pointer-events: auto;
      text-decoration: none;
      display: block;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 6px 10px rgba(70, 25, 90, 0.25));
      transition: transform .2s ease, filter .2s ease;
    }

    .image-btn:active {
      transform: scale(0.93);
    }

    .back-btn {
      background-image: url("btn_back.png");
    }

    .music-btn.music-on {
      background-image: url("btn_music_on.png");
      animation: musicPulse 1.8s ease-in-out infinite;
    }

    .music-btn.music-off {
      background-image: url("btn_music_off.png");
    }

    .map-header {
      position: absolute;
      top: 5.2%;
      left: 13%;
      right: 13%;
      z-index: 20;
      text-align: center;
      pointer-events: none;
    }

    .map-title {
      font-size: clamp(32px, 7.2vw, 50px);
      line-height: 0.9;
      font-weight: 700;
      color: #7d3f97;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.88),
        0 4px 7px rgba(70,30,100,0.25),
        0 0 16px rgba(255,235,180,0.75);
    }

    .map-subtitle {
      margin-top: 9px;
      font-size: clamp(13px, 3vw, 18px);
      font-weight: 700;
      color: #74418a;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    .spark {
      position: absolute;
      z-index: 8;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,242,171,0.95) 35%, rgba(255,242,171,0) 72%);
      box-shadow: 0 0 18px rgba(255,235,150,0.95);
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255,245,190,0.95);
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .spark::before {
      width: 2px;
      height: 25px;
    }

    .spark::after {
      width: 25px;
      height: 2px;
    }

    .s1 { top: 14%; left: 25%; animation-delay: 0s; }
    .s2 { top: 26%; right: 20%; animation-delay: .7s; }
    .s3 { top: 50%; left: 21%; animation-delay: 1.2s; }
    .s4 { top: 69%; right: 18%; animation-delay: .5s; }
    .s5 { bottom: 14%; left: 57%; animation-delay: 1.5s; }

    .location-wrap {
      position: absolute;
      z-index: 100;
    }

    .location {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background-color: transparent;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: center center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      appearance: none;
      -webkit-appearance: none;
      padding: 0;
      transition:
        opacity .35s ease,
        filter .35s ease,
        transform .25s ease;
    }

    .location:active {
      transform: scale(0.98);
    }

    .location.next {
      opacity: 1;
      filter:
        brightness(1.13)
        contrast(1.1)
        saturate(1.18)
        drop-shadow(0 11px 15px rgba(88,35,110,0.28))
        drop-shadow(0 0 22px rgba(255,225,120,0.96));
      animation: activePulse 2.4s ease-in-out infinite;
    }

    .location.opened {
      opacity: 1;
      filter:
        brightness(1.08)
        contrast(1.05)
        saturate(1.1)
        drop-shadow(0 10px 14px rgba(88,35,110,0.25))
        drop-shadow(0 0 14px rgba(255,225,120,0.72));
    }

    .location.locked {
      opacity: 0.42;
      filter:
        grayscale(0.65)
        saturate(0.45)
        brightness(0.9)
        contrast(0.88)
        drop-shadow(0 5px 7px rgba(70,35,90,0.12));
      animation: none;
    }

    .location1-wrap {
      left: 8.5%;
      top: 21%;
      width: 54%;
      aspect-ratio: 800 / 433;
      z-index: 5000;
    }

    .location2-wrap {
      left: 39.2%;
      top: 36.5%;
      width: 53%;
      aspect-ratio: 535 / 243;
    }

    .location3-wrap {
      left: 8.3%;
      top: 50.6%;
      width: 50%;
      aspect-ratio: 535 / 243;
    }

    .location4-wrap {
      left: 39%;
      top: 63.6%;
      width: 53%;
      aspect-ratio: 535 / 243;
    }

    .location5-wrap {
      left: 7.7%;
      top: 74.2%;
      width: 51%;
      aspect-ratio: 535 / 243;
    }

    .location1 { background-image: url("location1.png"); }
    .location2 { background-image: url("location2.png"); }
    .location3 { background-image: url("location3.png"); }
    .location4 { background-image: url("location4.png"); }
    .location5 { background-image: url("location5.png"); }

    .status-icon {
      position: absolute;
      right: -4%;
      top: -7%;
      width: 22%;
      aspect-ratio: 1 / 1;
      z-index: 20;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity .3s ease, transform .3s ease;
      filter: drop-shadow(0 4px 7px rgba(70, 25, 90, 0.25));
    }

    .status-icon.show {
      opacity: 1;
      transform: scale(1);
    }

    .status-icon.check {
      background-image: url("icon_check.png");
    }

    .status-icon.lock {
      background-image: url("icon_lock.png");
      right: 2%;
      top: 8%;
      width: 21%;
      opacity: 0.88;
      transform: scale(1);
    }

    .progress-panel {
      position: absolute;
      left: 50%;
      bottom: 0.2%;
      width: 78%;
      max-width: 420px;
      aspect-ratio: 3 / 1;
      z-index: 120;
      transform: translateX(-50%);
      border: none;
      background: transparent url("progress_panel.png") center / contain no-repeat;
      cursor: pointer;
      pointer-events: auto;
      padding: 0;
      font-family: 'Cormorant Garamond', serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 8px 14px rgba(70, 25, 90, 0.23));
      animation: progressFloat 5.2s ease-in-out infinite;
    }

    .progress-panel:active {
      transform: translateX(-50%) scale(0.98);
    }

    .progress-content {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 32%;
      text-align: center;
      pointer-events: none;
    }

    .progress-title {
      color: #7d3f97;
      font-weight: 700;
      font-size: clamp(14px, 3.4vw, 21px);
      line-height: 1;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.95),
        0 2px 4px rgba(100,45,120,0.16);
    }

    .progress-text {
      margin-top: 4px;
      color: #9b5aa8;
      font-weight: 700;
      font-size: clamp(12px, 2.9vw, 17px);
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 7px;
      pointer-events: none;
    }

    .progress-dot {
      width: 8.5px;
      height: 8.5px;
      border-radius: 50%;
      background: rgba(152,118,174,0.35);
      box-shadow:
        inset 0 1px 2px rgba(80,30,100,0.18),
        0 0 0 1px rgba(255,255,255,0.65);
    }

    .progress-dot.done {
      background:
        radial-gradient(circle at 35% 30%, #fff6d8 0%, #d891ff 45%, #7d3f97 100%);
      box-shadow:
        0 0 0 2px rgba(255,231,136,0.72),
        0 0 10px rgba(255,218,116,0.9);
    }

    .progress-dot.active {
      background:
        radial-gradient(circle at 35% 30%, #ffffff 0%, #ffe28a 42%, #d38aff 100%);
      box-shadow:
        0 0 0 2px rgba(255,231,136,0.88),
        0 0 13px rgba(255,218,116,1);
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    @keyframes musicPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.8); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes activePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes progressFloat {
      0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
      50% { transform: translateX(-50%) translateY(-1px) scale(1.002); }
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.18); opacity: 1; }
    }

    @media (max-width: 430px) {
      .image-btn {
        width: 54px;
        height: 54px;
      }

      .topbar {
        top: 12px;
        left: 12px;
        right: 12px;
      }

      .map-title {
        font-size: clamp(31px, 7.1vw, 45px);
      }

      .map-subtitle {
        font-size: clamp(13px, 2.9vw, 17px);
      }

      .progress-panel {
        width: 82%;
        bottom: 0.1%;
      }

      .progress-content {
        top: 33%;
      }

      .progress-dots {
        margin-top: 6px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio
    id="bgMusic"
    src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3"
    loop
    preload="auto">
  </audio>

  <main class="page">
    <section class="map-wrap">
      <img class="map-image" src="map.png" alt="Карта чарівної подорожі Софійки" />

      <div class="topbar">
        <a id="backBtn" class="image-btn back-btn" href="index.html" aria-label="Назад"></a>

        <button
          id="musicToggle"
          class="image-btn music-btn music-off"
          type="button"
          aria-label="Увімкнути музику"
          onclick="toggleMusic(event)">
        </button>
      </div>

      <div class="map-header">
        <div class="map-title">Карта чарівної<br>подорожі</div>
        <div class="map-subtitle">Пройди локації та знайди запрошення Софійки</div>
      </div>

      <div class="spark s1"></div>
      <div class="spark s2"></div>
      <div class="spark s3"></div>
      <div class="spark s4"></div>
      <div class="spark s5"></div>

      <div class="location-wrap location1-wrap">
        <button class="location location1" id="loc1" type="button" aria-label="Знайомство з Софійкою" onclick="handleLocationClick(event, 1)"></button>
        <span class="status-icon" id="status1"></span>
      </div>

      <div class="location-wrap location2-wrap">
        <button class="location location2" id="loc2" type="button" aria-label="Храм" onclick="handleLocationClick(event, 2)"></button>
        <span class="status-icon" id="status2"></span>
      </div>

      <div class="location-wrap location3-wrap">
        <button class="location location3" id="loc3" type="button" aria-label="Панорама" onclick="handleLocationClick(event, 3)"></button>
        <span class="status-icon" id="status3"></span>
      </div>

      <div class="location-wrap location4-wrap">
        <button class="location location4" id="loc4" type="button" aria-label="Королівська трапеза" onclick="handleLocationClick(event, 4)"></button>
        <span class="status-icon" id="status4"></span>
      </div>

      <div class="location-wrap location5-wrap">
        <button class="location location5" id="loc5" type="button" aria-label="Фінальне запрошення" onclick="handleLocationClick(event, 5)"></button>
        <span class="status-icon" id="status5"></span>
      </div>

      <button class="progress-panel" id="progressPanel" type="button" aria-label="Прогрес подорожі" onclick="showProgress(event)">
        <div class="progress-content">
          <div class="progress-title" id="progressTitle">Подорож Софійки</div>
          <div class="progress-text" id="progressText">Пройдено 0 з 5</div>
          <div class="progress-dots">
            <span class="progress-dot" id="dot1"></span>
            <span class="progress-dot" id="dot2"></span>
            <span class="progress-dot" id="dot3"></span>
            <span class="progress-dot" id="dot4"></span>
            <span class="progress-dot" id="dot5"></span>
          </div>
        </div>
      </button>
    </section>
  </main>

  <script>
    var bgMusic = document.getElementById("bgMusic");
    var musicToggle = document.getElementById("musicToggle");
    var progressTitle = document.getElementById("progressTitle");
    var progressText = document.getElementById("progressText");

    var locations = [
      {
        number: 1,
        buttonId: "loc1",
        statusId: "status1",
        dotId: "dot1",
        doneKey: "sofiyka_location1_done",
        url: "location1.html",
        lockedMessage: "Перша локація вже відкрита ❤️"
      },
      {
        number: 2,
        buttonId: "loc2",
        statusId: "status2",
        dotId: "dot2",
        doneKey: "sofiyka_location2_done",
        url: "location2.html",
        lockedMessage: "Спочатку пройди першу локацію ❤️"
      },
      {
        number: 3,
        buttonId: "loc3",
        statusId: "status3",
        dotId: "dot3",
        doneKey: "sofiyka_location3_done",
        url: "location3.html",
        lockedMessage: "Спочатку відкрий маршрут у 2 локації ❤️"
      },
      {
        number: 4,
        buttonId: "loc4",
        statusId: "status4",
        dotId: "dot4",
        doneKey: "sofiyka_location4_done",
        url: "location4.html",
        lockedMessage: "Спочатку пройди 3 локацію ❤️"
      },
      {
        number: 5,
        buttonId: "loc5",
        statusId: "status5",
        dotId: "dot5",
        doneKey: "sofiyka_location5_done",
        url: "location5.html",
        lockedMessage: "Спочатку заповни анкету у 4 локації ❤️"
      }
    ];

    if (bgMusic) {
      bgMusic.volume = 0.35;
    }

    function isDone(number) {
      var location = locations[number - 1];
      return localStorage.getItem(location.doneKey) === "true";
    }

    function isUnlocked(number) {
      if (number === 1) return true;
      return isDone(number - 1);
    }

    function getCompletedCount() {
      var count = 0;

      for (var i = 0; i < locations.length; i++) {
        if (isDone(locations[i].number)) {
          count++;
        }
      }

      return count;
    }

    function getActiveLocationNumber() {
      for (var i = 0; i < locations.length; i++) {
        var number = locations[i].number;

        if (!isDone(number) && isUnlocked(number)) {
          return number;
        }
      }

      return null;
    }

    function resetClasses(element) {
      if (!element) return;

      element.classList.remove("next");
      element.classList.remove("opened");
      element.classList.remove("locked");
    }

    function updateMapProgress() {
      var completedCount = getCompletedCount();
      var activeNumber = getActiveLocationNumber();

      if (completedCount >= 5) {
        progressTitle.textContent = "✨ Подорож завершена ✨";
        progressText.textContent = "Усі локації пройдено";
      } else {
        progressTitle.textContent = "Подорож Софійки";
        progressText.textContent = "Пройдено " + completedCount + " з 5";
      }

      for (var i = 0; i < locations.length; i++) {
        var location = locations[i];
        var number = location.number;
        var button = document.getElementById(location.buttonId);
        var status = document.getElementById(location.statusId);
        var dot = document.getElementById(location.dotId);

        resetClasses(button);

        if (status) {
          status.className = "status-icon";
        }

        if (dot) {
          dot.classList.remove("done");
          dot.classList.remove("active");
        }

        if (isDone(number)) {
          if (button) button.classList.add("opened");
          if (status) status.className = "status-icon check show";
          if (dot) dot.classList.add("done");
        } else if (isUnlocked(number)) {
          if (button) button.classList.add("next");
          if (dot) dot.classList.add("active");
        } else {
          if (button) button.classList.add("locked");
          if (status) status.className = "status-icon lock show";
        }
      }
    }

    function handleLocationClick(event, number) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      var location = locations[number - 1];

      if (isUnlocked(number)) {
        window.location.href = location.url;
      } else {
        alert(location.lockedMessage);
      }
    }

    function showProgress(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      var completedCount = getCompletedCount();

      if (completedCount >= 5) {
        alert("✨ Подорож Софійки завершена! Запрошення знайдено ❤️");
      } else {
        alert("Пройдено " + completedCount + " з 5. Продовжуй чарівну подорож Софійки ✨");
      }
    }

    async function toggleMusic(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (!bgMusic || !musicToggle) return;

      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          musicToggle.classList.remove("music-off");
          musicToggle.classList.add("music-on");
          musicToggle.setAttribute("aria-label", "Вимкнути музику");
        } else {
          bgMusic.pause();
          musicToggle.classList.remove("music-on");
          musicToggle.classList.add("music-off");
          musicToggle.setAttribute("aria-label", "Увімкнути музику");
        }
      } catch (error) {
        musicToggle.classList.remove("music-on");
        musicToggle.classList.add("music-off");
        alert("Музика не запустилась. Перевір, чи mp3 файл лежить поруч із map.html.");
      }
    }

    updateMapProgress();
  </script>

</body>
</html>
