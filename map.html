<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Карта подорожі Софійки</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #efd8ff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.9), transparent 18%),
        radial-gradient(circle at 85% 18%, rgba(255,220,245,0.65), transparent 22%),
        linear-gradient(180deg, #ffe3f7 0%, #eadcff 45%, #d8edff 100%);
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 8px 26px;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .round-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid rgba(255, 220, 120, 0.95);
      background: rgba(255, 244, 225, 0.76);
      color: #71347f;
      font-size: 23px;
      font-weight: 700;
      box-shadow:
        0 0 14px rgba(255, 220, 120, 0.75),
        inset 0 0 10px rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      pointer-events: auto;
    }

    .round-btn.playing {
      background: rgba(255, 204, 236, 0.78);
      color: #9b2c7b;
      animation: musicPulse 1.8s infinite;
    }

    .map-wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 26px;
      overflow: hidden;
      box-shadow:
        0 0 24px rgba(255, 220, 120, 0.5),
        0 18px 40px rgba(70, 25, 90, 0.26);
      animation: mapAppear 0.9s ease both;
      background: rgba(255,255,255,0.22);
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .map-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.10) 0%,
          rgba(255,255,255,0) 28%,
          rgba(70,20,90,0.08) 100%
        );
    }

    .butterfly {
      position: fixed;
      z-index: 18;
      font-size: 24px;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(80, 30, 100, 0.28));
      opacity: 0;
    }

    .b1 {
      top: 22%;
      left: -12%;
      animation: flyRight 14s linear infinite;
    }

    .b2 {
      top: 58%;
      left: -14%;
      animation: flyRight2 18s linear infinite;
      animation-delay: -6s;
    }

    .b3 {
      top: 36%;
      right: -12%;
      animation: flyLeft 16s linear infinite;
      animation-delay: -4s;
    }

    .b4 {
      top: 72%;
      right: -14%;
      animation: flyLeft2 20s linear infinite;
      animation-delay: -9s;
    }

    @keyframes mapAppear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes musicPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes flyRight {
      0% {
        transform: translateX(0) translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      50% {
        transform: translateX(58vw) translateY(34px) rotate(8deg);
      }

      100% {
        transform: translateX(122vw) translateY(-24px) rotate(-8deg);
        opacity: 0;
      }
    }

    @keyframes flyRight2 {
      0% {
        transform: translateX(0) translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      45% {
        transform: translateX(48vw) translateY(-28px) rotate(-7deg);
      }

      100% {
        transform: translateX(122vw) translateY(18px) rotate(7deg);
        opacity: 0;
      }
    }

    @keyframes flyLeft {
      0% {
        transform: translateX(0) translateY(0) scaleX(-1) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      50% {
        transform: translateX(-54vw) translateY(32px) scaleX(-1) rotate(8deg);
      }

      100% {
        transform: translateX(-122vw) translateY(-20px) scaleX(-1) rotate(-7deg);
        opacity: 0;
      }
    }

    @keyframes flyLeft2 {
      0% {
        transform: translateX(0) translateY(0) scaleX(-1) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      50% {
        transform: translateX(-60vw) translateY(-26px) scaleX(-1) rotate(-6deg);
      }

      100% {
        transform: translateX(-122vw) translateY(18px) scaleX(-1) rotate(8deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio
    id="bgMusic"
    src="./solarflex-magic-fantasy-fairy-tale-music-495646.mp3?v=1"
    autoplay
    loop
    preload="auto">
  </audio>

  <main class="page">

    <div class="topbar">
      <button class="round-btn" type="button" onclick="location.href='index.html'" aria-label="Назад">
        ←
      </button>

      <button id="musicToggle" class="round-btn playing" type="button" aria-label="Вимкнути музику">
        ♪
      </button>
    </div>

    <div class="butterfly b1">🦋</div>
    <div class="butterfly b2">🦋</div>
    <div class="butterfly b3">🦋</div>
    <div class="butterfly b4">🦋</div>

    <section class="map-wrap">
      <img
        class="map-image"
        src="./map.png?v=1"
        alt="Карта чарівної подорожі Софійки"
      />
    </section>

  </main>

  <script>
    const bgMusic = document.getElementById("bgMusic");
    const musicToggle = document.getElementById("musicToggle");

    bgMusic.volume = 0.35;

    let musicStarted = false;
    let musicMutedByUser = false;

    async function startMusicImmediately() {
      if (musicMutedByUser) return;

      try {
        await bgMusic.play();
        musicStarted = true;
        musicToggle.classList.add("playing");
        musicToggle.textContent = "🔊";
        musicToggle.setAttribute("aria-label", "Вимкнути музику");
      } catch (error) {
        musicStarted = false;
        musicToggle.classList.remove("playing");
        musicToggle.textContent = "♪";
        musicToggle.setAttribute("aria-label", "Увімкнути музику");

        window.addEventListener("click", firstUserInteraction, { once: true });
        window.addEventListener("touchstart", firstUserInteraction, { once: true });
      }
    }

    async function firstUserInteraction() {
      if (musicMutedByUser) return;

      try {
        await bgMusic.play();
        musicStarted = true;
        musicToggle.classList.add("playing");
        musicToggle.textContent = "🔊";
        musicToggle.setAttribute("aria-label", "Вимкнути музику");
      } catch (error) {
        musicStarted = false;
      }
    }

    function pauseMusic() {
      bgMusic.pause();
      musicStarted = false;
      musicMutedByUser = true;
      musicToggle.classList.remove("playing");
      musicToggle.textContent = "♪";
      musicToggle.setAttribute("aria-label", "Увімкнути музику");
    }

    async function resumeMusic() {
      musicMutedByUser = false;

      try {
        await bgMusic.play();
        musicStarted = true;
        musicToggle.classList.add("playing");
        musicToggle.textContent = "🔊";
        musicToggle.setAttribute("aria-label", "Вимкнути музику");
      } catch (error) {
        musicStarted = false;
        musicToggle.classList.remove("playing");
        musicToggle.textContent = "♪";
      }
    }

    musicToggle.addEventListener("click", (event) => {
      event.stopPropagation();

      if (musicStarted && !bgMusic.paused) {
        pauseMusic();
      } else {
        resumeMusic();
      }
    });

    window.addEventListener("load", startMusicImmediately);
  </script>

</body>
</html>
