<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>Карта чарівної подорожі</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --violet: #7e459e;
      --gold: #efd77a;
      --white-soft: rgba(255,255,255,0.86);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Cormorant Garamond", serif;
      background: #f7e7ff;
      color: var(--violet);
    }

    .map-page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.72), transparent 24%),
        radial-gradient(circle at 80% 20%, rgba(255,238,190,0.48), transparent 24%),
        linear-gradient(180deg, #f7e7ff 0%, #ffeef8 55%, #fff3d9 100%);
    }

    .map-wrap {
      position: relative;
      width: min(100vw, 941px);
      aspect-ratio: 941 / 1672;
      overflow: hidden;
      background: #f8e9ff;
      box-shadow: 0 0 32px rgba(126, 69, 158, 0.18);
    }

    .map-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      z-index: 10;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspot:active {
      transform: scale(0.97);
    }

    .back-hotspot {
      left: 3.2%;
      top: 1.75%;
      width: 10.5%;
      height: 6.2%;
      border-radius: 50%;
    }

    .music-hotspot {
      right: 3.2%;
      top: 1.75%;
      width: 10.5%;
      height: 6.2%;
      border-radius: 50%;
    }

    .music-hotspot.playing::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid rgba(255, 230, 120, 0.85);
      box-shadow:
        0 0 18px rgba(255, 230, 120, 0.9),
        0 0 30px rgba(198, 130, 235, 0.45);
      animation: musicPulse 1.4s ease-in-out infinite;
      pointer-events: none;
    }

    .location-hotspot {
      border-radius: 34px;
    }

    .loc1 {
      left: 12.4%;
      top: 19.7%;
      width: 55.5%;
      height: 14.2%;
    }

    .loc2 {
      left: 44.6%;
      top: 36.0%;
      width: 48.8%;
      height: 12.6%;
    }

    .loc3 {
      left: 9.0%;
      top: 48.7%;
      width: 57.5%;
      height: 12.6%;
    }

    .loc4 {
      left: 49.7%;
      top: 62.6%;
      width: 45.2%;
      height: 12.8%;
    }

    .loc5 {
      left: 9.7%;
      top: 74.1%;
      width: 59.5%;
      height: 13.6%;
    }

    .location-hotspot.locked {
      cursor: not-allowed;
    }

    .lock-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      pointer-events: none;
    }

    .location-hotspot.locked .lock-layer {
      display: flex;
    }

    .lock-badge {
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid rgba(238, 219, 127, 0.95);
      background: rgba(255,255,255,0.88);
      color: var(--violet);
      font-size: clamp(18px, 3vw, 30px);
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(126,69,158,0.16);
      white-space: nowrap;
    }

    .done-mark {
      position: absolute;
      right: 7%;
      top: 9%;
      z-index: 22;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid rgba(238, 219, 127, 0.95);
      background:
        radial-gradient(circle at 30% 25%, #ffffff, #fff0b8 40%, #95db9e 88%);
      color: #5b8f4b;
      font-size: 27px;
      line-height: 1;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 4px rgba(255,255,255,0.35),
        0 8px 18px rgba(79, 145, 82, 0.22);
      pointer-events: none;
    }

    .location-hotspot.completed .done-mark {
      display: flex;
    }

    .location-hotspot.unlocked:not(.completed)::after {
      content: "";
      position: absolute;
      inset: 6%;
      border-radius: 28px;
      border: 2px solid rgba(255, 236, 148, 0.78);
      box-shadow:
        0 0 14px rgba(255, 236, 148, 0.55),
        inset 0 0 18px rgba(255, 236, 148, 0.22);
      animation: activeGlow 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    .progress-overlay {
      position: absolute;
      left: 23%;
      right: 17%;
      bottom: 4.3%;
      z-index: 12;
      text-align: center;
      pointer-events: none;
    }

    .progress-text {
      margin: 0 0 10px;
      font-size: clamp(19px, 3.5vw, 33px);
      line-height: 1;
      font-weight: 700;
      color: var(--violet);
      text-shadow: 0 2px 0 rgba(255,255,255,0.75);
    }

    .progress-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 18px);
    }

    .progress-dot {
      width: clamp(18px, 3.6vw, 32px);
      height: clamp(18px, 3.6vw, 32px);
      border-radius: 50%;
      border: 2px solid rgba(188, 158, 204, 0.65);
      background: rgba(222, 209, 226, 0.72);
      box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.65),
        0 3px 7px rgba(126,69,158,0.16);
    }

    .progress-dot.active {
      border-color: rgba(238, 219, 127, 0.95);
      background:
        radial-gradient(circle at 30% 28%, #ffffff, #fff1b9 45%, #9e4bb8 92%);
      box-shadow:
        0 0 0 3px rgba(255, 232, 120, 0.35),
        0 0 16px rgba(255, 232, 120, 0.65),
        inset 0 2px 6px rgba(255,255,255,0.75);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(18px);
      z-index: 1000;
      max-width: calc(100% - 32px);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(117, 76, 150, 0.95);
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 24px rgba(117,76,150,0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    audio {
      display: none;
    }

    @keyframes activeGlow {
      0%, 100% {
        opacity: 0.45;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.018);
      }
    }

    @keyframes musicPulse {
      0%, 100% {
        opacity: 0.65;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.06);
      }
    }

    @media (max-width: 480px) {
      .done-mark {
        width: 32px;
        height: 32px;
        font-size: 22px;
      }

      .lock-badge {
        padding: 7px 12px;
      }

      .toast {
        font-size: 16px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio id="bgMusic" loop preload="auto">
    <source src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <main class="map-page">
    <section class="map-wrap" id="mapWrap">

      <img class="map-bg" src="map.png" alt="Карта чарівної подорожі Софійки">

      <button class="hotspot back-hotspot" type="button" id="backBtn" aria-label="Повернутися на головну"></button>

      <button class="hotspot music-hotspot" type="button" id="musicBtn" aria-label="Увімкнути або вимкнути музику"></button>

      <button class="hotspot location-hotspot loc1" type="button" data-location="1" aria-label="Локація 1 — Знайомство з Софійкою">
        <span class="done-mark">✓</span>
        <span class="lock-layer">
          <span class="lock-badge">🔒 Закрито</span>
        </span>
      </button>

      <button class="hotspot location-hotspot loc2" type="button" data-location="2" aria-label="Локація 2 — День хрещення">
        <span class="done-mark">✓</span>
        <span class="lock-layer">
          <span class="lock-badge">🔒 Закрито</span>
        </span>
      </button>

      <button class="hotspot location-hotspot loc3" type="button" data-location="3" aria-label="Локація 3 — Святковий замок">
        <span class="done-mark">✓</span>
        <span class="lock-layer">
          <span class="lock-badge">🔒 Закрито</span>
        </span>
      </button>

      <button class="hotspot location-hotspot loc4" type="button" data-location="4" aria-label="Локація 4 — Королівська трапеза">
        <span class="done-mark">✓</span>
        <span class="lock-layer">
          <span class="lock-badge">🔒 Закрито</span>
        </span>
      </button>

      <button class="hotspot location-hotspot loc5" type="button" data-location="5" aria-label="Локація 5 — Фінальне запрошення">
        <span class="done-mark">✓</span>
        <span class="lock-layer">
          <span class="lock-badge">🔒 Закрито</span>
        </span>
      </button>

      <div class="progress-overlay">
        <p class="progress-text" id="progressText">Відкрито 1 з 5 локацій</p>

        <div class="progress-dots">
          <span class="progress-dot" data-progress-dot></span>
          <span class="progress-dot" data-progress-dot></span>
          <span class="progress-dot" data-progress-dot></span>
          <span class="progress-dot" data-progress-dot></span>
          <span class="progress-dot" data-progress-dot></span>
        </div>
      </div>

    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const TOTAL_LOCATIONS = 5;

    const locationPages = {
      1: "location1.html",
      2: "location2.html",
      3: "location3.html",
      4: "location4.html",
      5: "location5.html"
    };

    const locationNames = {
      1: "Знайомство з Софійкою",
      2: "День хрещення",
      3: "Святковий замок",
      4: "Королівська трапеза",
      5: "Фінальне запрошення"
    };

    const backBtn = document.getElementById("backBtn");
    const musicBtn = document.getElementById("musicBtn");
    const bgMusic = document.getElementById("bgMusic");
    const toast = document.getElementById("toast");
    const progressText = document.getElementById("progressText");

    if (bgMusic) {
      bgMusic.volume = 0.35;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast._timer);

      showToast._timer = setTimeout(function() {
        toast.classList.remove("show");
      }, 2200);
    }

    function isLocationDone(number) {
      return localStorage.getItem("sofiyka_location" + number + "_done") === "true";
    }

    function isLocationUnlocked(number) {
      if (number === 1) return true;
      return isLocationDone(number - 1);
    }

    function getOpenedCount() {
      let opened = 0;

      for (let i = 1; i <= TOTAL_LOCATIONS; i++) {
        if (isLocationUnlocked(i)) {
          opened++;
        }
      }

      return Math.max(1, Math.min(opened, TOTAL_LOCATIONS));
    }

    function openLocation(number) {
      number = Number(number);

      if (!locationPages[number]) {
        showToast("Цю локацію ще не додано.");
        return;
      }

      if (!isLocationUnlocked(number)) {
        const previous = number - 1;
        showToast("Спочатку потрібно пройти локацію " + previous + " ✨");
        return;
      }

      window.location.href = locationPages[number];
    }

    function updateLocationState() {
      const cards = document.querySelectorAll("[data-location]");

      cards.forEach(function(card) {
        const number = Number(card.getAttribute("data-location"));
        const unlocked = isLocationUnlocked(number);
        const done = isLocationDone(number);

        card.classList.remove("locked", "unlocked", "completed");

        if (done) {
          card.classList.add("completed");
        } else if (unlocked) {
          card.classList.add("unlocked");
        } else {
          card.classList.add("locked");
        }
      });

      updateProgress();
    }

    function updateProgress() {
      const opened = getOpenedCount();

      if (progressText) {
        progressText.textContent = "Відкрито " + opened + " з " + TOTAL_LOCATIONS + " локацій";
      }

      const dots = document.querySelectorAll("[data-progress-dot]");

      dots.forEach(function(dot, index) {
        if (index < opened) {
          dot.classList.add("active");
        } else {
          dot.classList.remove("active");
        }
      });
    }

    function bindLocationClicks() {
      document.querySelectorAll("[data-location]").forEach(function(card) {
        card.addEventListener("click", function(event) {
          event.preventDefault();
          event.stopPropagation();

          const number = Number(card.getAttribute("data-location"));
          openLocation(number);
        });
      });
    }

    backBtn.addEventListener("click", function() {
      window.location.href = "index.html";
    });

    musicBtn.addEventListener("click", async function() {
      if (!bgMusic) return;

      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          musicBtn.classList.add("playing");
          localStorage.setItem("sofiyka_music", "on");
        } else {
          bgMusic.pause();
          musicBtn.classList.remove("playing");
          localStorage.setItem("sofiyka_music", "off");
        }
      } catch (error) {
        showToast("Музика не запустилась. Перевір mp3 файл 🎵");
      }
    });

    function restoreMusicState() {
      const musicState = localStorage.getItem("sofiyka_music");

      if (musicState === "on" && bgMusic) {
        bgMusic.play().then(function() {
          musicBtn.classList.add("playing");
        }).catch(function() {
          musicBtn.classList.remove("playing");
        });
      }
    }

    window.openLocation = openLocation;
    window.goToLocation = openLocation;

    bindLocationClicks();
    updateLocationState();
    restoreMusicState();
  </script>

</body>
</html>
