<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Карта подорожі Софійки</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #f8d9ef;
      color: #6f2f8b;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
        url("fon_location1.png") center top / cover no-repeat fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.55), transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(255,230,180,0.36), transparent 22%),
        radial-gradient(circle at 50% 90%, rgba(255,210,245,0.24), transparent 32%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.88) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(255,232,150,0.65) 0 1px, transparent 1.5px);
      background-size: 82px 110px, 132px 154px;
      background-position: 12px 18px, 46px 74px;
      opacity: 0.25;
      animation: pageSparkles 18s linear infinite;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      padding: 16px 0 40px;
    }

    .topbar {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 16px;
      padding: 4px 10px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .image-btn {
      width: 56px;
      height: 56px;
      border: none;
      background: transparent center / contain no-repeat;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 6px 10px rgba(80, 25, 110, 0.24));
      transition: transform .2s ease, filter .2s ease;
    }

    .image-btn:active {
      transform: scale(0.94);
    }

    .back-btn {
      background-image: url("5.png");
    }

    .music-btn {
      background-image: url("6.png");
    }

    .music-btn.playing {
      transform: scale(1.06);
      filter:
        drop-shadow(0 6px 10px rgba(80, 25, 110, 0.24))
        drop-shadow(0 0 10px rgba(255, 230, 150, 0.75));
    }

    .map-title {
      width: 56%;
      max-width: 270px;
      min-width: 178px;
      aspect-ratio: 420 / 145;
      background: url("8.png") center / contain no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #69228b;
      font-size: clamp(22px, 5.2vw, 34px);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      padding-top: 6px;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255,255,255,0.95);
    }

    .intro-card {
      width: calc(100% - 26px);
      max-width: 520px;
      margin: 10px auto 14px;
      padding: 22px 18px;
      border-radius: 34px;
      border: 2px solid rgba(238, 219, 127, 0.74);
      background:
        radial-gradient(circle at 50% 10%, rgba(255,245,210,0.36), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,0.68), rgba(255,246,253,0.50));
      box-shadow:
        0 10px 28px rgba(173, 117, 195, 0.15),
        inset 0 2px 12px rgba(255,255,255,0.55);
      text-align: center;
      backdrop-filter: blur(4px);
      animation: softBreath 5.8s ease-in-out infinite;
    }

    .intro-card h1 {
      margin-bottom: 8px;
      font-size: clamp(34px, 8vw, 52px);
      line-height: 0.95;
      color: #7e459e;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.88),
        0 6px 16px rgba(126,69,158,0.10);
    }

    .intro-card p {
      width: 92%;
      margin: 0 auto;
      font-size: clamp(20px, 5vw, 28px);
      line-height: 1.12;
      font-weight: 700;
      color: #6f438f;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    .progress-card {
      width: calc(100% - 34px);
      max-width: 420px;
      margin: 0 auto 18px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 2px solid rgba(238, 219, 127, 0.78);
      background: rgba(255,255,255,0.62);
      box-shadow:
        0 8px 18px rgba(120,70,150,0.12),
        inset 0 2px 8px rgba(255,255,255,0.55);
      text-align: center;
      font-size: clamp(21px, 5vw, 29px);
      font-weight: 700;
      color: #743092;
      backdrop-filter: blur(4px);
    }

    .locations-wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 12px 20px;
    }

    .locations-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .location-card {
      position: relative;
      min-height: 152px;
      border: none;
      border-radius: 34px;
      padding: 18px 18px 18px 132px;
      text-align: left;
      background:
        radial-gradient(circle at 16% 50%, rgba(255,240,180,0.42), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.70), rgba(255,244,253,0.54));
      border: 2px solid rgba(238,219,127,0.76);
      box-shadow:
        0 10px 26px rgba(120,70,150,0.16),
        inset 0 2px 10px rgba(255,255,255,0.62);
      cursor: pointer;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
      color: #6f2f8b;
      -webkit-tap-highlight-color: transparent;
      animation: cardFloat 5.2s ease-in-out infinite;
    }

    .location-card:nth-child(2) {
      animation-delay: .35s;
    }

    .location-card:nth-child(3) {
      animation-delay: .7s;
    }

    .location-card:nth-child(4) {
      animation-delay: 1.05s;
    }

    .location-card:nth-child(5) {
      animation-delay: 1.4s;
    }

    .location-card::before {
      content: "";
      position: absolute;
      top: -45%;
      left: -80%;
      width: 42%;
      height: 190%;
      transform: rotate(18deg);
      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,255,255,0.08) 18%,
          rgba(255,255,255,0.58) 50%,
          rgba(255,255,255,0.08) 82%,
          transparent 100%
        );
      opacity: 0;
      pointer-events: none;
      animation: cardShine 7s ease-in-out infinite;
    }

    .location-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.86) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(255,232,150,0.62) 0 1px, transparent 1.5px);
      background-size: 90px 120px, 138px 164px;
      background-position: 18px 28px, 64px 86px;
      opacity: 0.14;
    }

    .location-card:active {
      transform: scale(0.985);
    }

    .location-card.locked {
      filter: grayscale(0.55);
      opacity: 0.72;
      animation: none;
    }

    .location-card.locked::before {
      display: none;
    }

    .location-card.done {
      border-color: rgba(255, 218, 90, 0.95);
      box-shadow:
        0 0 0 2px rgba(255, 225, 120, 0.38),
        0 12px 28px rgba(120,70,150,0.16),
        0 0 22px rgba(255, 225, 120, 0.28),
        inset 0 2px 10px rgba(255,255,255,0.66);
    }

    .location-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      width: 92px;
      height: 92px;
      transform: translateY(-50%);
      border-radius: 50%;
      border: 2px solid rgba(238,219,127,0.9);
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), rgba(255,245,222,0.92) 38%, rgba(236,202,116,0.88) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 43px;
      box-shadow:
        0 0 0 5px rgba(255,245,200,0.26),
        0 8px 18px rgba(120,70,150,0.15),
        inset 0 2px 12px rgba(255,255,255,0.76);
      z-index: 2;
    }

    .location-number {
      position: absolute;
      left: 78px;
      top: 22px;
      min-width: 34px;
      height: 34px;
      padding: 0 9px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff8e4, #f0c86e);
      border: 1.5px solid rgba(255,255,255,0.8);
      color: #743092;
      font-size: 22px;
      font-weight: 700;
      line-height: 31px;
      text-align: center;
      box-shadow: 0 4px 9px rgba(90,35,120,0.16);
      z-index: 4;
    }

    .location-content {
      position: relative;
      z-index: 3;
    }

    .location-name {
      margin-bottom: 4px;
      font-size: clamp(27px, 6vw, 36px);
      line-height: 1;
      font-weight: 700;
      color: #743092;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    .location-desc {
      font-size: clamp(18px, 4.4vw, 24px);
      line-height: 1.05;
      font-weight: 700;
      color: #7c4b91;
      text-shadow: 0 1px 0 rgba(255,255,255,0.72);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 9px;
      min-height: 30px;
      padding: 5px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,0.62);
      border: 1.5px solid rgba(238,219,127,0.66);
      font-size: 18px;
      font-weight: 700;
      color: #743092;
      box-shadow: inset 0 1px 6px rgba(255,255,255,0.66);
    }

    .location-card.locked .status-pill {
      color: #8a7790;
    }

    .location-card.done .status-pill {
      background: linear-gradient(180deg, #fff9e8, #f4d780);
      color: #743092;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 99999;
      transform: translateX(-50%) translateY(20px);
      width: calc(100% - 32px);
      max-width: 430px;
      padding: 13px 18px;
      border-radius: 999px;
      background: rgba(117,76,150,0.95);
      color: #ffffff;
      font-size: 20px;
      line-height: 1.05;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 24px rgba(117,76,150,0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    audio {
      display: none;
    }

    @keyframes pageSparkles {
      0% {
        background-position: 12px 18px, 46px 74px;
      }

      100% {
        background-position: 12px 130px, 46px 228px;
      }
    }

    @keyframes softBreath {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-3px) scale(1.004);
      }
    }

    @keyframes cardFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-3px) scale(1.004);
      }
    }

    @keyframes cardShine {
      0% {
        left: -80%;
        opacity: 0;
      }

      12% {
        opacity: 0.42;
      }

      34% {
        left: 130%;
        opacity: 0;
      }

      100% {
        left: 130%;
        opacity: 0;
      }
    }

    @media (max-width: 420px) {
      body {
        background-attachment: scroll;
      }

      .topbar {
        padding-left: 8px;
        padding-right: 8px;
      }

      .image-btn {
        width: 54px;
        height: 54px;
      }

      .map-title {
        width: 57%;
        min-width: 172px;
        font-size: clamp(20px, 5vw, 30px);
      }

      .intro-card {
        padding: 20px 14px;
      }

      .location-card {
        min-height: 146px;
        padding-left: 122px;
        padding-right: 14px;
      }

      .location-icon {
        width: 84px;
        height: 84px;
        left: 16px;
        font-size: 39px;
      }

      .location-number {
        left: 72px;
        top: 22px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio id="bgMusic" loop preload="auto">
    <source src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <main class="page">

    <header class="topbar">
      <button class="image-btn back-btn" type="button" id="backBtn" aria-label="Назад"></button>
      <div class="map-title">Карта</div>
      <button class="image-btn music-btn" type="button" id="musicBtn" aria-label="Музика"></button>
    </header>

    <section class="intro-card">
      <h1>Подорож Софійки</h1>
      <p>
        Проходь чарівні локації по черзі та відкривай головне запрошення.
      </p>
    </section>

    <div class="progress-card" id="progressText">
      Відкрито 1 з 5 локацій
    </div>

    <section class="locations-wrap">
      <div class="locations-grid" id="locationsGrid">

        <button class="location-card" type="button" data-location="1" data-href="location1.html">
          <div class="location-icon">👶</div>
          <div class="location-number">1</div>
          <div class="location-content">
            <div class="location-name">Знайомство із Софійкою</div>
            <div class="location-desc">Обери наймиліші фото маленької принцеси.</div>
            <div class="status-pill">Відкрита</div>
          </div>
        </button>

        <button class="location-card" type="button" data-location="2" data-href="location2.html">
          <div class="location-icon">⛪</div>
          <div class="location-number">2</div>
          <div class="location-content">
            <div class="location-name">День хрещення</div>
            <div class="location-desc">Знайди храм і відкрий наступний шлях.</div>
            <div class="status-pill">Закрито</div>
          </div>
        </button>

        <button class="location-card" type="button" data-location="3" data-href="location3.html">
          <div class="location-icon">🏰</div>
          <div class="location-number">3</div>
          <div class="location-content">
            <div class="location-name">Святковий замок</div>
            <div class="location-desc">Знайди місце святкування на карті.</div>
            <div class="status-pill">Закрито</div>
          </div>
        </button>

        <button class="location-card" type="button" data-location="4" data-href="location4.html">
          <div class="location-icon">🍽️</div>
          <div class="location-number">4</div>
          <div class="location-content">
            <div class="location-name">Королівська трапеза</div>
            <div class="location-desc">Заповни анкету для святкового столу.</div>
            <div class="status-pill">Закрито</div>
          </div>
        </button>

        <button class="location-card" type="button" data-location="5" data-href="location5.html">
          <div class="location-icon">💌</div>
          <div class="location-number">5</div>
          <div class="location-content">
            <div class="location-name">Фінальне запрошення</div>
            <div class="location-desc">Відкрий чарівний конвертик Софійки.</div>
            <div class="status-pill">Закрито</div>
          </div>
        </button>

      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script>
    const backBtn = document.getElementById("backBtn");
    const musicBtn = document.getElementById("musicBtn");
    const bgMusic = document.getElementById("bgMusic");
    const progressText = document.getElementById("progressText");
    const toast = document.getElementById("toast");
    const locationCards = document.querySelectorAll(".location-card");

    if (bgMusic) {
      bgMusic.volume = 0.35;
    }

    const locations = [
      {
        number: 1,
        href: "location1.html",
        doneKey: "sofiyka_location1_done",
        unlockCondition: function() {
          return true;
        }
      },
      {
        number: 2,
        href: "location2.html",
        doneKey: "sofiyka_location2_done",
        unlockCondition: function() {
          return localStorage.getItem("sofiyka_location1_done") === "true";
        }
      },
      {
        number: 3,
        href: "location3.html",
        doneKey: "sofiyka_location3_done",
        unlockCondition: function() {
          return localStorage.getItem("sofiyka_location2_done") === "true";
        }
      },
      {
        number: 4,
        href: "location4.html",
        doneKey: "sofiyka_location4_done",
        unlockCondition: function() {
          return localStorage.getItem("sofiyka_location3_done") === "true";
        }
      },
      {
        number: 5,
        href: "location5.html",
        doneKey: "sofiyka_location5_done",
        unlockCondition: function() {
          return localStorage.getItem("sofiyka_location4_done") === "true";
        }
      }
    ];

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast._timer);

      showToast._timer = setTimeout(function() {
        toast.classList.remove("show");
      }, 2200);
    }

    function isLocationUnlocked(number) {
      const location = locations.find(function(item) {
        return item.number === number;
      });

      if (!location) return false;

      return location.unlockCondition();
    }

    function isLocationDone(number) {
      const location = locations.find(function(item) {
        return item.number === number;
      });

      if (!location) return false;

      return localStorage.getItem(location.doneKey) === "true";
    }

    function getLockedMessage(number) {
      if (number === 2) {
        return "Спочатку пройди Локацію 1 ❤️";
      }

      if (number === 3) {
        return "Спочатку пройди Локацію 2 ✨";
      }

      if (number === 4) {
        return "Спочатку пройди Локацію 3 👑";
      }

      if (number === 5) {
        return "Спочатку пройди Локацію 4 🍽️";
      }

      return "Ця локація ще закрита ✨";
    }

    function updateMapState() {
      let openedCount = 0;

      locationCards.forEach(function(card) {
        const number = Number(card.getAttribute("data-location"));
        const status = card.querySelector(".status-pill");
        const unlocked = isLocationUnlocked(number);
        const done = isLocationDone(number);

        card.classList.remove("locked");
        card.classList.remove("done");

        if (unlocked) {
          openedCount++;
          card.disabled = false;

          if (done) {
            card.classList.add("done");
            status.textContent = "Пройдено ✓";
          } else {
            status.textContent = "Відкрита";
          }
        } else {
          card.classList.add("locked");
          card.disabled = false;
          status.textContent = "Закрито";
        }
      });

      progressText.textContent = "Відкрито " + openedCount + " з 5 локацій";
    }

    function goToLocation(number, href) {
      if (!isLocationUnlocked(number)) {
        showToast(getLockedMessage(number));
        return;
      }

      window.location.href = href;
    }

    locationCards.forEach(function(card) {
      card.addEventListener("click", function() {
        const number = Number(card.getAttribute("data-location"));
        const href = card.getAttribute("data-href");

        goToLocation(number, href);
      });
    });

    backBtn.addEventListener("click", function() {
      window.location.href = "index.html";
    });

    musicBtn.addEventListener("click", async function() {
      if (!bgMusic) return;

      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          musicBtn.classList.add("playing");
          localStorage.setItem("sofiyka_music", "on");
        } else {
          bgMusic.pause();
          musicBtn.classList.remove("playing");
          localStorage.setItem("sofiyka_music",
