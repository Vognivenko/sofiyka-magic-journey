<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Карта чарівної подорожі Софійки</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #efd8ff;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.9), transparent 18%),
        linear-gradient(180deg, #ffe3f7 0%, #eadcff 45%, #d8edff 100%);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 10px 8px 28px;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 9999;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .round-btn {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      pointer-events: auto !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-decoration: none;
      background:
        radial-gradient(circle at 30% 22%, #ffffff 0%, #fff9df 22%, #ffe78e 47%, #f6bf52 74%, #c98224 100%);
      box-shadow:
        0 0 0 2px rgba(255, 255, 245, 0.96),
        0 0 0 5px rgba(255, 222, 106, 0.58),
        0 0 18px rgba(255, 231, 132, 0.92),
        0 0 34px rgba(213, 148, 255, 0.38),
        0 9px 20px rgba(83, 31, 105, 0.28),
        inset 0 5px 8px rgba(255, 255, 255, 0.98),
        inset 0 -8px 13px rgba(131, 73, 22, 0.18);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .round-btn::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.82);
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,0.52), rgba(255,255,255,0.08) 38%, transparent 72%);
      pointer-events: none;
      z-index: 1;
    }

    .round-btn::after {
      content: "";
      position: absolute;
      top: -35%;
      left: -85%;
      width: 58%;
      height: 175%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.72),
        transparent
      );
      transform: rotate(25deg);
      animation: buttonShine 5.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 3;
    }

    .round-btn .icon-wrap {
      position: relative;
      z-index: 4;
      width: 31px;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      filter:
        drop-shadow(0 1px 0 rgba(255,255,255,0.95))
        drop-shadow(0 2px 4px rgba(92, 31, 112, 0.28));
    }

    .round-btn svg {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .round-btn .icon-main {
      fill: #7d3f97;
    }

    .round-btn .icon-light {
      fill: rgba(255,255,255,0.72);
    }

    .round-btn:active {
      transform: scale(0.94);
    }

    .round-btn.playing {
      animation: buttonBreath 2.8s ease-in-out infinite;
    }

    .round-btn.off {
      background:
        radial-gradient(circle at 30% 22%, #ffffff 0%, #f5e1ff 25%, #d69cff 55%, #9a5ac0 82%, #6d318f 100%);
      box-shadow:
        0 0 0 2px rgba(255, 250, 255, 0.96),
        0 0 0 5px rgba(215, 160, 255, 0.52),
        0 0 18px rgba(210, 145, 255, 0.84),
        0 0 34px rgba(255, 225, 128, 0.24),
        0 9px 20px rgba(83, 31, 105, 0.28),
        inset 0 5px 8px rgba(255, 255, 255, 0.86),
        inset 0 -8px 13px rgba(72, 25, 102, 0.22);
    }

    .round-btn.off .icon-main {
      fill: #ffffff;
    }

    .map-wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255,255,255,0.2);
      box-shadow:
        0 0 24px rgba(255, 220, 120, 0.5),
        0 18px 40px rgba(70, 25, 90, 0.26);
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none !important;
    }

    .map-header {
      position: absolute;
      top: 5.2%;
      left: 13%;
      right: 13%;
      z-index: 20;
      text-align: center;
      pointer-events: none;
    }

    .map-title {
      font-size: clamp(32px, 7.2vw, 50px);
      line-height: 0.9;
      font-weight: 700;
      color: #7d3f97;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.88),
        0 4px 7px rgba(70, 30, 100, 0.25),
        0 0 16px rgba(255, 235, 180, 0.75);
    }

    .map-subtitle {
      margin-top: 9px;
      font-size: clamp(13px, 3vw, 18px);
      font-weight: 700;
      color: #74418a;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    .spark {
      position: absolute;
      z-index: 8;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,242,171,0.95) 35%, rgba(255,242,171,0) 72%);
      box-shadow: 0 0 18px rgba(255, 235, 150, 0.95);
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255,245,190,0.95);
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .spark::before {
      width: 2px;
      height: 25px;
    }

    .spark::after {
      width: 25px;
      height: 2px;
    }

    .s1 { top: 14%; left: 25%; animation-delay: 0s; }
    .s2 { top: 26%; right: 20%; animation-delay: .7s; }
    .s3 { top: 50%; left: 21%; animation-delay: 1.2s; }
    .s4 { top: 69%; right: 18%; animation-delay: .5s; }
    .s5 { bottom: 14%; left: 57%; animation-delay: 1.5s; }

    .location {
      position: absolute;
      z-index: 100;
      display: block;
      border: none;
      background-color: rgba(255, 0, 0, 0);
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      cursor: pointer;
      pointer-events: auto !important;
      transform-origin: center center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      appearance: none;
      -webkit-appearance: none;
      transition:
        opacity .35s ease,
        filter .35s ease,
        transform .25s ease;
    }

    .location.next {
      opacity: 1;
      filter:
        brightness(1.13)
        contrast(1.1)
        saturate(1.18)
        drop-shadow(0 11px 15px rgba(88, 35, 110, 0.28))
        drop-shadow(0 0 22px rgba(255, 225, 120, 0.96));
    }

    .location.opened {
      opacity: 1;
      filter:
        brightness(1.1)
        contrast(1.08)
        saturate(1.14)
        drop-shadow(0 10px 14px rgba(88, 35, 110, 0.25))
        drop-shadow(0 0 18px rgba(255, 225, 120, 0.86));
    }

    .location.locked {
      opacity: 0.68;
      filter:
        grayscale(0.45)
        saturate(0.62)
        brightness(0.96)
        contrast(0.94)
        drop-shadow(0 5px 7px rgba(70, 35, 90, 0.12));
      animation: none;
    }

    .location1 {
      left: 8.5%;
      top: 21%;
      width: 54%;
      height: 16.5%;
      background-image: url("location1.png");
      animation: pulse1 2.4s ease-in-out infinite;
    }

    .location2 {
      left: 39.2%;
      top: 36.5%;
      width: 53%;
      height: 13.6%;
      background-image: url("location2.png");
      animation: pulse2 2.8s ease-in-out infinite;
    }

    .location3 {
      left: 8.3%;
      top: 50.6%;
      width: 50%;
      height: 12.8%;
      background-image: url("location3.png");
      animation: float3 3.1s ease-in-out infinite;
    }

    .location4 {
      left: 39%;
      top: 63.6%;
      width: 53%;
      height: 13.6%;
      background-image: url("location4.png");
      animation: cake4 2.7s ease-in-out infinite;
    }

    .location5 {
      left: 7.7%;
      top: 74.2%;
      width: 51%;
      height: 13.1%;
      background-image: url("location5.png");
      animation: heart5 2.45s ease-in-out infinite;
    }

    .location:active {
      transform: scale(0.98);
    }

    .progress-btn {
      position: absolute;
      left: 50%;
      bottom: 1.25%;
      width: 58%;
      max-width: 300px;
      min-height: 55px;
      z-index: 120;
      transform: translateX(-50%);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      pointer-events: auto !important;
      padding: 7px 14px 7px 54px;
      background:
        linear-gradient(180deg, rgba(255, 248, 253, 0.96), rgba(246, 223, 255, 0.94));
      box-shadow:
        0 0 0 2px rgba(255, 227, 135, 0.88),
        0 0 12px rgba(255, 225, 120, 0.50),
        0 8px 16px rgba(80, 30, 100, 0.17),
        inset 0 3px 7px rgba(255,255,255,0.92),
        inset 0 -5px 10px rgba(140,80,160,0.08);
      animation: progressFloat 5.2s ease-in-out infinite;
      font-family: 'Cormorant Garamond', serif;
      touch-action: manipulation;
    }

    .progress-btn::before {
      content: "👑";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 37px;
      height: 37px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background:
        radial-gradient(circle at 35% 25%, #ffffff 0%, #fff2c8 42%, #d9a7ff 100%);
      box-shadow:
        0 0 0 2px rgba(255, 224, 120, 0.85),
        0 0 8px rgba(255, 219, 105, 0.50),
        inset 0 3px 5px rgba(255,255,255,0.9);
    }

    .progress-btn::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.65);
      pointer-events: none;
    }

    .progress-overlay {
      position: relative;
      z-index: 2;
      display: block;
      color: #7d3f97;
      font-weight: 700;
      font-size: clamp(14px, 3.2vw, 18px);
      line-height: 1;
      white-space: nowrap;
      text-align: center;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.95),
        0 2px 4px rgba(100, 45, 120, 0.16);
      pointer-events: none;
      margin-top: 1px;
    }

    .progress-dots {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
      pointer-events: none;
    }

    .progress-dot {
      width: 8.5px;
      height: 8.5px;
      border-radius: 50%;
      background: rgba(152, 118, 174, 0.35);
      box-shadow:
        inset 0 1px 2px rgba(80, 30, 100, 0.18),
        0 0 0 1px rgba(255,255,255,0.65);
    }

    .progress-dot.opened {
      background:
        radial-gradient(circle at 35% 30%, #fff6d8 0%, #d891ff 45%, #7d3f97 100%);
      box-shadow:
        0 0 0 2px rgba(255,231,136,0.72),
        0 0 10px rgba(255,218,116,0.9);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(76,39,98,0.42);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 30px;
      padding: 25px 22px 22px;
      background:
        linear-gradient(180deg, rgba(255,250,252,0.98), rgba(252,241,255,0.98));
      box-shadow:
        0 16px 42px rgba(100,52,128,0.30),
        0 0 0 2px rgba(255,242,200,0.75);
      animation: modalIn .3s ease both;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #fffdf8 0%, #fff0db 55%, #f4d8ff 100%);
      color: #7d3f97;
      font-size: 24px;
      cursor: pointer;
      box-shadow:
        0 0 0 2px rgba(250,220,119,0.8),
        0 6px 16px rgba(143,82,173,0.22);
    }

    .modal-title {
      color: #8b53a8;
      font-size: 28px;
      line-height: 1.12;
      text-align: center;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .modal-text {
      color: #70407f;
      font-size: 20px;
      line-height: 1.45;
      text-align: center;
    }

    .modal-text p + p {
      margin-top: 10px;
    }

    .hint {
      margin-top: 14px;
      text-align: center;
      font-size: 15px;
      color: #9b78a8;
    }

    .modal-action {
      margin-top: 16px;
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 700;
      color: #7d3f97;
      background:
        linear-gradient(180deg, #fff7da 0%, #ffd86f 48%, #f3b84d 100%);
      box-shadow:
        0 0 0 2px rgba(255,235,160,0.9),
        0 8px 16px rgba(90,35,115,0.18),
        inset 0 2px 5px rgba(255,255,255,0.8);
      cursor: pointer;
    }

    @keyframes buttonBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }

    @keyframes buttonShine {
      0% { left: -85%; opacity: 0; }
      18% { opacity: 0.9; }
      34% { left: 125%; opacity: 0; }
      100% { left: 125%; opacity: 0; }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.8); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes pulse1 {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes pulse2 {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.03); }
    }

    @keyframes float3 {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.035); }
    }

    @keyframes cake4 {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-4px) scale(1.035); }
      60% { transform: translateY(-2px) scale(1.02); }
    }

    @keyframes heart5 {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.035); }
      50% { transform: scale(1.065); }
      68% { transform: scale(1.025); }
    }

    @keyframes progressFloat {
      0%, 100% {
        transform: translateX(-50%) translateY(0) scale(1);
      }
      50% {
        transform: translateX(-50%) translateY(-1px) scale(1.002);
      }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 430px) {
      .round-btn {
        width: 56px;
        height: 56px;
      }

      .round-btn .icon-wrap {
        width: 29px;
        height: 29px;
      }

      .topbar {
        top: 12px;
        left: 12px;
        right: 12px;
      }

      .map-title {
        font-size: clamp(31px, 7.1vw, 45px);
      }

      .map-subtitle {
        font-size: clamp(13px, 2.9vw, 17px);
      }

      .progress-btn {
        width: 58%;
        bottom: 1.35%;
        min-height: 54px;
        padding-left: 53px;
      }

      .progress-btn::before {
        width: 36px;
        height: 36px;
        font-size: 21px;
      }

      .progress-overlay {
        font-size: clamp(13px, 3.1vw, 17px);
      }

      .progress-dot {
        width: 8px;
        height: 8px;
      }

      .modal-title {
        font-size: 25px;
      }

      .modal-text {
        font-size: 18px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio
    id="bgMusic"
    src="./solarflex-magic-fantasy-fairy-tale-music-495646.mp3"
    loop
    preload="auto">
  </audio>

  <main class="page">
    <div class="topbar">
      <a id="backBtn" class="round-btn" href="index.html" aria-label="Назад">
        <span class="icon-wrap">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path class="icon-light" d="M31 11c-2.3 0-4.2 1.9-4.2 4.2v5.1L13.4 32l13.4 11.7v5.1c0 2.3 1.9 4.2 4.2 4.2 1 0 2-.4 2.8-1.1l21-18.2c1-.9 1.6-2.2 1.6-3.7s-.6-2.8-1.6-3.7l-21-18.2c-.8-.7-1.8-1.1-2.8-1.1Z"/>
            <path class="icon-main" d="M29.7 15.5c1.1 0 2.1.9 2.1 2.1v7.7h19.1c1.6 0 2.9 1.3 2.9 2.9v7.6c0 1.6-1.3 2.9-2.9 2.9H31.8v7.7c0 1.8-2.2 2.8-3.6 1.6L10.5 33.5c-1-.8-1-2.3 0-3.1l17.7-14.4c.4-.3.9-.5 1.5-.5Z"/>
          </svg>
        </span>
      </a>

      <button id="musicToggle" class="round-btn off" type="button" aria-label="Увімкнути музику" onclick="toggleMusic(event)">
        <span class="icon-wrap">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path class="icon-light" d="M45.8 9.5c-1.1-.8-2.5-1-3.8-.5L24.6 15.1c-1.7.6-2.8 2.2-2.8 4v25.2c-1.7-.8-3.8-1.2-6-.8-5.2.8-9.1 4.8-8.6 8.8.5 4.1 5.1 6.7 10.3 5.9 4.8-.8 8.5-4.2 8.6-8V27.1l17.8-6.2v17.3c-1.7-.8-3.8-1.2-6-.8-5.2.8-9.1 4.8-8.6 8.8.5 4.1 5.1 6.7 10.3 5.9 4.9-.8 8.6-4.3 8.6-8.2V13c0-1.4-.7-2.7-1.8-3.5Z"/>
            <path class="icon-main" d="M45.7 8.9c1.5 0 2.8 1.2 2.8 2.8v31.2c0 4.4-4 8.4-9.4 9.2-5.2.8-9.7-1.8-10.1-5.8-.4-4 3.5-7.8 8.7-8.6 2.1-.3 4.2 0 5.9.8V21.1L25.5 27v22.8c0 4.4-4 8.4-9.4 9.2-5.2.8-9.7-1.8-10.1-5.8-.4-4 3.5-7.8 8.7-8.6 2.1-.3 4.2 0 5.9.8V18.9c0-1.2.8-2.3 2-2.7l22.2-7.1c.3-.1.6-.2.9-.2Z"/>
          </svg>
        </span>
      </button>
    </div>

    <section class="map-wrap">
      <img class="map-image" src="map.png" alt="Карта чарівної подорожі Софійки" />

      <div class="map-header">
        <div class="map-title">Карта чарівної<br>подорожі</div>
        <div class="map-subtitle">Пройди локації та знайди запрошення Софійки</div>
      </div>

      <div class="spark s1"></div>
      <div class="spark s2"></div>
      <div class="spark s3"></div>
      <div class="spark s4"></div>
      <div class="spark s5"></div>

      <button class="location location1 next" id="loc1" type="button" aria-label="Знайомство з Софійкою" onclick="clickLocation(event, 1)"></button>
      <button class="location location2 locked" id="loc2" type="button" aria-label="День хрещення" onclick="clickLocation(event, 2)"></button>
      <button class="location location3 locked" id="loc3" type="button" aria-label="Святковий замок" onclick="clickLocation(event, 3)"></button>
      <button class="location location4 locked" id="loc4" type="button" aria-label="Королівська трапеза" onclick="clickLocation(event, 4)"></button>
      <button class="location location5 locked" id="loc5" type="button" aria-label="Підтвердження" onclick="clickLocation(event, 5)"></button>

      <button class="progress-btn" id="progressPanel" type="button" aria-label="Прогрес відкритих локацій" onclick="showProgress(event)">
        <div class="progress-overlay" id="progressText">Відкрито 0 з 5</div>
        <div class="progress-dots">
          <span class="progress-dot" data-dot="1"></span>
          <span class="progress-dot" data-dot="2"></span>
          <span class="progress-dot" data-dot="3"></span>
          <span class="progress-dot" data-dot="4"></span>
          <span class="progress-dot" data-dot="5"></span>
        </div>
      </button>
    </section>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <button class="modal-close" id="closeModal" aria-label="Закрити" onclick="closeCurrentModal(event)">×</button>
