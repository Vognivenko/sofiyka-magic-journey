<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Карта чарівної подорожі Софійки</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #efd8ff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.9), transparent 18%),
        radial-gradient(circle at 85% 18%, rgba(255,220,245,0.65), transparent 22%),
        linear-gradient(180deg, #ffe3f7 0%, #eadcff 45%, #d8edff 100%);
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 10px 8px 26px;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .round-btn {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background:
        radial-gradient(circle at 32% 26%, #ffffff 0%, #fff7df 34%, #ffd983 68%, #d79a2f 100%);
      color: #6c2f86;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      box-shadow:
        0 0 0 3px rgba(255, 246, 205, 0.78),
        0 0 0 6px rgba(255, 210, 94, 0.35),
        0 0 18px rgba(255, 222, 116, 0.95),
        0 8px 18px rgba(92, 42, 120, 0.28),
        inset 0 3px 5px rgba(255,255,255,0.92),
        inset 0 -6px 10px rgba(139, 83, 18, 0.20);
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .round-btn::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 22%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 45%, transparent 70%);
      pointer-events: none;
    }

    .round-btn::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid rgba(255, 239, 170, 0.65);
      box-shadow: 0 0 18px rgba(255, 230, 125, 0.75);
      pointer-events: none;
    }

    .round-btn span {
      position: relative;
      z-index: 2;
      transform: translateY(-1px);
      text-shadow:
        0 1px 0 rgba(255,255,255,0.8),
        0 2px 5px rgba(90, 35, 100, 0.35);
    }

    .round-btn:active {
      transform: scale(0.94);
      filter: brightness(1.04);
    }

    .round-btn.playing {
      animation: musicPulse 1.9s ease-in-out infinite;
    }

    .round-btn.off {
      background:
        radial-gradient(circle at 32% 26%, #ffffff 0%, #f5e9ff 38%, #d9b7ff 70%, #9d65c9 100%);
      color: #ffffff;
    }

    .map-wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 0 24px rgba(255, 220, 120, 0.5),
        0 18px 40px rgba(70, 25, 90, 0.26);
      animation: mapAppear 0.9s ease both;
      background: rgba(255,255,255,0.22);
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .map-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.08) 0%,
          rgba(255,255,255,0) 28%,
          rgba(70,20,90,0.06) 100%
        );
      z-index: 2;
    }

    .map-header {
      position: absolute;
      top: 5.6%;
      left: 12%;
      right: 12%;
      z-index: 11;
      text-align: center;
      pointer-events: none;
      animation: headerAppear 1.1s ease both;
    }

    .map-title {
      font-size: clamp(37px, 8.4vw, 58px);
      line-height: 0.88;
      font-weight: 700;
      color: #7d3f97;
      letter-spacing: 0.3px;
      text-shadow:
        0 2px 0 rgba(255,255,255,0.86),
        0 4px 6px rgba(78, 35, 105, 0.22),
        0 0 16px rgba(255, 235, 180, 0.78);
    }

    .map-subtitle {
      margin-top: 12px;
      font-size: clamp(15px, 3.4vw, 22px);
      line-height: 1.1;
      font-weight: 700;
      color: #74418a;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.9),
        0 0 8px rgba(255,255,255,0.65);
    }

    .progress-panel {
      position: absolute;
      left: 50%;
      bottom: 4.2%;
      transform: translateX(-50%);
      z-index: 14;
      width: 72%;
      max-width: 365px;
      border: none;
      border-radius: 28px;
      padding: 10px 14px 12px;
      background:
        linear-gradient(180deg, rgba(255,248,253,0.94), rgba(244,222,255,0.92));
      box-shadow:
        0 0 0 2px rgba(255, 230, 145, 0.88),
        0 0 18px rgba(255, 224, 120, 0.78),
        0 10px 24px rgba(90, 35, 115, 0.22),
        inset 0 2px 7px rgba(255,255,255,0.86);
      color: #794295;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      animation: progressGlow 2.8s ease-in-out infinite;
    }

    .progress-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-crown {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background:
        radial-gradient(circle at 34% 25%, #ffffff 0%, #fff0c8 44%, #d9b3ff 100%);
      box-shadow:
        0 0 0 2px rgba(255, 227, 130, 0.78),
        0 0 14px rgba(255, 220, 110, 0.8),
        inset 0 3px 5px rgba(255,255,255,0.9);
    }

    .progress-text-wrap {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .progress-text {
      font-size: clamp(18px, 4.2vw, 25px);
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.9),
        0 2px 4px rgba(100, 45, 120, 0.18);
    }

    .progress-dots {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(158, 128, 180, 0.32);
      box-shadow:
        inset 0 1px 2px rgba(80, 30, 100, 0.18),
        0 0 0 1px rgba(255,255,255,0.58);
    }

    .progress-dot.opened {
      background:
        radial-gradient(circle at 35% 30%, #fff6d8 0%, #d891ff 45%, #7d3f97 100%);
      box-shadow:
        0 0 0 2px rgba(255, 231, 136, 0.7),
        0 0 10px rgba(255, 218, 116, 0.9);
    }

    .lights-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,242,171,0.95) 35%, rgba(255,242,171,0) 72%);
      box-shadow: 0 0 18px rgba(255, 235, 150, 0.95);
      opacity: 0.78;
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255, 245, 190, 0.95);
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .spark::before {
      width: 2px;
      height: 25px;
    }

    .spark::after {
      width: 25px;
      height: 2px;
    }

    .spark.s1 { top: 8%;  left: 22%; animation-delay: 0s; }
    .spark.s2 { top: 14%; right: 18%; animation-delay: .8s; }
    .spark.s3 { top: 31%; left: 46%; animation-delay: 1.4s; }
    .spark.s4 { top: 48%; right: 14%; animation-delay: .4s; }
    .spark.s5 { top: 66%; left: 20%; animation-delay: 1.2s; }
    .spark.s6 { bottom: 16%; left: 58%; animation-delay: 1.8s; }
    .spark.s7 { bottom: 10%; right: 26%; animation-delay: .6s; }

    .location-btn {
      position: absolute;
      z-index: 12;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transform-origin: center center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .location-img {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .location1-btn {
      left: 8.7%;
      top: 19.2%;
      width: 58%;
      animation: locationPulse1 2.4s ease-in-out infinite;
      filter:
        drop-shadow(0 10px 14px rgba(88, 35, 110, 0.22))
        drop-shadow(0 0 14px rgba(255, 225, 120, 0.72));
    }

    .location1-btn::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 26% 48%, rgba(255,255,255,0.48), rgba(255,229,124,0.24) 35%, transparent 64%);
      opacity: 0;
      animation: locationGlow1 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    .location1-btn::after {
      content: "";
      position: absolute;
      left: 19%;
      top: 51%;
      width: 36%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid rgba(255, 235, 135, 0.72);
      transform: translate(-50%, -50%);
      animation: locationRing1 2.1s ease-out infinite;
      pointer-events: none;
      box-shadow: 0 0 18px rgba(255, 229, 125, 0.7);
    }

    .location2-btn {
      left: 39.3%;
      top: 37.7%;
      width: 55%;
      animation: locationPulse2 2.8s ease-in-out infinite;
      filter:
        drop-shadow(0 10px 14px rgba(88, 35, 110, 0.20))
        drop-shadow(0 0 12px rgba(207, 184, 255, 0.62));
    }

    .location2-btn::before {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 23% 48%, rgba(255,255,255,0.45), rgba(210,185,255,0.30) 36%, transparent 66%);
      opacity: 0;
      animation: locationGlow2 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    .location2-btn::after {
      content: "";
      position: absolute;
      left: 19%;
      top: 50%;
      width: 34%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid rgba(235, 215, 255, 0.80);
      transform: translate(-50%, -50%);
      animation: locationRing2 2.35s ease-out infinite;
      pointer-events: none;
      box-shadow:
        0 0 16px rgba(210, 185, 255, 0.82),
        0 0 26px rgba(255, 235, 160, 0.34);
    }

    .location3-btn {
      left: 7.6%;
      top: 51.2%;
      width: 56%;
      animation: locationFloat3 3.1s ease-in-out infinite;
      filter:
        drop-shadow(0 12px 15px rgba(88, 35, 110, 0.22))
        drop-shadow(0 0 12px rgba(255, 217, 132, 0.62));
    }

    .location3-btn::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 24% 48%, rgba(255,255,255,0.48), rgba(255,218,140,0.28) 36%, transparent 66%);
      opacity: 0;
      animation: locationGlow3 3.1s ease-in-out infinite;
      pointer-events: none;
    }

    .location3-btn::after {
      content: "";
      position: absolute;
      left: 20%;
      top: 50%;
      width: 34%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid rgba(255, 230, 145, 0.78);
      transform: translate(-50%, -50%);
      animation: locationRing3 2.5s ease-out infinite;
      pointer-events: none;
      box-shadow:
        0 0 16px rgba(255, 226, 135, 0.85),
        0 0 28px rgba(224, 190, 255, 0.35);
    }

    .location4-btn {
      left: 39.5%;
      top: 65.4%;
      width: 56%;
      animation: locationCake4 2.7s ease-in-out infinite;
      filter:
        drop-shadow(0 12px 15px rgba(88, 35, 110, 0.22))
        drop-shadow(0 0 13px rgba(255, 205, 160, 0.68));
    }

    .location4-btn::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 25% 48%, rgba(255,255,255,0.50), rgba(255,205,170,0.30) 36%, transparent 66%);
      opacity: 0;
      animation: locationGlow4 2.7s ease-in-out infinite;
      pointer-events: none;
    }

    .location4-btn::after {
      content: "";
      position: absolute;
      left: 20%;
      top: 50%;
      width: 34%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid rgba(255, 222, 170, 0.82);
      transform: translate(-50%, -50%);
      animation: locationRing4 2.25s ease-out infinite;
      pointer-events: none;
      box-shadow:
        0 0 16px rgba(255, 206, 150, 0.85),
        0 0 28px rgba(255, 235, 160, 0.35);
    }

    .location5-btn {
      left: 7.7%;
      top: 79.8%;
      width: 57%;
      animation: locationHeart5 2.45s ease-in-out infinite;
      filter:
        drop-shadow(0 12px 15px rgba(88, 35, 110, 0.22))
        drop-shadow(0 0 13px rgba(255, 170, 215, 0.72));
    }

    .location5-btn::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 24% 50%, rgba(255,255,255,0.50), rgba(255,170,215,0.30) 35%, transparent 66%);
      opacity: 0;
      animation: locationGlow5 2.45s ease-in-out infinite;
      pointer-events: none;
    }

    .location5-btn::after {
      content: "";
      position: absolute;
      left: 20%;
      top: 50%;
      width: 34%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid rgba(255, 190, 225, 0.82);
      transform: translate(-50%, -50%);
      animation: locationRing5 2.15s ease-out infinite;
      pointer-events: none;
      box-shadow:
        0 0 16px rgba(255, 175, 220, 0.85),
        0 0 28px rgba(255, 235, 160, 0.32);
    }

    .location-btn:active {
      animation: none;
      transform: scale(0.98);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(76, 39, 98, 0.42);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255,250,252,0.98), rgba(252,241,255,0.98));
      box-shadow:
        0 16px 42px rgba(100, 52, 128, 0.30),
        0 0 0 2px rgba(255, 242, 200, 0.75);
      padding: 25px 22px 22px;
      overflow: hidden;
      animation: modalIn .3s ease both;
    }

    .modal-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.85) 0%, transparent 25%),
        radial-gradient(circle at 80% 25%, rgba(255,240,190,0.5) 0%, transparent 22%),
        radial-gradient(circle at 70% 80%, rgba(240,220,255,0.5) 0%, transparent 24%);
      pointer-events: none;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at 35% 35%, #fffdf8 0%, #fff0db 55%, #f4d8ff 100%);
      color: #7d3f97;
      font-size: 24px;
      box-shadow:
        0 0 0 2px rgba(250, 220, 119, 0.8),
        0 6px 16px rgba(143, 82, 173, 0.22);
      z-index: 2;
    }

    .modal-title {
      position: relative;
      z-index: 1;
      color: #8b53a8;
      font-size: 28px;
      line-height: 1.12;
      text-align: center;
      margin-bottom: 14px;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    .modal-text {
      position: relative;
      z-index: 1;
      color: #70407f;
      font-size: 20px;
      line-height: 1.45;
      text-align: center;
    }

    .modal-text p + p {
      margin-top: 10px;
    }

    .hint {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      text-align: center;
      font-size: 15px;
      color: #9b78a8;
    }

    @keyframes mapAppear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes headerAppear {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes progressGlow {
      0%, 100% {
        box-shadow:
          0 0 0 2px rgba(255, 230, 145, 0.88),
          0 0 18px rgba(255, 224, 120, 0.68),
          0 10px 24px rgba(90, 35, 115, 0.22),
          inset 0 2px 7px rgba(255,255,255,0.86);
      }
      50% {
        box-shadow:
          0 0 0 3px rgba(255, 230, 145, 0.95),
          0 0 28px rgba(255, 224, 120, 0.95),
          0 12px 28px rgba(90, 35, 115, 0.28),
          inset 0 2px 7px rgba(255,255,255,0.9);
      }
    }

    @keyframes musicPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes twinkle {
      0%, 100% {
        transform: scale(0.8);
        opacity: 0.45;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes locationPulse1 {
      0%, 100% {
        transform: scale(1);
        filter:
          drop-shadow(0 10px 14px rgba(88, 35, 110, 0.22))
          drop-shadow(0 0 12px rgba(255, 225, 120, 0.62));
      }
      50% {
        transform: scale(1.035);
        filter:
          drop-shadow(0 13px 18px rgba(88, 35, 110, 0.30))
          drop-shadow(0 0 24px rgba(255, 225, 120, 0.95));
      }
    }

    @keyframes locationGlow1 {
      0%, 100% { opacity: 0.25; transform: scale(0.96); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }

    @keyframes locationRing1 {
      0% { transform: translate(-50%, -50%) scale(0.72); opacity: 0.8; }
      75% { transform: translate(-50%, -50%) scale(1.32); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.32); opacity: 0; }
    }

    @keyframes locationPulse2 {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter:
          drop-shadow(0 10px 14px rgba(88, 35, 110, 0.20))
          drop-shadow(0 0 10px rgba(207, 184, 255, 0.55));
      }
      50% {
        transform: translateY(-3px) scale(1.03);
        filter:
          drop-shadow(0 14px 18px rgba(88, 35, 110, 0.28))
          drop-shadow(0 0 22px rgba(218, 200, 255, 0.95));
      }
    }

    @keyframes locationGlow2 {
      0%, 100% { opacity: 0.22; transform: scale(0.97); }
      50% { opacity: 0.82; transform: scale(1.035); }
    }

    @keyframes locationRing2 {
      0% { transform: translate(-50%, -50%) scale(0.72); opacity: 0.85; }
      75% { transform: translate(-50%, -50%) scale(1.28); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.28); opacity: 0; }
    }

    @keyframes locationFloat3 {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter:
          drop-shadow(0 12px 15px rgba(88, 35, 110, 0.22))
          drop-shadow(0 0 12px rgba(255, 217, 132, 0.62));
      }
      50% {
        transform: translateY(-5px) scale(1.035);
        filter:
          drop-shadow(0 16px 20px rgba(88, 35, 110, 0.30))
          drop-shadow(0 0 24px rgba(255, 225, 145, 0.95));
      }
    }

    @keyframes locationGlow3 {
      0%, 100% { opacity: 0.24; transform: scale(0.96); }
      50% { opacity: 0.86; transform: scale(1.04); }
    }

    @keyframes locationRing3 {
      0% { transform: translate(-50%, -50%) scale(0.72); opacity: 0.85; }
      75% { transform: translate(-50%, -50%) scale(1.30); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.30); opacity: 0; }
    }

    @keyframes locationCake4 {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter:
          drop-shadow(0 12px 15px rgba(88, 35, 110, 0.22))
          drop-shadow(0 0 12px rgba(255, 205, 160, 0.65));
      }
      45% {
        transform: translateY(-4px) scale(1.035);
        filter:
          drop-shadow(0 16px 20px rgba(88, 35, 110, 0.30))
          drop-shadow(0 0 25px rgba(255, 210, 165, 0.95));
      }
      60% {
        transform: translateY(-2px) scale(1.02);
      }
    }

    @keyframes locationGlow4 {
      0%, 100% { opacity: 0.22; transform: scale(0.97); }
      50% { opacity: 0.86; transform: scale(1.04); }
    }

    @keyframes locationRing4 {
      0% { transform: translate(-50%, -50%) scale(0.72); opacity: 0.85; }
      75% { transform: translate(-50%, -50%) scale(1.28); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.28); opacity: 0; }
    }

    @keyframes locationHeart5 {
      0%, 100% {
        transform: scale(1);
        filter:
          drop-shadow(0 12px 15px rgba(88, 35, 110, 0.22))
          drop-shadow(0 0 12px rgba(255, 170, 215, 0.65));
      }
      35% { transform: scale(1.035); }
      50% {
        transform: scale(1.065);
        filter:
          drop-shadow(0 16px 20px rgba(88, 35, 110, 0.30))
          drop-shadow(0 0 25px rgba(255, 170, 215, 0.95));
      }
      68% { transform: scale(1.025); }
    }

    @keyframes locationGlow5 {
      0%, 100% { opacity: 0.22; transform: scale(0.97); }
      50% { opacity: 0.88; transform: scale(1.04); }
    }

    @keyframes locationRing5 {
      0% { transform: translate(-50%, -50%) scale(0.70); opacity: 0.85; }
      75% { transform: translate(-50%, -50%) scale(1.28); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.28); opacity: 0; }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 430px) {
      .round-btn {
        width: 54px;
        height: 54px;
        font-size: 25px;
      }

      .topbar {
        top: 12px;
        left: 12px;
        right: 12px;
      }

      .map-wrap {
        border-radius: 25px;
      }

      .map-image {
        border-radius: 25px;
      }

      .map-header {
        top: 5.4%;
        left: 13%;
        right: 13%;
      }

      .map-title {
        font-size: clamp(36px, 8.2vw, 50px);
      }

      .map-subtitle {
        margin-top: 10px;
        font-size: clamp(14px, 3.2vw, 18px);
      }

      .progress-panel {
        width: 74%;
        bottom: 4.1%;
        padding: 9px 12px 11px;
      }

      .progress-crown {
        width: 42px;
        height: 42px;
        font-size: 24px;
      }

      .progress-text {
        font-size: clamp(17px, 4vw, 21px);
      }

      .location1-btn {
        left: 8.7%;
        top: 19.2%;
        width: 58%;
      }

      .location2-btn {
        left: 39.3%;
        top: 37.7%;
        width: 55%;
      }

      .location3-btn {
        left: 7.6%;
        top: 51.2%;
        width: 56%;
      }

      .location4-btn {
        left: 39.5%;
        top: 65.4%;
        width: 56%;
      }

      .location5-btn {
        left: 7.7%;
        top: 79.8%;
        width: 57%;
      }

      .modal-title {
        font-size: 25px;
      }

      .modal-text {
        font-size: 18px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <audio
    id="bgMusic"
    src="./solarflex-magic-fantasy-fairy-tale-music-495646.mp3?v=1"
    autoplay
    loop
    preload="auto">
  </audio>

  <main class="page">

    <div class="topbar">
      <button id="backBtn" class="round-btn" type="button" aria-label="Назад">
        <span>←</span>
      </button>

      <button id="musicToggle" class="round-btn playing" type="button" aria-label="Вимкнути музику">
        <span>♪</span>
      </button>
    </div>

    <section class="map-wrap">
      <img
        class="map-image"
        src="./map.png?v=6"
        alt="Карта чарівної подорожі Софійки"
      />

      <div class="map-header">
        <div class="map-title">Карта чарівної<br>подорожі</div>
        <div class="map-subtitle">Пройди локації та знайди запрошення Софійки</div>
      </div>

      <div class="lights-layer">
        <div class="spark s1"></div>
        <div class="spark s2"></div>
        <div class="spark s3"></div>
        <div class="spark s4"></div>
        <div class="spark s5"></div>
        <div class="spark s6"></div>
        <div class="spark s7"></div>
      </div>

      <button class="location-btn location1-btn" id="loc1" type="button" aria-label="Знайомство з Софійкою">
        <img class="location-img" src="./location1.png?v=2" alt="Знайомство з Софійкою" />
      </button>

      <button class="location-btn location2-btn" id="loc2" type="button" aria-label="День хрещення">
        <img class="location-img" src="./location2.png?v=2" alt="День хрещення" />
      </button>

      <button class="location-btn location3-btn" id="loc3" type="button" aria-label="Святковий замок">
        <img class="location-img" src="./location3.png?v=1" alt="Святковий замок" />
      </button>

      <button class="location-btn location4-btn" id="loc4" type="button" aria-label="Королівська трапеза">
        <img class="location-img" src="./location4.png?v=1" alt="Королівська трапеза" />
      </button>

      <button class="location-btn location5-btn" id="loc5" type="button" aria-label="Підтвердження">
        <img class="location-img" src="./location5.png?v=1" alt="Підтвердження" />
      </button>

      <button class="progress-panel" id="progressPanel" type="button" aria-label="Прогрес відкритих локацій">
        <div class="progress-inner">
          <div class="progress-crown">👑</div>
          <div class="progress-text-wrap">
            <div class="progress-text" id="progressText">Відкрито 0 з 5 локацій</div>
            <div class="progress-dots">
              <span class="progress-dot" data-dot="1"></span>
              <span class="progress-dot" data-dot="2"></span>
              <span class="progress-dot" data-dot="3"></span>
              <span class="progress-dot" data-dot="4"></span>
              <span class="progress-dot" data-dot="5"></span>
            </div>
          </div>
        </div>
      </button>
    </section>

  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <button class="modal-close" id="closeModal" aria-label="Закрити">×</button>

      <div class="modal-title" id="modalTitle">Знайомство з Софійкою</div>

      <div class="modal-text" id="modalText">
        <p><strong>Привіт!</strong></p>
        <p>Мене звати <strong>Софійка</strong>.</p>
        <p>Я запрошую тебе у чарівну подорож, де наприкінці ти знайдеш моє особливе запрошення.</p>
      </div>

      <div class="hint">Натисни поза віконцем, щоб закрити</div>
    </div>
  </div>

  <script>
    const bgMusic = document.getElementById("bgMusic");
    const musicToggle = document.getElementById("musicToggle");
    const backBtn = document.getElementById("backBtn");

    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");
    const closeModal = document.getElementById("closeModal");

    const progressText = document.getElementById("progressText");
    const progressPanel = document.getElementById("progressPanel");
    const progressDots = document.querySelectorAll(".progress-dot");

    const loc1 = document.getElementById("loc1");
    const loc2 = document.getElementById("loc2");
    const loc3 = document.getElementById("loc3");
    const loc4 = document.getElementById("loc4");
    const loc5 = document.getElementById("loc5");

    bgMusic.volume = 0.35;

    let musicStarted = false;
    let musicMutedByUser = false;

    let openedLocations = new Set(
      JSON.parse(localStorage.getItem("sofiykaOpenedLocations") || "[]")
    );

    function saveProgress() {
      localStorage.setItem(
        "sofiykaOpenedLocations",
        JSON.stringify([...openedLocations])
      );
    }

    function updateProgress() {
      const count = openedLocations.size;
      progressText.textContent = `Відкрито ${count} з 5 локацій`;

      progressDots.forEach(dot => {
        const id = dot.getAttribute("data-dot");
        if (openedLocations.has(id)) {
          dot.classList.add("opened");
        } else {
          dot.classList.remove("opened");
        }
      });
    }

    function markOpened(id) {
      openedLocations.add(String(id));
      saveProgress();
      updateProgress();
    }

    async function startMusicImmediately() {
      if (musicMutedByUser) return;

      try {
        await bgMusic.play();
        musicStarted = true;
        musicToggle.classList.remove("off");
        musicToggle.classList.add("playing");
        musicToggle.querySelector("span").textContent = "♪";
        musicToggle.setAttribute("aria-label", "Вимкнути музику");
      } catch (error) {
        musicStarted = false;
        musicToggle.classList.remove("playing");
        musicToggle.classList.add("off");
        musicToggle.querySelector("span").textContent = "♪";
        musicToggle.setAttribute("aria-label", "Увімкнути музику");

        window.addEventListener("click", firstUserInteraction, { once: true });
        window.addEventListener("touchstart", firstUserInteraction, { once: true });
      }
    }

    async function firstUserInteraction() {
      if (musicMutedByUser) return;

      try {
        await bgMusic.play();
        musicStarted = true;
        musicToggle.classList.remove("off");
        musicToggle.classList.add("playing");
        musicToggle.querySelector("span").textContent = "♪";
        musicToggle.setAttribute("aria-label", "Вимкнути музику");
      } catch (error) {
        musicStarted = false;
      }
    }

    function pauseMusic() {
      bgMusic.pause();
      musicStarted = false;
      musicMutedByUser = true;
      musicToggle.classList.remove("playing");
      musicToggle.classList.add("off");
      musicToggle.querySelector("span").textContent = "♪";
      musicToggle.setAttribute("aria-label", "Увімкнути музику");
    }

    async function resumeMusic() {
      musicMutedByUser = false;

      try {
        await bgMusic.play();
        musicStarted = true;
        musicToggle.classList.remove("off");
        musicToggle.classList.add("playing");
        musicToggle.querySelector("span").textContent = "♪";
        musicToggle.setAttribute("aria-label", "Вимкнути музику");
      } catch (error) {
        musicStarted = false;
        musicToggle.classList.remove("playing");
        musicToggle.classList.add("off");
        musicToggle.querySelector("span").textContent = "♪";
      }
    }

    function openModal(title, html) {
      modalTitle.textContent = title;
      modalText.innerHTML = html;
      modal.classList.add("active");
    }

    musicToggle.addEventListener("click", (event) => {
      event.stopPropagation();

      if (musicStarted && !bgMusic.paused) {
        pauseMusic();
      } else {
        resumeMusic();
      }
    });

    backBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    progressPanel.addEventListener("click", () => {
      openModal(
        "Прогрес подорожі",
        `
          <p><strong>${progressText.textContent}</strong></p>
          <p>Натискай на локації, щоб відкривати частини чарівної подорожі Софійки.</p>
        `
      );
    });

    loc1.addEventListener("click", () => {
      markOpened(1);
      openModal(
        "Знайомство з Софійкою",
        `
          <p><strong>Привіт!</strong></p>
          <p>Мене звати <strong>Софійка</strong>.</p>
          <p>Я запрошую тебе у чарівну подорож, де наприкінці ти знайдеш моє особливе запрошення.</p>
        `
      );
    });

    loc2.addEventListener("click", () => {
      markOpened(2);
      openModal(
        "День хрещення",
        `
          <p><strong>Таїнство Хрещення</strong></p>
          <p>Дата: <strong>27 червня 2026 року</strong></p>
          <p>Час і місце ми додамо трохи пізніше.</p>
          <p>Це буде світлий і особливий день для нашої Софійки.</p>
        `
      );
    });

    loc3.addEventListener("click", () => {
      markOpened(3);
      openModal(
        "Святковий замок",
        `
          <p><strong>Після хрещення ми вирушимо до святкового замку.</strong></p>
          <p>Тут буде тепло, красиво і по-сімейному затишно.</p>
          <p>Саме тут ми продовжимо святкування особливого дня Софійки.</p>
        `
      );
    });

    loc4.addEventListener("click", () => {
      markOpened(4);
      openModal(
        "Королівська трапеза",
        `
          <p><strong>Час для святкової трапези.</strong></p>
          <p>Тут ми зберемося разом, щоб відсвяткувати особливий день Софійки.</p>
          <p>Попереду буде смачно, красиво і дуже по-родинному.</p>
        `
      );
    });

    loc5.addEventListener("click", () => {
      markOpened(5);
      openModal(
        "Підтвердження",
        `
          <p><strong>Ти майже знайшов чарівне запрошення!</strong></p>
          <p>Залишився останній крок — підтвердити свою присутність.</p>
          <p>Натисни кнопку підтвердження, щоб ми знали, що ти будеш з нами.</p>
        `
      );
    });

    closeModal.addEventListener("click", () => {
      modal.classList.remove("active");
    });

    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        modal.classList.remove("active");
      }
    });

    window.addEventListener("load", () => {
      updateProgress();
      startMusicImmediately();
    });
  </script>

</body>
</html>
