<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Карта чарівної подорожі</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --violet: #74318d;
      --violet-dark: #5d2477;
      --gold: #f1d96e;
      --soft-gold: rgba(255, 236, 150, 0.86);
      --pink-bg: #ffeef8;
      --total-width: 520px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "Cormorant Garamond", serif;
      color: var(--violet);
      background:
        linear-gradient(180deg, #fff2fb 0%, #e8f6ff 80%, #ffe8ef 100%);
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: var(--total-width);
      margin: 0 auto;
      min-height: 100vh;
      padding: 10px 10px 34px;
    }

    .map-scene {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      min-height: 760px;
      max-height: 1180px;
      overflow: hidden;
      border-radius: 0 0 34px 34px;
      background:
        linear-gradient(rgba(255,255,255,0.04), rgba(255,255,255,0.04)),
        url("map_bg.png") center center / cover no-repeat,
        radial-gradient(circle at 50% 18%, #ffe9b7 0%, #f7cdea 32%, #b9d5ff 100%);
      box-shadow:
        0 18px 36px rgba(82, 43, 110, 0.18),
        inset 0 0 80px rgba(255,255,255,0.22);
    }

    .map-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 15%, rgba(255,255,255,0.25), transparent 24%),
        radial-gradient(circle at 85% 72%, rgba(255,214,239,0.20), transparent 26%);
      z-index: 1;
    }

    .top-buttons {
      position: absolute;
      top: 2.2%;
      left: 3.3%;
      right: 3.3%;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .round-btn {
      pointer-events: auto;
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      color: var(--violet);
      font-size: 31px;
      font-weight: 700;
      font-family: "Cormorant Garamond", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 30% 25%, #ffffff 0%, #fff9df 34%, #ffe38c 66%, #f0ba4e 100%);
      box-shadow:
        0 0 0 3px rgba(255, 245, 200, 0.92),
        0 0 0 6px rgba(255, 215, 90, 0.34),
        0 0 24px rgba(255, 220, 95, 0.72),
        0 8px 18px rgba(90, 35, 115, 0.22),
        inset 0 4px 7px rgba(255,255,255,0.95),
        inset 0 -7px 12px rgba(120,70,20,0.13);
      -webkit-tap-highlight-color: transparent;
    }

    .round-btn::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.78);
      pointer-events: none;
    }

    .round-btn span {
      position: relative;
      z-index: 2;
      line-height: 1;
      transform: translateY(-1px);
    }

    .round-btn.music {
      background:
        radial-gradient(circle at 30% 25%, #ffffff 0%, #fff9df 34%, #ffe38c 66%, #f0ba4e 100%);
    }

    .round-btn.music.playing {
      background:
        radial-gradient(circle at 30% 25%, #ffffff 0%, #f6e9ff 38%, #d6a9ff 72%, #8e55b5 100%);
      color: #ffffff;
      animation: musicPulse 1.7s ease-in-out infinite;
    }

    .map-title {
      position: absolute;
      z-index: 10;
      top: 7.4%;
      left: 9%;
      right: 9%;
      text-align: center;
      pointer-events: none;
    }

    .map-title h1 {
      font-size: clamp(43px, 9vw, 66px);
      line-height: 0.92;
      font-weight: 700;
      color: var(--violet);
      text-shadow:
        0 2px 0 rgba(255,255,255,0.86),
        0 6px 14px rgba(82, 43, 110, 0.18),
        0 0 22px rgba(255, 230, 160, 0.62);
    }

    .map-title p {
      margin-top: 14px;
      font-size: clamp(18px, 4.2vw, 26px);
      line-height: 1.15;
      font-weight: 700;
      color: #71408c;
      text-shadow: 0 2px 0 rgba(255,255,255,0.66);
    }

    .spark {
      position: absolute;
      z-index: 3;
      width: 22px;
      height: 22px;
      pointer-events: none;
      opacity: 0.75;
      animation: sparkle 2.6s ease-in-out infinite;
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255, 241, 140, 0.9);
      border-radius: 999px;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 18px rgba(255, 238, 130, 0.85);
    }

    .spark::before {
      width: 4px;
      height: 22px;
    }

    .spark::after {
      width: 22px;
      height: 4px;
    }

    .s1 { top: 12%; left: 28%; animation-delay: 0s; }
    .s2 { top: 30%; right: 12%; animation-delay: .7s; }
    .s3 { top: 61%; left: 19%; animation-delay: 1.2s; }
    .s4 { bottom: 15%; right: 38%; animation-delay: .35s; }

    .map-location {
      position: absolute;
      z-index: 8;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.2s ease,
        filter 0.2s ease,
        opacity 0.2s ease;
    }

    .map-location img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter:
        drop-shadow(0 8px 15px rgba(90, 35, 115, 0.20))
        drop-shadow(0 0 12px rgba(255, 230, 150, 0.42));
    }

    .map-location.unlocked {
      cursor: pointer;
      opacity: 1;
      filter: none;
      animation: softFloat 4.6s ease-in-out infinite;
    }

    .map-location.completed img {
      filter:
        drop-shadow(0 9px 16px rgba(90, 35, 115, 0.19))
        drop-shadow(0 0 15px rgba(255, 235, 140, 0.72));
    }

    .map-location.locked {
      cursor: not-allowed;
      opacity: 0.58;
      filter: grayscale(1) saturate(0.38);
      animation: none;
    }

    .map-location.locked img {
      filter:
        grayscale(1)
        saturate(0.35)
        drop-shadow(0 6px 12px rgba(50, 35, 70, 0.16));
    }

    .map-location:active {
      transform: scale(0.97);
    }

    .map-location.unlocked:hover {
      transform: translateY(-2px) scale(1.015);
    }

    .lock-mark {
      position: absolute;
      right: 5%;
      top: 7%;
      z-index: 4;
      display: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.82);
      color: #6d4b7e;
      font-size: 16px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 12px rgba(90,35,115,0.16);
      pointer-events: none;
    }

    .map-location.locked .lock-mark {
      display: flex;
    }

    .loc-fallback {
      display: none;
      min-width: 190px;
      padding: 14px 18px;
      border-radius: 26px;
      background: rgba(255,255,255,0.84);
      border: 2px solid rgba(238, 219, 127, 0.82);
      color: var(--violet);
      font-size: 20px;
      line-height: 1.05;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(90,35,115,0.16);
    }

    .loc-1 {
      width: 63%;
      left: 8%;
      top: 21.5%;
    }

    .loc-2 {
      width: 68%;
      right: 4.5%;
      top: 35%;
    }

    .loc-3 {
      width: 58%;
      left: 7.5%;
      top: 49.3%;
    }

    .loc-4 {
      width: 60%;
      right: 5%;
      top: 63%;
    }

    .loc-5 {
      width: 59%;
      left: 7%;
      top: 77.4%;
    }

    .progress-card {
      position: absolute;
      z-index: 15;
      left: 15%;
      right: 15%;
      bottom: 3.2%;
      min-height: 82px;
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.86), rgba(255,238,252,0.78));
      border: 2px solid rgba(238, 219, 127, 0.85);
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.42),
        0 10px 22px rgba(90,35,115,0.16),
        inset 0 3px 8px rgba(255,255,255,0.82);
      display: grid;
      grid-template-columns: 66px 1fr;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      animation: progressBreath 5s ease-in-out infinite;
    }

    .progress-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, #ffffff 0%, #fff5d5 38%, #e5b4ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
      box-shadow:
        0 0 0 2px rgba(255, 229, 135, 0.85),
        0 0 14px rgba(255, 224, 120, 0.55),
        inset 0 3px 6px rgba(255,255,255,0.86);
    }

    .progress-content {
      min-width: 0;
      text-align: center;
    }

    .progress-text {
      font-size: clamp(21px, 4.9vw, 29px);
      line-height: 1;
      font-weight: 700;
      color: var(--violet);
      text-shadow: 0 1px 0 rgba(255,255,255,0.86);
      margin-bottom: 9px;
    }

    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    .progress-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(188, 176, 199, 0.7);
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.65),
        0 1px 3px rgba(80,40,100,0.16);
    }

    .progress-dot.active {
      background:
        radial-gradient(circle at 30% 25%, #fffdf2 0%, #ffd86b 50%, #b85ad4 100%);
      box-shadow:
        0 0 0 2px rgba(255, 229, 135, 0.55),
        0 0 10px rgba(255, 218, 110, 0.75);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 100;
      transform: translateX(-50%) translateY(18px);
      width: calc(100% - 40px);
      max-width: 420px;
      padding: 13px 18px;
      border-radius: 22px;
      background: rgba(117, 76, 150, 0.95);
      color: #ffffff;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(117, 76, 150, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    audio {
      display: none;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.85) rotate(0deg);
      }

      50% {
        opacity: 0.95;
        transform: scale(1.15) rotate(10deg);
      }
    }

    @keyframes softFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes progressBreath {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes musicPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @media (max-width: 430px) {
      .page {
        padding-left: 8px;
        padding-right: 8px;
      }

      .map-scene {
        min-height: 710px;
      }

      .round-btn {
        width: 58px;
        height: 58px;
        font-size: 29px;
      }

      .map-title {
        top: 7.2%;
        left: 8%;
        right: 8%;
      }

      .loc-1 {
        width: 62%;
        left: 8%;
        top: 22%;
      }

      .loc-2 {
        width: 67%;
        right: 4%;
        top: 35.4%;
      }

      .loc-3 {
        width: 58%;
        left: 7%;
        top: 49.8%;
      }

      .loc-4 {
        width: 60%;
        right: 4%;
        top: 63.5%;
      }

      .loc-5 {
        width: 60%;
        left: 6%;
        top: 77.6%;
      }

      .progress-card {
        left: 14%;
        right: 14%;
        bottom: 3%;
        min-height: 76px;
        grid-template-columns: 58px 1fr;
        padding: 9px 13px;
      }

      .progress-icon {
        width: 49px;
        height: 49px;
        font-size: 28px;
      }

      .progress-dot {
        width: 13px;
        height: 13px;
      }
    }
  </style>
</head>

<body class="notranslate">

  <main class="page">
    <section class="map-scene">

      <div class="top-buttons">
        <button class="round-btn" id="backBtn" type="button" aria-label="Назад">
          <span>←</span>
        </button>

        <button class="round-btn music" id="musicBtn" type="button" aria-label="Музика">
          <span>♪</span>
        </button>
      </div>

      <div class="map-title">
        <h1>Карта чарівної<br>подорожі</h1>
        <p>Пройди локації та знайди запрошення Софійки</p>
      </div>

      <span class="spark s1"></span>
      <span class="spark s2"></span>
      <span class="spark s3"></span>
      <span class="spark s4"></span>

      <button class="map-location loc-1" data-location="1" type="button" aria-label="Локація 1">
        <img src="location1.png" alt="Знайомство з Софійкою" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="loc-fallback">1. Знайомство<br>з Софійкою</span>
        <span class="lock-mark">🔒</span>
      </button>

      <button class="map-location loc-2" data-location="2" type="button" aria-label="Локація 2">
        <img src="location2.png" alt="День хрещення" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="loc-fallback">2. День<br>хрещення</span>
        <span class="lock-mark">🔒</span>
      </button>

      <button class="map-location loc-3" data-location="3" type="button" aria-label="Локація 3">
        <img src="location3.png" alt="Святковий замок" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="loc-fallback">3. Святковий<br>замок</span>
        <span class="lock-mark">🔒</span>
      </button>

      <button class="map-location loc-4" data-location="4" type="button" aria-label="Локація 4">
        <img src="location4.png" alt="Королівська трапеза" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="loc-fallback">4. Королівська<br>трапеза</span>
        <span class="lock-mark">🔒</span>
      </button>

      <button class="map-location loc-5" data-location="5" type="button" aria-label="Локація 5">
        <img src="location6.png" alt="Підтвердження" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="loc-fallback">5. Підтвердження</span>
        <span class="lock-mark">🔒</span>
      </button>

      <div class="progress-card">
        <div class="progress-icon">👑</div>
        <div class="progress-content">
          <div class="progress-text" id="progressText">Відкрито 1 з 5 локацій</div>
          <div class="progress-dots">
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
          </div>
        </div>
      </div>

    </section>
  </main>

  <div class="toast" id="toast"></div>

  <audio id="bgMusic" loop preload="auto">
    <source src="solarflex-magic-fantasy-fairy-tale-music-495646.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const TOTAL_LOCATIONS = 5;

    const locationPages = {
      1: "location1.html",
      2: "location2.html",
      3: "location3.html",
      4: "location4.html",
      5: "location5.html"
    };

    const locationNames = {
      1: "Знайомство з Софійкою",
      2: "День хрещення",
      3: "Святковий замок",
      4: "Королівська трапеза",
      5: "Підтвердження"
    };

    const bgMusic = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");
    const backBtn = document.getElementById("backBtn");
    const toast = document.getElementById("toast");
    const progressText = document.getElementById("progressText");
    const progressDots = document.querySelectorAll(".progress-dot");
    const locationButtons = document.querySelectorAll(".map-location");

    if (bgMusic) {
      bgMusic.volume = 0.35;
    }

    function isLocationDone(number) {
      return localStorage.getItem("sofiyka_location" + number + "_done") === "true";
    }

    function isLocationUnlocked(number) {
      if (number === 1) return true;
      return isLocationDone(number - 1);
    }

    function getOpenedCount() {
      let opened = 1;

      for (let i = 1; i < TOTAL_LOCATIONS; i++) {
        if (isLocationDone(i)) {
          opened++;
        } else {
          break;
        }
      }

      return Math.min(opened, TOTAL_LOCATIONS);
    }

    function updateMapState() {
      const opened = getOpenedCount();

      locationButtons.forEach(function(button) {
        const number = Number(button.dataset.location);
        const unlocked = isLocationUnlocked(number);
        const done = isLocationDone(number);

        button.classList.remove("locked", "unlocked", "completed");

        if (unlocked) {
          button.classList.add("unlocked");
          button.disabled = false;
        } else {
          button.classList.add("locked");
          button.disabled = false;
        }

        if (done) {
          button.classList.add("completed");
        }
      });

      if (progressText) {
        progressText.textContent = "Відкрито " + opened + " з " + TOTAL_LOCATIONS + " локацій";
      }

      progressDots.forEach(function(dot, index) {
        if (index < opened) {
          dot.classList.add("active");
        } else {
          dot.classList.remove("active");
        }
      });
    }

    function openLocation(number) {
      number = Number(number);

      if (!isLocationUnlocked(number)) {
        const previous = number - 1;
        showToast("Спочатку потрібно пройти локацію " + previous + " ✨");
        return;
      }

      if (!locationPages[number]) {
        showToast("Цю локацію ще не додано ✨");
        return;
      }

      window.location.href = locationPages[number];
    }

    function showToast(message) {
      if (!toast) {
        alert(message);
        return;
      }

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast._timer);

      showToast._timer = setTimeout(function() {
        toast.classList.remove("show");
      }, 1900);
    }

    locationButtons.forEach(function(button) {
      button.addEventListener("click", function(event) {
        event.preventDefault();
        event.stopPropagation();

        const number = Number(button.dataset.location);
        openLocation(number);
      });
    });

    backBtn.addEventListener("click", function(event) {
      event.preventDefault();
      event.stopPropagation();

      window.location.href = "index.html";
    });

    musicBtn.addEventListener("click", async function(event) {
      event.preventDefault();
      event.stopPropagation();

      if (!bgMusic) return;

      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          musicBtn.classList.add("playing");
          localStorage.setItem("sofiyka_music", "on");
        } else {
          bgMusic.pause();
          musicBtn.classList.remove("playing");
          localStorage.setItem("sofiyka_music", "off");
        }
      } catch (error) {
        showToast("Музика не запустилась. Перевір mp3 файл 🎵");
      }
    });

    function restoreMusicState() {
      const musicState = localStorage.getItem("sofiyka_music");

      if (musicState === "on" && bgMusic) {
        bgMusic.play().then(function() {
          musicBtn.classList.add("playing");
        }).catch(function() {
          musicBtn.classList.remove("playing");
        });
      }
    }

    window.openLocation = openLocation;
    window.goToLocation = openLocation;
    window.updateMapState = updateMapState;

    updateMapState();
    restoreMusicState();
  </script>

</body>
</html>
